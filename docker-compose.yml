services:
  # 主从两个容器共用同一镜像。
  #
  # 镜像引用的是**我们自己维护的那份**：CNB 流水线构建后镜像到
  # docker.cnb.cool/xzydm/mirrors/lazy-balancer-v2。刻意不指向上游的
  # v55448330/lazy-balancer-v2——那个 tag 随上游发版往前跑，会把我们的定制
  # 改动悄悄换成上游原版，出现「代码是我们改的、跑的是上游」的版本错乱。
  # 上游镜像仅作对照参考，请勿在此文件里引用。
  #
  # 本地开发迭代时执行：docker compose build lazy-balancer && docker compose up -d
  # （build 段仍然就地构建，即当前工作区代码；image 只是给不 build 的场景兜底）
  lazy-balancer:
    image: docker.cnb.cool/xzydm/mirrors/lazy-balancer-v2:latest
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    build:
      context: .
      args:
        VERSION: v2.3.4
    container_name: lazy-balancer
    network_mode: host
    # Port mapping is not used with host network; Caddy binds directly to host ports.
    volumes:
      - lb-data:/app/data # named volume：SQLite WAL 不经宿主共享层（gRPC FUSE/VirtioFS 丢页族根治，2026-09-20 两次事故后裁定）
      - ./logs:/app/logs
      - ./certs:/app/certs
      - ./waf:/app/waf
      # 自动备份落盘目录（v2.3.x，仅主节点调度写入；测试环境两容器共享目录无竞争）
      - ./backup:/app/backup
    environment:
      - NODE_NAME=master
      - LOG_FILE=/app/logs/lazy-balancer.log
      # —— 端口换位（80/443/8000 被占用时改这里）——
      # host 网络下这是 Caddy/面板的「实际监听口」，不是端口转发：改 HTTP_PORT=8080
      # 后 80 不再被本容器监听。只影响默认语义（新建规则向导默认值、兜底站与
      # HTTP→HTTPS 跳转落点、80/443 保留端口判定）；存量规则 listen_port 是持久化
      # 数据，不会被自动迁移——需手动逐条改成新端口后保存。详见 docs/deployment.zh-CN.md
      - HTTP_PORT=80
      - HTTPS_PORT=443
      - PANEL_PORT=8000
    restart: unless-stopped
    healthcheck:
      # 探针须模式无关：面板默认强制 HTTPS（明文 HTTP 得 301），而 admin_tls 关闭时
      # 又只有明文可用；镜像内无 curl（仅构建期临时安装后 apk del），busybox wget
      # 的 --no-check-certificate 经实证可完成自签 TLS 探测（第 47 轮 F-47-30）。
      # PANEL_PORT 改动后此处需同步替换 8000。
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1:8000/health || wget -q -O /dev/null http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # 生产 fd 上限：每个连接一个 fd（含 TLS/日志），默认 1024 在 LB 场景必炸。
    # 详见 docs/production-tuning.zh-CN.md §1
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

  # 从节点测试实例：bridge 网络，仅将容器 8000 映射到宿主机 8001，避免与主节点(host 网络)端口冲突
  # 主节点地址注册时填写: http://host.docker.internal:8000
  lazy-balancer-slave:
    # 同主节点：引用我们自维护的镜像，不跟上游 tag 走
    image: docker.cnb.cool/xzydm/mirrors/lazy-balancer-v2:latest
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    container_name: lazy-balancer-slave
    ports:
      - "8001:8000"
    volumes:
      - lb-data-slave:/app/data # 同上（从节点独立卷）
      - ./logs-slave:/app/logs
      - ./certs-slave:/app/certs
      # 独立 WAF 目录：两节点的 CRS/IP2Region 每日更新会并发写共享目录，存在竞争
      - ./waf-slave:/app/waf
      # 与主节点共享备份目录：从节点不调度写入，仅目录存在以保配置路径一致
      - ./backup:/app/backup
    environment:
      - NODE_NAME=slave-test
      - LOG_FILE=/app/logs/lazy-balancer.log
      # 从节点测试实例的面板口固定 8000（bridge 网络映射 8001:8000），不跟随
      # HTTP_PORT/HTTPS_PORT——那是代理口，本实例不承载代理流量。
      - PANEL_PORT=8000
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    restart: unless-stopped
    healthcheck:
      # 探针须模式无关：面板默认强制 HTTPS（明文 HTTP 得 301），而 admin_tls 关闭时
      # 又只有明文可用；镜像内无 curl（仅构建期临时安装后 apk del），busybox wget
      # 的 --no-check-certificate 经实证可完成自签 TLS 探测（第 47 轮 F-47-30）。
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1:8000/health || wget -q -O /dev/null http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  lb-data:
  lb-data-slave:
