# ---- 翰林学士：**评论双事件同源**（issue/pull_request comment@npc 共用 .hy_pipelines 锚点）。
#      `api_trigger:` 键据实**不作生效通道**（角色段 API 事件不被匹配，详见上方「通道面」段）——
