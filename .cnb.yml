
# ---- 单角色换模型示例（如需给某岗位换更强模型，参照此写法；注意顶层 key 与角色名严格一致）----
# 某角色:
#   issue.comment@npc:
#     - docker:
#         image: cnbcool/default-npc:latest
#       stages:
#         - name: npc go
#           type: npc:go
#           options:
#             model: deepseek-v4-pro        # 例：刑部质量岗可换更强模型（可能计费）

# Lazy Balancer V2 · CNB 流水线
#
# 两类事件：
#   1) vscode：仓库页面「云原生开发」按钮 → 远程开发环境（Go 1.26 + Node 22 + sqlite）
#   2) web_trigger_docker_build：页面自定义按钮（见 .cnb/web_trigger.yml）→
#      amd64/arm64 原生并行构建镜像 → 探活 → 推送 → 合成多架构 manifest
#      → 再把 latest 多架构镜像额外镜像一份到 xzydm/mirrors 仓库
#
# 适配约定：仓库名、镜像源一律走内置变量（${CNB_REPO_SLUG_LOWERCASE} /
# ${CNB_REPO_NAME_LOWERCASE} / ${CNB_DOCKER_REGISTRY}），**零硬编码仓库名**，
# 本文件可直接复制到任意 CNB 仓库使用。唯一例外是 mirror 目标仓库
# （manifest 作业的 MIRROR_REPO_SLUG），它必须显式指向一个外部仓库；
# 置空即关闭镜像，复制本文件到其它仓库时按需修改或留空。
#
# 两者都必须写在 `$`（兜底分支）下：vscode 属仓库级事件（与分支无关），
# web_trigger 也建议放兜底分支以免漏配分支。


# CNB 流水线 —— 三省六部 NPC 触发配置（v4 · 调兵遣将版）
#
# 架构要点（与 AGENTS.md 第六节配套）：
#   1) 用户只 @中书令 一个角色（勾一次「替我上班」），中书令负责调兵遣将。
#   2) 调兵通道·**态A（唯一可称「主通道」的态）**【api_trigger 链式触发】用于【同根组织 ∧ 目标仓
#      `.cnb/settings.yml` 可解析出该角色】调度（三态判据见下方第 5 条）：中书令在流水线内执行
#        cnb build start-build --repo <本仓> --branch main --event api_trigger \
#          --npc-name CodeBuddy --npc-workMode --sync false \
#          --env NPC_ROLE=工部尚书 --env SUMMON_BRIEF='【诏令】...' --title '【诏令】工部·...'
#      平台随即为被召角色拉起 api_trigger 流水线，命中 $:api_trigger 段，npc:go 按 NPC_ROLE
#      从 .cnb/settings.yml 解析角色 prompt 执行——链上每一环默认「替我上班」，用户全程无需再勾。
#   3) 跨根组织【独立第三方在自己组织】场景（目标仓与 i.o 不同根）不用 api_trigger（其跨根解析不到
#      i.o 角色），改用【评论嵌套 @ 接力】：真人(≥Developer)首棒勾「替我上班」后，整条嵌套 @ 链
#      跨根也拿 repo-code:rw/repo-pr:rw 可全线无人值守写码（外部 npcteam 项目三仓实弹验证，见
#      AGENTS.md 14.4②）。NPC 发带 work_mode 的评论须用支持 --work-mode 的评论接口
#      （cnb issues/pulls post-*-comment --body-file ... --work-mode），普通 comment 不带 work_mode。
#   4) 评论 @ 触发（issue.comment@npc / pull_request.comment@npc）同时服务于：对话点名（纯对话 · 非调兵通道）、
#      以及跨根组织接力（态B，须带 work_mode 令牌发评）。
#       ★ 仓库路径锚定：凡评论/调度中的 NPC 角色 @ 提及一律带完整仓库路径 **@i.o/x(<角色>)**（如
#      @i.o/x(中书令)），确保任意场景、任意仓库评论都能解析到本仓角色正常激活——平台按 @ 后仓库路径
#      定位 NPC 所属仓库（@<组织>/<仓库>(<角色>)），绝不用省略仓库路径的裸 @<角色> 或半路径（缺全路径
#      解析不到本仓角色），见 AGENTS.md 第六节。
#   5) 跨仓前提**不是「二选一」而是三态**（本条已修订，旧「分两路（同根 api_trigger / 跨根评论接力）」
#      表述**已废止**，以下方 ★【通道选型三态判据】为唯一口径）。本体系不向任何仓库安装/复制三件套、
#      不以引导 star 换写码。
#      ★【通道选型三态判据（#TASK-ORCH-CHANNEL-DEDUP-20261002-01 AC-4）】—— 调兵**不是**「二选一」而是**三态**，
#        仅**态A** 可称「主通道」：
#          · **态A**：同根组织 ∧ 目标仓 `.cnb/settings.yml` 可解析（`npc.roles` 含该角色）⇒ 走 **api_trigger 调兵令（唯一可称「主通道」的态）**；
#          · **态B**：跨根 ∧ 有**真人首棒**（目标仓 ≥Developer）勾「替我上班」⇒ 走**评论嵌套 @ 接力**（须带 work_mode 令牌发评）；
#          · **态C**：跨根 ∧ 无真人首棒 / 无写权 ⇒ **通道不成立**：如实告知只做对话级服务，**禁发 api_trigger**
#            （跨根必 403 或**空载荷假成功**——`role`/`SUMMON_BRIEF` 全空仍 `success`，比 403 更隐蔽）。
#        ★ 特例：**同根 ∧ 目标仓无 `settings`** ⇒ 改走 `api_trigger_npc` **内联提示词**（`role/systemPrompt/userPrompt`
#          全内联、**禁注入完整总纲**，守 AGENTS.md §6.6-C）。
#        ★【派单前通道硬前置（三项实测）】发任何调兵令前须实测 ① 同根 ② settings 可解析 ③ 写权；任一不成立即**不得发 api_trigger**
#          （手顺与命令体见 main 心跳段 userPrompt「派单前通道硬前置」处；判据源 AGENTS.md §6/§14.4）。
#        ★【落地态（上位轴 · 三态之上 · #TASK-CHANNEL-DOCTRINE-20261006-01）】选通道**先判目标仓有无落地**
#          （`.cnb.yml`／NPC 配置／构建流水线；**落地判据＝目标仓根 `GET /{repo}/-/git/raw/HEAD/.cnb.yml` 可得〔有落地 200／无落地 404（负控 `i.o/no-such-repo-zzz`）；取证须用有读权令牌，无读权 404 ≠ 0 落地〕，取证落台账**）——**有落地** ⇒ 心跳或 api_trigger 调兵可用（上方三态照旧）；
#          **0 落地** ⇒ **评论 @ 为唯一（必选）通道**（吃 Issue 配额、守 AGENTS.md §6.4 续接；**该场景下评论 @ 兼作写码/续接通道，不受 §6『纯对话 · 非调兵通道』条『不需写码』限定**）；
#          **0 落地不得设想「内置密钥／凭据」式拉起**（一律评论 @）；本条**不授权**非 0 落地场景禁评论 @（跨根／断链兜底仍在）。
#          依据＝AGENTS.md §6 头部；矩阵见 `casebook/platform.md`；提示词载体＝下方 `$: api_trigger` → `奉诏执行` → `options.systemPrompt`。
#   6) 构建失败自愈（无人值守自我修复）：$ 段 pull_request（PR 安全网）流水线补了 failStages——
#      当该流水线任一 stage 失败时，自动执行 npc:go 拉起【工部尚书】诊断并修复：读
#      CNB_BUILD_FAILED_MSG（failStages 运行时可用，转储到共享 /workspace）+ cnb build get-build-logs
#      定位失败根因 → 在 /workspace 修代码/配置 → 本地复验（可补跑相关命令，防假修复）→ 推修复
#      commit/PR → 链式触发刑部尚书复审。让"任意 error 停摆"不再阻塞无人值守闭环。
#   6a) 【自愈环·非收敛熔断】（#TASK-QG-CIRCUITBREAKER-20260910-01）——自愈环本身必须有上限与升级出口，
#      否则 failStages → push → 新 CI → gate 再红 → 再自愈 会无界空转（PR #186 实录：16 轮往返、评论 117 条）。
#      failStages 在「工部尚书自愈」之前插入「自愈熔断判定」script stage：统计本分支自愈轮次 /
#      缺陷指纹（对 qg-刑部+qg-门下 提取 P 编号集合），达阈值（默认 3 轮）或连续 2 轮同族缺陷 → 写
#      /workspace/qg-熔断.txt、**跳过工部自愈**（自愈 stage 加 `if` 守卫）、改走升级出口 api_trigger 拉起中书令裁决
#      （api_trigger 不吃评论配额，是 PR 撞线后唯一可靠派单通道）；熔断后**不再自动 push 修复 commit**。
#      ★ **终局裁决冻结前置（F-308a 守卫前置 · #TASK-FUSE-AFTER-FREEZE-20261006-01）**：本 stage **入口**先读
#        `/workspace/qg-裁决冻结.txt`（由上一 stage「转储失败信息」的 F-308a 段在「台账 closed·not_planned ∧ 有换方案
#        承接台账」时写入）——**在位 ⇒ 不写 qg-熔断.txt、不发升级出口 a/b、本 stage 早退**；**取不到 ⇒ 照常判定、
#        照常升级**（fail-closed，与 F-308a 判据本体同向：**禁**据「取不到」静默早退=误停升级）。
#        为什么：哨兵原先**只挂在「工部尚书自愈」stage**，其**前**的本 stage 不读 ⇒ 已终局裁决的分支再产生一次
#        失败 CI 时照常计轮 TRIP、走升级出口，把**已裁决过的旧单**重复投给中书令（#566 实录：05:39Z 裁决 →
#        05:53Z 又一条「熔断升级 · 换方案请求」送达）。机械锁：`scripts/gate-regression.sh` **C-FUSE-FREEZE** 组
#        （静态：取值行存在 + 早退行位于升级出口之前；行为：哨兵在位⇒不写熔断文件且零升级调用 / 不在位⇒照常；
#        负向：抹除或后置守卫 ⇒ 判红）。
#      ★ **终局裁决冻结感知（F-308c 心跳侧 · #TASK-FUSE-FOLLOWUP-20261006-01）**：巡检「维③ 熔断兜底」「维⑦ PR 自愈
#        轮次超限」在**发起 api_trigger 之前**先跑第①维同款冻结判定（复用第①维冻结判据哨兵块、禁另立第二份判据文本）——
#        `FROZEN=yes` ⇒ 只登记不派（防已终局裁决的单经 crontab 通道重复投给中书令）；`FROZEN=no|?`（取不到）⇒ 照常判定照常拉起
#        （fail-closed 方向与第①维相反：误停升级比重复投递更危险）。机械锁：`scripts/gate-regression.sh` **C-FUSE-HB** 组。
#      ★ 判据为机器可读且**零写权可达**（#TASK-SELFHEAL-MECH-20260912-01-R4 · 判据源去载体）：
#        轮次 = **直读分支 git 历史**的 `^QG-Fingerprint:` 尾行数——**口径为「分段」**（F-134 起：以最近一次
#        `^QG-Reset:` 归零 commit 为基线 `CNT_BASE`，只数 `CNT_BASE..HEAD`；无归零留痕时基线＝`origin/默认分支`，
#        与旧累计口径逐字一致）⇒ **唯一判据源＝下方熔断 stage 内 `#<<BREAKER_CNT_SH … #BREAKER_CNT_SH>>` 哨兵块**
#        （本行不复述数值/命令，见该块 + 其上方 F-134 说明）——
#        `pull_request`（不可信事件、无 `repo-code:rw`）**只读即可判定**。同族=上轮指纹集合与本轮**互含（无新增缺陷）**——有新增即有实质进展、放行自愈（防首轮即误熔断）。
#      ★ **载体消除（R4）**：本判据**不引入任何分支级二次载体**——无 `refs/qg-breaker/<branch>` 标记 ref、
#        无 marker 写侧 / 读侧 / gc / prune 链路、无心跳写实体、无 `git push`（判据链内 `git push` 命中 0）。
#        为什么：marker 的唯一写手段是 `git push`，在 `pull_request` 不可信事件下**结构不可达**（实证 rc=1「push 被拒」）；
#        迁「可信事件写侧」（心跳）后又引入 `git fetch` 漏检 rc 的 fail-open 整族缺陷（连红 3 轮未收敛，PR#306 实录）。
#        故按中书令第四次换方案裁决**消除载体而非逐点补 rc**：权限面不可达 + fail-open 面**整类消失**；
#        「跨 build 已熔断」语义改由**判据源自身**承载（熔断后不再产生新自愈 commit ⇒ 轮次不再增长，下一轮据同一直读值仍判 TRIPPED）。
#        机械锁定：`scripts/gate-regression.sh` C14 组**静态最小集**（载体消除可执行行命中 0 / 判据链无 `git push`+`fetch` /
#        守卫绑哨兵 / 升级出口保留 / 早退护栏 / 取值命令体同源 · 负向自证：回退即判红）。
#        ★ **交付面裁剪**（#299 第六次熔断裁决 §四.3① · 2026-09-13 23:57Z）：原 C14 组内**依赖自仓 git 历史实跑**的
#          断言族（E2E / 判据域同源 / W=0 边界等）已**整体撤出本 PR**——该类断言在「未合并（W=0）」态会自判红
#          （R5 实例：合入后 `main` 与常规 PR 矩阵恒红）；其**扩面**（判据域同源族 / W=0 边界 / 出口可执行形态匹配）
#          移入**独立设计单 #318**（`#TASK-SELFHEAL-JUDGE-EXPAND-20260914-01`），断言由**独立于实现方**者设计。
#      ★ **源头堵欠计（R4 · 对应 F-1）**：熔断判据源＝`^QG-Fingerprint:` 尾行，故自愈 userPrompt **硬要求**每个自愈
#        commit 携带该尾行（缺即重做本步、不得以无尾行形态交付）。
#      ★ **换方案后归零（F-134 · #TASK-BREAKER-RESET-20260914-01 · 方案 A 分段计轮）**：指纹尾行数**只增不减**
#        （分支不可变 git 历史）⇒ 换方案轮按 §8 护栏② 归零后该值仍恒 ≥ 阈值 → 熔断永久有效、自愈环被 `if` 守卫
#        永久跳过（#317 §六 F-134 实录：PR#323 换方案终局后零自愈 commit、`grep -c '^QG-Fingerprint:'` 仍 = 3）。
#        故计轮取**分段**：以「最近一次换方案归零 commit」（**任意行**以 `^QG-Reset:` 起头即可，`%B` 含 subject；D14 既定约定）为基线 ref，
#        只数 `基线..HEAD` 的指纹尾行数 ⇒ 换方案后自然归零；**无归零留痕时与旧口径逐字一致**（行为不劣化）。
#        ★ 写入方**仅限换方案轮**（中书令/承接方裁决落地时携带 `QG-Reset:` 行；判据按任意行匹配，写入建议置于尾行）；**自愈 commit 禁携带**
#          （自愈若带归零标记 → 熔断器自失效，矩阵 C14 有反向守卫断言）。
#      ★ 熔断判据仅两条（① 指纹轮次 ② 同族缺陷）；**error 构建数只统计留痕、一律不参与熔断**（PR 不可信事件
#        令牌缺 repo-cnb-history:r，该维实测恒 0/恒失效——注释、代码、心跳三处单源，防「注释写仅留痕、代码却判熔断」复发）。
#      ★ 升级出口两道前置（#TASK-QG-CIRCUITBREAKER-20260910-01 · F1/F2；AC-4 收口 #TASK-ORCH-GOV-20260910-01）：
#      ① **F2 触发源真伪自检**——发载荷前核 **非 PR 事件兜底**（无 `CNB_PULL_REQUEST_IID` 即拦截，只落审计、不发评论/不派单）/
#      分支存在性（git ls-remote）/ PR 存在性（cnb pulls get-pull）/ **熔断阈值是否生产默认**，任一不符即**只落日志、不发评论/不派单**
#      （防探针伪载荷投递真实台账，已复发 3 次）；**拦截判据只取真正参与熔断的 `THRESH_ROUNDS`**——`THRESH_ERRORS`
#      （error 构建维）既已「仅留痕、不参与熔断」，再拿它拦真实升级＝该拦未拦的反被拦（比不拦更危险），故**退出 TRIP 与拦截判据**；
#      ② **F1 探针隔离 dry-run**——`QG_DRY_RUN=1` 时升级出口 a/b **全部不执行**，
#      仅把拟发载荷落 `/workspace/qg-熔断-升级-dryrun.log` 供探针/自测核验（探针验证不再污染真实台账）。
#      ★ F12（终局收敛）：F1/F2 的**早退拦截分支同样写 `/workspace/qg-熔断-升级-失败.txt` 并 cat 进构建日志**——
#      旧实现早退分支只落 `qg-熔断-升级-dryrun.log`（非版本库产物、CI 结束即销毁）就 exit 0，早于失败标记块 →
#      心跳/巡检事后扫不到 → **熔断后静默停摆**（本任务要根治的 P0 被 F2 重新引入）。文案区分「拦截」与「dry-run」。
#      ★ 出口 b「投递成功 ≠ 已拉起」收口（#TASK-FUSE-EXITB-20261006-01 · 承 #598 §四 / #607 F-D）：
#        旧出口 b **只有评论、没有任何真拉起动作**——拉起完全寄望于平台**评论事件**；评审可见面失明时（PR 撞线 ≥90 ⇒ `@npc`
#        事件静默停发 / 事件静默 / 无人在场）该评论**不拉起任何角色** ⇒ 熔断静默停摆（PR#601 实录：载荷落 PR 评论、靠真人转达）。
#        现出口 b = **b-1 真拉起（`api_trigger`，同出口 a 形态）＋ b-2 评论留痕**，且 **b-2 评论成功一律不置 `UP_OK=yes`**
#        （「投递成功」≠「已拉起」，二者分开判定）；升级自证打印 **b-1 的 rc 与构建标识（sn）**。
#        真拉起零成功时，除 `/workspace/qg-熔断-升级-失败.txt` 外**在构建审计日志（failStages 转储）打印可扫线索行**
#        `巡检线索=熔断升级未落地 … 熔断后无升级动作`——供心跳第③维/熔断兜底**机械检索**（不依赖语义理解、不依赖评论事件）。
#        机械锁：`scripts/gate-regression.sh` **C-FUSE-EXITB** 组（静态：b 段含真拉起 + rc/sn 自证 + 评论不冒充成功 + 线索行在位；
#        行为：两出口真拉起全灭夹具 ⇒ 巡检侧判据报红（命中）、已拉起 ⇒ 不误报；负向：抹除线索行 / 评论成功冒充拉起 ⇒ 均判红）。
#   6b) 【PR 评论撞线守卫】（同上任务）——PR 评论 >100 后其 @npc 事件静默停发，而 failStages/crontab 属可信事件
#      照常运行 → 执行环自转、监督者失明。质量门前置「评论撞线守卫」stage：查 PR 评论数（x-cnb-total，
#      CLI 取数 + REST 兜底，REST 用 GET + Accept: application/json + `grep -i` 取 `X-Cnb-Total`），
#      ≥90 时把各 stage 的评审/自愈留痕改道**单任务台账 Issue**（台账号优先从 PR 正文台账链接动态解析，
#      env QG_LEDGER_IID 为可选覆盖；取数失败回落 TARGET=pr），PR 只留一行结论指针；
#      无台账号则跳过留痕、只写 qg 文件。gate 靠 /workspace/qg-*.txt 传递结论的机制**不变**（不依赖评论）。
#
# 模型：全员默认 deepseek-v4.1-flash（4.1 代 · 平台限时免费）。原 deepseek-v4-flash 已于 2026-09-10 官方下线。

# ---- 模型锚点（yaml anchor，全流水线单点换挡口 · #TASK-ITER-20260910-01）----
# 换模型只改下面这一处（`.model` 锚点的 value 子键）——9 处 `model: *model` 引用全部随之切换，
# 即"骨骼-引擎解耦"里换挡成本=改 1 处的结构保证（口径见 AGENTS.md §11.4）。
# 注：本仓 `watchdog-pool/.cnb.yml`（跨仓托底模板，独立文件）**自带 `.budget-light` 锚点**（#TASK-HB-BUDGET-HARDEN-20260912-01 AC-4），
#   取值须与本锚点**同步**（模板内 2 处 `<<: *budget-light` 引用），跨仓使用时单独核。
# 换挡史：#TASK-ITER-20260910-01 立锚点（deepseek-v4-flash）→ #TASK-GROWTH-20260911-02 换挡
#   deepseek-v4.1-flash（4.1 代 · ¥0.00/MTok · 能力核验探针 sn cnb-5ho-1k283e190）。
.model:
  value: &model deepseek-v4.1-flash

# ---- token 预算锚点（yaml anchor · 机械级硬顶 · #TASK-ORCH-BUDGET-20260911-01）----
# 为什么要有它：本仓 `npc:go` 原先 **0 处**声明 maxTurns/contextWindow/maxTokens，平台 maxTurns 默认 500
#   → 单次事件实测可烧 1.9 千万 ~ 4.0 千万 tokens（本仓 sn 实测，明细见 CHANGELOG `[Unreleased]`）；
#   用户 llvm #211 投诉「对外小任务烧 1.5 亿 token」即此（护栏只存在于本文件，对外仓无 .cnb.yml 时无护栏；
#     ★ 边界：该句为**无边界语的全称句**——跨根场景下生效与否取决于**该事件段由哪一仓定义**（见下方「跨根 NPC 事件
#     预算口径」块 · `grep -n '跨根 NPC 事件预算口径' .cnb.yml`；亦对齐 `AGENTS.md` §6.6-C「无法施加任何 `npc:go` 预算」）。
#   故把预算做成**机械锚点**、所有 `npc:go` 一律引用——不落成 AGENTS.md 里的软纪律（本单要根治的正是"靠自觉"）。
# 取值依据（先查证后定档 · 禁拍脑袋）：语义与合法域见
#   `docs.cnb.cool/zh/build/internal-steps/npc/go.md#npc-go-parameters-maxTurns / -contextWindow / -maxTokens`
#   · `maxTurns`：Agent 最大对话轮次，**所有事件均生效**；达上限 Agent 被中止、输出可能不完整；
#   · `contextWindow`：模型上下文窗口，合法域 **128k ~ 1m**；用于上下文超限时触发自动摘要压缩；
#   · `maxTokens`：模型最大输出 token 数，合法域 **48k ~ 1m**。
#   本仓实测基线（本容器实跑取证 · 27 个 npc:go stage 的 `done. N turns` 终行）：中位 51 轮 / p90 153 轮 /
#   最大 232 轮；单请求峰值 prompt **178,162** tokens（sn `cnb-mug-1k27r3tuj`）；单构建总 tokens 1.9M ~ 40.1M。
#   ⇒ 常规档 maxTurns **500**（= 平台内置默认档 · **用户 llvm #211 2026-10-04 直接指令「所有 npc 的 maxTurns 200 都按平台限制走即 500」** ·
#     取代本锚点原「200（腰斩 60%）」取值；`maxTurns` 全事件生效、达上限 Agent 被中止 ⇒ 抬高上限=少截断、代价=长任务单轮 token 可更高）；
#     ⚠️ 单轮 token 硬顶仍靠上方 `.budget` 的 token 观察维（§8 第7B条⑨ 单轮 >10M 判烧穿）——**上限抬高 ≠ 取消预算**；
#     contextWindow **512k**（≈2.9× 于实测峰值，常规任务不触发摘要压缩、又不放任 prompt 无限膨胀）；
#     maxTokens **64k**（实测单轮输出峰值约 5.5k，64k 留足余量、远低于 1m 上限）。
#   与 AGENTS.md 的「编排分层」节互链（对内编排 / 对外编排 + 预算硬顶）：见 `AGENTS.md` §6.6。
#   ★ 跨根（外部第三方仓）场景本锚点**是否生效**：见下方「跨根 NPC 事件预算口径」注释块（#TASK-CROSSROOT-FALLBACK-20261004-01
#     阶段二 · 台账 #495）——该块与本锚点**互指**；本锚点仍是**取值的唯一源**（该块不复述数值）。
.budget:
  value: &budget
    maxTurns: 500
    contextWindow: "512k"
    maxTokens: "64k"

# ---- 轻量档锚点（监督环专用 · 独立低配额 · #TASK-ORCH-BUDGET-20260911-01 AC-2）----
# **监督环不占业务预算**：心跳（日 `*/30 7-23` + 夜 `0 0-6`）+ 成长引擎（`5 7,10,13,16,19,22`）三段是
#   **固定频率**的主动巡检（日间最多 34 次/天 + 夜间 7 次/天 + 成长 6 次/天），原先与业务任务共用同一配额、
#   无独立上限 → 监督环自身每天固定烧 ~20 万 tokens 起（心跳 userPrompt 单条即 ~4.4k tokens × 41 次/天）。
#   故三段一律引用本锚点（**低于上方常规档**，grep 可核验三段各自引用 `*budget-light`）：
#   maxTurns **100**（**重评维持** · #TASK-HB-BUDGET-HARDEN-20260912-01 AC-1）：实测**收敛心跳** done 轮次 34 ~ 80（2.8M ~ 8.9M tokens），
#     而**撞顶轮**恰停在 101 轮且烧 12.4M ~ 13.7M tokens **仍被判 error**（`reached maxTurns limit (100)` ⇒ 监督环失明）——
#     ⇒「截断既不省 token、又致失明」，故**不靠截断收敛**，改由「prompt 收敛入口」使轮次自然落回 <100（见下 ⑤）。
#   contextWindow **256k**（**维持**）：机械上界（worst-case）＝ `maxTurns × contextWindow` = 100 × 256k ≈ 25.6M。
#     ★ 为何**不靠**收敛档位取值实现 AC-1 的「单轮 10M+ 不再出现」（据实）：
#       ① 降 `contextWindow` 至合法域下限 128k 仅把上界压到 ≈12.8M，**仍 > 10M**，治标；
#       ② 且 `AGENTS.md` §6.6-A 已固化「轻量档＝`maxTurns 100`/`contextWindow 256k`/`maxTokens 48k`」，
#          该文件**不在本单白名单**（§7）⇒ 改锚点将产生「锚点↔固化区」口径漂移（🚨复发 6 次家族），不可取；
#       ③ 故 AC-1 走「**等效收敛措施**」分支（闸令明文许可）：**降 `maxTurns` 会截断合法收敛轮**（实测收敛轮达 80 轮），
#          唯一可行杠杆＝**抑制轮次增长本身** ⇒ 见下 ⑤ 心跳 prompt 收敛入口（实测收敛轮 34~80 轮 / 2.8M~8.9M tokens 均 < 10M）。
#   maxTokens **48k**（= 平台合法域下限，巡检只写结论、无需大输出）。
#   ⑤ **心跳段 prompt 收敛入口**（日/夜两处，逐字一致 · AC-1）：单轮最多深挖 **3 项**、其余**只登记不展开**、达上限即收敛出手；
#     **禁整份 `cat` 总纲**（只读〇导航+必读切片+`kb-query.sh` 检索）；逼近第⑨维① 阈值即**自退**（§8 第7B条⑨ 同源）。
#   取证：改造后真实心跳取数命令 `cnb build get-build-ai-audit --repo i.o/x --sn <sn> --pipelineId <sn>-001`
#     （★ 平台限 `start-build --event` 须为 `api_trigger*`，crontab 段**不可**手工触发 ⇒ 无法在 PR 期内产出 post-change 心跳构建，
#      故据实登记 caveat：**post-merge 首个真实心跳轮即实证轮**，取数命令与阈值同上；见台账 #295 AC-1）。
.budget-light:
  value: &budget-light
    maxTurns: 100
    contextWindow: "256k"
    maxTokens: "48k"

# ---- 机型锚点（CPU 2C4G · 省资源 · 用户 llvm #211 指令）----
# 为什么有此锚点：本仓 NPC 流水线中，**评论@通用模板 / `api_trigger` 调兵 / `api_trigger_npc` 外部调度 /
#   `pull_request` 质量门**四类原先**未声明 `runner.cpus`** ⇒ 平台按分配到的节点默认规格计费核时；
#   而**日/夜心跳、成长引擎、KB 建库** 4 处**原已显式声明 `cpus: 2`**，本单统一改为引用本锚点（单源）。
#   npc:go 是**串行 IO/推理**型任务，多核并不提速、只把核时消耗放大。
#   实测取证（sn 坐标与规格现值）见台账 #341 / 本仓 CHANGELOG `[Unreleased]` 对应条（本注释不内嵌）。
# 平台语义（docs.cnb.cool/zh/build/grammar.md#pipeline-cpus）：`runner.cpus` = 构建可使用的**最大** CPU 核数，
#   内存 = 核数 × 2 GiB；不配置时"可用的最大 CPU 核数由分配到的构建节点决定" ⇒ 显式声明即钉死小规格。
# 取值：核数 2 → 2 核 4G；引用面与计数值以台账 #341 回奏为唯一源（**本条不内嵌计数**，防 F-135 计数漂移）。
.runner: &runner
  cpus: 2

# ---- 跨根 NPC 事件预算口径（AC-1 · #TASK-CROSSROOT-FALLBACK-20261004-01 阶段二 · 台账 #495）----
# 为什么单列：跨根（外部第三方仓）场景下，本仓 `.budget`/`.budget-light` 的机械硬顶**到底生效在哪一环**，
#   此前本文件侧只有上方 `L108` 一句**无边界语的全称句**（「护栏只存在于本文件，对外仓无 `.cnb.yml` 时无护栏」，
#   系 `25fb5b20` 既有、非本块新增）——该句**未对齐** `AGENTS.md` §6.6-C 的合并规则（原文：「预算护栏**只存在于
#   本仓 `.cnb.yml`**，对外仓无此文件时**无法施加任何 `npc:go` 预算**」），易被读成「跨根时角色段不受本仓预算
#   约束」⇒ **口径双源**隐患。故本块据实补齐边界语，并与 `L108` / `.budget` 锚点注释**三处互指同一口径**
#   （`grep -n '对外仓无' .cnb.yml` 命中行同指；与 `.budget` 锚点注释互指，两文件 `grep -F '.budget'` 均可命中）。
# 来源链（逐环，官方 T0）：
#   ① 目标仓**无** `.cnb.yml`（跨根零落地场景）⇒ **不走用户侧配置**，走平台 **配置合并**（NPC 事件触发时，
#      系统经 `include` 自动合并【系统默认配置】+【**NPC 所属仓**（此处＝ `i.o/x`）的 `.cnb.yml`】，按**事件**独立合并：
#      NPC 仓已定义的事件覆盖默认、未定义的保留默认）——来源 `https://docs.cnb.cool/zh/build/npc.md`「配置合并机制」；
#   ② 合并后命中本仓**角色段 / `$:` 兜底段**（均引用 `.npc` 或 `.hy_pipelines` 或 `$: api_trigger` 段）；
#   ③ 命中段 `options` 内 `<<: *budget`（或 `*budget-light`）**YAML 别名在解析时展开** ⇒
#   ④ **实际生效值＝本仓 `.budget`（常规档）/ `.budget-light`（轻量档）取值**，非目标仓、非平台默认。
#   ⇒ 结论：跨根场景**护栏仍在**（由 NPC 所属仓的锚点承载），但**只在「本仓已定义该事件」的范围内**；
#     **第三方自定义事件段**（本单核验时本仓 `$:` 已定义 api_trigger / api_trigger_npc / issue.comment@npc /
#     pull_request.comment@npc / pull_request 五段；此五段之外的其余事件段在本单核验时本仓未定义）落在系统默认侧，
#     平台默认值生效 ⇒ 该缺口即 `AGENTS.md` §6.6-C 所述「对外仓无此文件时**无法施加任何 `npc:go` 预算**」的作用域（**边界据实**）。
# 参数语义（官方 T0 · `https://docs.cnb.cool/zh/build/internal-steps/npc/go.md#npc-go-parameters`）：
#   模型能力参数（`maxTurns`/`contextWindow`/`maxTokens`/`thinkingLevel`/`supportImage`）默认值**并非固定**——
#   **未指定 `model`**（走平台默认模型）⇒ 沿用平台为该默认模型配置的取值；**指定了自定义 `model`**（本仓全员
#   指定 `*model`）⇒ **不再沿用**该配置（能力因模型而异、不可复用）⇒ **回落到内置默认**（`maxTurns` **500** /
#   `contextWindow` 1m / `maxTokens` 48k / `thinkingLevel` medium / `supportImage` false）。
#   ⇒ 本仓角色段**显式声明** `<<: *budget*`，即**不依赖**该回落路径（声明值优先）；回退仅为「声明缺失时」的兜底语义。
# 口径边界（据实 · 不主张已覆盖）：① 本条只述**合并与取值来源**，阈值/档位取值**以 `.budget`/`.budget-light` 锚点为唯一源**
#   （本条不复述数值）；② 目标仓**自带** `.cnb.yml` 且定义同名事件时，按其自身配置执行（本仓锚点不介入）——
#   是否继承本仓锚点**取决于该事件段由哪一仓定义**，据实按官方合并规则逐事件判定，不写成「一律继承」。
# ---- NPC 通用执行模板（yaml anchor，评论@触发的角色复用）----
.npc: &npc
  - runner: *runner  # ← 引用 .runner 锚点（机型见锚点）
    docker:
      image: cnbcool/default-npc:latest      # 官方默认运行环境，开箱即用
    stages:
      # ---- 熔断守卫（评论链 · AC-2 · #TASK-ORCH-CONVERGE-20261004-01 · 换方案轮 ac2b）----
      #   为什么补这一段：`failStages` 自愈 stage 已由 `if` 绑定哨兵跳过（矩阵 C14-⑥），但**评论链**
      #   （平台自动评论「CI failed, please fix」→ `@角色` → 本锚点 `npc go`）此前哨兵就在位（同 build）、
      #   跨 build 无判定 ⇒ 熔断后该链照样拉起 Agent 改文件 + push ⇒ **熔断被绕过**
      #   （#226 实录：冻结令后 6 次 push 全晚于冻结令，绕过通道即「平台自动评论 @ 实例（带写权）」）。
      #   ★ 本轮换方案（#485 裁决 · §8 护栏② 达 3/3）：前任实现的跨 build 计轮口径**自建一套** ⇒ 与权威
      #     熔断 stage **失配**（守卫 `SEAL..REF` 仅设上界、无 BASE 下界、无归属过滤 ⇒ 把已合入 main 的
      #     他单指纹一并计入）⇒ 常态分支形态**大面积误熔断**（判定相反 · 现跑 28/40 基点误熔断）；
      #     误判方向是「拦」⇒ 评论链静默停摆（守卫目的被反向达成）。
      #   本实现（判据同源 · 结构性地消除双源）：
      #     ① 本 stage **零自建计数**——`#<<BREAKER_CNT_SH … >>` 权威判据块**原样抽取**后就地执行
      #        （含 `BASE_REF=origin/<默认分支>` 下界 ＋ F-308b `OWN_TASK` 归属过滤）；改权威块即同时改本守卫，
      #        「改其一必致另一不一致」由矩阵 C-LATCH-⑤/⑥ 断言（静态零自建计数 + 动态同夹具同值）。
      #     ② 执行宿主＝临时 `GIT_DIR`（`HEAD` 指向被测 tip、对象经 alternates 复用、refs 只读拷贝）
      #        ⇒ 不切检出、不脏工作区、零写远端。
      #     ③ fail-open 显式化（本轮裁决②）：BASE 无法界定（`origin/<默认分支>` 不可达 ∧ merge-base 失败）、
      #        判据块不可抽、或 tip 不可解析 ⇒ **不熔断 + 显式告警**；**禁以全历史计数冒充分支轮次**（P1-1 直接成因）。
      #   放行面（防死锁 · #192 白名单族）：只覆盖**评论事件侧**；`$: api_trigger`（含熔断升级出口 a、
      #     调度方裁决与换方案落地）**不经本锚点** ⇒ 不被跳过，权威通道不受影响；本守卫不收窄该面。
      - name: 熔断守卫
        script: |
          set +e
          echo "===== 熔断守卫（评论链 · AC-2 · #TASK-ORCH-CONVERGE-20261004-01）====="
          #<<BREAKER_LATCH_SH
          LATCH="no"; LATCH_WHY=""
          if [ -f /workspace/qg-熔断.txt ]; then
            LATCH="yes"; LATCH_WHY="同 build 哨兵在位（/workspace/qg-熔断.txt）"
          else
            BR="${CNB_PULL_REQUEST_BRANCH:-${CNB_BRANCH:-}}"
            BASE="${CNB_DEFAULT_BRANCH:-main}"
            PR="${CNB_PULL_REQUEST_IID:-}"
            YML="${QG_BREAKER_YML:-.cnb.yml}"
            [ -f "$YML" ] || YML="/workspace/.cnb.yml"
            ROUNDS=""
            # ---- ⓪ 阈值**单源取数**（禁本 stage 复述数值 · P2-2）：默认值从权威熔断 stage 的
            #      `QG_MAX_SELFHEAL_ROUNDS:-<N>` 表达式**原样抽取**；抽不到则只认 env、无 env 即判据不可用。----
            _MX_DEF="$(grep -oE 'QG_MAX_SELFHEAL_ROUNDS:-[0-9]+' "$YML" 2>/dev/null | head -1 | grep -oE '[0-9]+')"
            THRESH="${QG_MAX_SELFHEAL_ROUNDS:-$_MX_DEF}"
            case "$THRESH" in ''|*[!0-9]*) THRESH="" ;; esac
            # ---- ① 只读取数（失败即忽略；是否可判定由 BASE 界定与 tip 解析决定，**失败不致命**）----
            git rev-parse --verify -q "origin/${BASE}^{commit}" >/dev/null 2>&1 \
              || git fetch --quiet --no-tags origin "$BASE" >/dev/null 2>&1
            if [ -n "$BR" ]; then
              if ! git rev-parse --verify -q "refs/remotes/origin/${BR}^{commit}" >/dev/null 2>&1 \
                 && ! git rev-parse --verify -q "refs/heads/${BR}^{commit}" >/dev/null 2>&1; then
                git fetch --quiet --no-tags origin "refs/heads/${BR}:refs/remotes/origin/${BR}" >/dev/null 2>&1
              fi
            fi
            REF_SHA=""
            for _c in "refs/remotes/origin/${BR}" "refs/heads/${BR}" "refs/pull/${PR}/head" "HEAD"; do
              case "$_c" in "refs/remotes/origin/"|"refs/heads/"|"refs/pull//head") continue ;; esac
              _s="$(git rev-parse --verify -q "${_c}^{commit}" 2>/dev/null)"
              if [ -n "$_s" ]; then REF_SHA="$_s"; break; fi
            done
            # ---- ② 权威判据块**原样抽取**（唯一判据源；改权威块即同时改本守卫）----
            BLKTXT="$(awk '/^[[:space:]]*#<<BREAKER_CNT_SH[[:space:]]*$/{f=1;next} /^[[:space:]]*#BREAKER_CNT_SH>>[[:space:]]*$/{f=0} f' "$YML" 2>/dev/null | sed 's/^[[:space:]]\{1,\}//')"
            # ---- ③ BASE 下界界定（与熔断 stage **同款**：origin/<默认分支> → merge-base）----
            BASE_REF="origin/${BASE}"
            git rev-parse --verify -q "${BASE_REF}^{commit}" >/dev/null 2>&1 \
              || BASE_REF="$(git merge-base "$REF_SHA" "$BASE" 2>/dev/null)"
            BASE_OK="no"
            if [ -n "$BASE_REF" ] && git rev-parse --verify -q "${BASE_REF}^{commit}" >/dev/null 2>&1; then BASE_OK="yes"; fi
            # ---- ④ 执行宿主＝临时 GIT_DIR（HEAD=被测 tip · 对象 alternates 复用 · refs 只读拷贝）----
            if [ "$BASE_OK" = "yes" ] && [ -n "$REF_SHA" ] && [ -n "$BLKTXT" ]; then
              GD="$(git rev-parse --absolute-git-dir 2>/dev/null)"
              LD="${TMPDIR:-/tmp}/qg-latch-$$"
              rm -rf "$LD"; mkdir -p "$LD/refs" "$LD/objects/info" 2>/dev/null
              if [ -n "$GD" ] && [ -d "$GD/objects" ]; then
                printf '%s\n' "$GD/objects" > "$LD/objects/info/alternates" 2>/dev/null
                [ -f "$GD/packed-refs" ] && cp -f "$GD/packed-refs" "$LD/packed-refs" 2>/dev/null
                [ -d "$GD/refs" ] && cp -r "$GD/refs/." "$LD/refs/" 2>/dev/null
                printf '%s\n' "$REF_SHA" > "$LD/HEAD" 2>/dev/null
                printf '%s\n' "$BLKTXT" > "$LD/breaker_cnt.sh" 2>/dev/null
                if sh -n "$LD/breaker_cnt.sh" 2>/dev/null && GIT_DIR="$LD" git rev-parse --verify -q 'HEAD^{commit}' >/dev/null 2>&1; then
                  _out="$(GIT_DIR="$LD" BRANCH="$BR" BASE_REF="$BASE_REF" BASE_OK="$BASE_OK" sh -c ". '$LD/breaker_cnt.sh'" 2>/dev/null)"
                  ROUNDS="$(printf '%s' "$_out" | grep -oE '轮次=[0-9]+' | head -1 | cut -d= -f2)"
                  echo "🔎 同源判据块（#<<BREAKER_CNT_SH>>）输出：$(printf '%s' "$_out" | tr '\n' ' ')"
                fi
              fi
              rm -rf "$LD" 2>/dev/null
            fi
            case "$ROUNDS" in ''|*[!0-9]*) ROUNDS="" ;; esac
            if [ "$BASE_OK" != "yes" ]; then
              echo "⚠️ 熔断守卫：BASE 无法界定（origin/${BASE} 不可达 ∧ merge-base 失败）⇒ **不熔断**（fail-open · 禁以全历史计数冒充分支轮次）"
            elif [ -z "$BLKTXT" ]; then
              echo "⚠️ 熔断守卫：权威判据块 #<<BREAKER_CNT_SH … >> 抽取为空（锚点漂移？）⇒ **不熔断**（fail-open）"
            fi
            if [ -z "$THRESH" ]; then
              echo "⚠️ 熔断守卫：阈值单源取数失败（无 env `QG_MAX_SELFHEAL_ROUNDS` ∧ 权威表达式不可抽）⇒ **不熔断**（fail-open）"
            fi
            if [ -n "$ROUNDS" ] && [ -n "$THRESH" ] && [ "$ROUNDS" -ge "$THRESH" ]; then
              LATCH="yes"; LATCH_WHY="跨 build：同源判据轮次 $ROUNDS ≥ 阈值 $THRESH（tip=$REF_SHA）"
            elif [ -n "$ROUNDS" ]; then
              LATCH_WHY="未熔断：同源判据轮次 $ROUNDS < 阈值 $THRESH（tip=$REF_SHA）"
            else
              LATCH_WHY="判据不可用（BASE 无法界定 / 判据块不可抽 / tip 不可解析）⇒ 不拦（fail-open + 告警）"
            fi
          fi
          echo "熔断守卫判定=$LATCH  理由=$LATCH_WHY"
          if [ "$LATCH" = "yes" ]; then
            {
              echo "===== 熔断守卫（评论链）：命中 ⇒ 跳过 npc go，不再产出修复 commit ====="
              echo "理由=$LATCH_WHY"
              echo "载体=/workspace/qg-熔断.txt（与 failStages 自愈 stage 的 if 守卫同载体）"
              echo "放行面=api_trigger（裁决 / 换方案落地通道不经本锚点）"
            } > /workspace/qg-熔断.txt
            echo "🛑 已写 /workspace/qg-熔断.txt ⇒ 本 build 评论链 npc go 被 if 守卫跳过"
          else
            echo "✅ 未熔断 ⇒ 照常执行 npc go"
          fi
          #BREAKER_LATCH_SH>>
          exit 0
      - name: npc go
        # 熔断守卫：上一 stage 判定熔断（写 /workspace/qg-熔断.txt）时**整段跳过** ⇒ 评论链不再产出修复 commit。
        # 与 `failStages`→「工部尚书自愈」stage 的 `if` **逐字同形**（同哨兵、两处绑定；矩阵 C-LATCH-③ 断言同源）。
        if: |
          [ ! -f /workspace/qg-熔断.txt ] && [ ! -f /workspace/qg-裁决冻结.txt ]
        type: npc:go                         # 平台内置 NPC 任务：读取角色 prompt + Issue/PR 上下文 → 执行 → 回评
        options:
          <<: *budget   # ← 机械级预算硬顶（#TASK-ORCH-BUDGET-20260911-01；口径见 AGENTS.md §6.6）
          model: *model                      # ← 引用顶部 `.model` 锚点；某角色要单独换模型，在该角色顶层 key 下写独立流水线覆盖
          # ★ 收敛入口（对外事件侧 · `#TASK-ORCH-CONVERGE-20261004-01 AC-1` · 评论双事件单源载体）：
          #   本锚点被 `$: issue.comment@npc` / `$: pull_request.comment@npc` 兜底段与**全部角色段**复用
          #   ⇒ 下列两段即评论事件侧（含各命中角色段）**逐段**收敛入口——一处声明、各段经锚点继承，
          #   防逐段复制致措辞漂移（F-117 双源族）。YAML 别名在解析时展开，各角色段 options 实际均含本句。
          #   边界（据实 · 官方 T0 `docs.cnb.cool/zh/build/internal-steps/npc/go.md#npc-go-parameters`）：
          #   评论触发时该二者被平台忽略（提示词由角色自带）⇒ 本条为评论侧**在位声明面**（载体可审计）；
          #   提示词**生效面**＝下方 `$: api_trigger` 段同名两段（两处措辞须逐字一致）。
          systemPrompt: |
            【收敛入口（对外事件侧 · `#TASK-ORCH-CONVERGE-20261004-01 AC-1`）】**结论先行**（先出结论/回奏、再补证据）；单轮**最多深挖 3 项**（含 merge/派单/裁决），其余维**只登记不展开**；**禁整份 `cat`/通读总纲**（只读〇导航+本角色必读切片，深水区用 `bash scripts/kb-query.sh` Top-K 检索）；**轮次自警**：工具调用累计约 ≥80 次或已深挖满 3 项即**立即收敛出手**（防撞机械轮次上限致 `error`=交付断链）；**逼近第⑨维① / 第⑩维阈值即自退**（限巡检类任务，不追加深挖）。（措辞同源＝心跳段 `#TASK-HB-BUDGET-HARDEN-20260912-01 AC-1`；防撞括注取**档位中性**表述、不绑定档位取值，故各档位段通用，防跨档失实。）**首动作纪律（FU-CC-4 · #TASK-CROSSROOT-CHAINBREAK-20261007-01）**：**第一个写动作必须早于深挖**（先建分支/先落最小骨架，再补调研），禁「全程只调研、零落盘」——跨根 0 落地实测末跳 `out=32000/content=0` 静默丢步 ⇒ 零产出断链。
          userPrompt: |
            【收敛入口（对外事件侧 · `#TASK-ORCH-CONVERGE-20261004-01 AC-1`）】**结论先行**（先出结论/回奏、再补证据）；单轮**最多深挖 3 项**（含 merge/派单/裁决），其余维**只登记不展开**；**禁整份 `cat`/通读总纲**（只读〇导航+本角色必读切片，深水区用 `bash scripts/kb-query.sh` Top-K 检索）；**轮次自警**：工具调用累计约 ≥80 次或已深挖满 3 项即**立即收敛出手**（防撞机械轮次上限致 `error`=交付断链）；**逼近第⑨维① / 第⑩维阈值即自退**（限巡检类任务，不追加深挖）。（措辞同源＝心跳段 `#TASK-HB-BUDGET-HARDEN-20260912-01 AC-1`；防撞括注取**档位中性**表述、不绑定档位取值，故各档位段通用，防跨档失实。）**首动作纪律（FU-CC-4 · #TASK-CROSSROOT-CHAINBREAK-20261007-01）**：**第一个写动作必须早于深挖**（先建分支/先落最小骨架，再补调研），禁「全程只调研、零落盘」——跨根 0 落地实测末跳 `out=32000/content=0` 静默丢步 ⇒ 零产出断链。

# ================= 调兵通道（api_trigger 链式触发，全员共用） =================
# 中书令（或任何 NPC）用 cnb build start-build --env NPC_ROLE=<角色名> --env SUMMON_BRIEF=<公文> 触发，
# 平台按 .cnb/settings.yml 解析 NPC_ROLE 对应角色 prompt，以「替我上班」工作模式执行。

$:
  # ──────────────────────────────────────────────────────────────
  # 云原生开发环境：专供页面中点击「云原生开发」启动远程开发用
  # ──────────────────────────────────────────────────────────────
  vscode:
    - name: dev-env
      docker:
        image: docker.cnb.cool/xzydm/mirrors/debian:13-all
      runner:
        cpus: 8
        tags: cnb:arch:amd64
      services:
        - docker
        - name: vscode
          options:
            # false（默认）：走标准 WebIDE / VSCode 客户端，而不是只打开预览页
            onlyPreview: false
            # 参考仓写的是 `launch: python keepalive.py`（依赖仓内一个 py 脚本）。
            # 本仓库是 Go 项目，没有也不打算为开发环境往仓库塞脚本，故用等价的
            # inline 长驻命令：配合 daemon: true 由平台后台 detach 执行，
            # docker exec 立即返回，不会卡在「等待 launch 退出」上（非守护模式下
            # launch 超过 5 分钟不退出会判失败）。
            launch: sh -c "while true; do sleep 3600; done"
            # 离线保活 16h（默认仅 10 分钟无心跳就回收环境）
            keepAliveTimeout: 16h
            daemon: true
      stages:
        # 开发环境每次启动都会重跑 stages，故安装必须幂等（command -v 命中即跳过），
        # 否则每次进环境都要白白重装几百 MB 工具链。
        - name: install toolchain
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive

            # 基础命令缺失才 apt-get（apt install 属平台侧的 slow-path，能省则省）
            MISSING=""
            for c in curl ca-certificates-x509-tool sqlite3 git jq xz-utils; do
              case "$c" in
                ca-certificates-x509-tool) command -v update-ca-certificates >/dev/null 2>&1 || MISSING="$MISSING ca-certificates";;
                xz-utils) command -v xz >/dev/null 2>&1 || MISSING="$MISSING xz-utils";;
                *) command -v "$c" >/dev/null 2>&1 || MISSING="$MISSING $c";;
              esac
            done
            if [ -n "$MISSING" ]; then
              echo ">>> installing system packages:$MISSING"
              apt-get update -y
              apt-get install -y --no-install-recommends $MISSING
            fi

            # ── Go 1.26.6（与 Dockerfile 的 golang:1.26.6-alpine 对齐）──
            # 主源阿里云（实测 200），回退 google.cn，最后兜底官方 dl
            if ! command -v go >/dev/null 2>&1; then
              echo ">>> installing go1.26.6"
              for base in https://mirrors.aliyun.com/golang https://golang.google.cn/dl https://go.dev/dl; do
                if curl -fsSL --max-time 300 -o /tmp/go.tgz "$base/go1.26.6.linux-amd64.tar.gz"; then
                  tar -C /usr/local -xzf /tmp/go.tgz
                  rm -f /tmp/go.tgz
                  break
                fi
                echo ">>> go 下载失败，换下一个源：$base"
              done
            fi
            command -v go >/dev/null 2>&1 || { echo ">>> go 安装失败：所有下载源均不可达"; exit 1; }

            # ── Node 22（前端 web/ 需要 vite 8 + vue-tsc，Node 20 不够）──
            # 主源阿里云 nodejs-release（实测 200），回退 npmmirror 二进制站，最后兜底官方
            if ! command -v node >/dev/null 2>&1; then
              echo ">>> installing node 22.23.3"
              NODE_PKG=node-v22.23.3-linux-x64.tar.xz
              for base in https://mirrors.aliyun.com/nodejs-release/v22.23.3 \
                          https://registry.npmmirror.com/-/binary/node/v22.23.3 \
                          https://nodejs.org/dist/v22.23.3; do
                if curl -fsSL --max-time 300 -o /tmp/node.tar.xz "$base/$NODE_PKG"; then
                  mkdir -p /usr/local/nodejs
                  tar -C /usr/local/nodejs --strip-components=1 -xJf /tmp/node.tar.xz
                  rm -f /tmp/node.tar.xz
                  break
                fi
                echo ">>> node 下载失败，换下一个源：$base"
              done
            fi

            # PATH：同时写入 /etc/profile.d（登录 shell）与 ~/.bashrc（部分 IDE
            # 终端只加载交互式配置），避免 WebIDE 终端出现 command not found
            cat > /etc/profile.d/lazy-balancer-dev.sh <<'EOF'
            export PATH=$PATH:/usr/local/go/bin:/usr/local/nodejs/bin
            export GOPROXY=https://mirrors.aliyun.com/goproxy/,https://goproxy.cn,direct
            export GOPATH=$HOME/go
            EOF
            chmod +x /etc/profile.d/lazy-balancer-dev.sh
            grep -q 'lazy-balancer-dev.sh' /etc/bash.bashrc 2>/dev/null || \
              echo '[ -f /etc/profile.d/lazy-balancer-dev.sh ] && . /etc/profile.d/lazy-balancer-dev.sh' >> /etc/bash.bashrc
            grep -q 'lazy-balancer-dev.sh' "$HOME/.bashrc" 2>/dev/null || \
              echo '[ -f /etc/profile.d/lazy-balancer-dev.sh ] && . /etc/profile.d/lazy-balancer-dev.sh' >> "$HOME/.bashrc"

            export PATH=$PATH:/usr/local/go/bin:/usr/local/nodejs/bin
            echo "=== toolchain ==="
            go version
            node -v
            npm -v
            sqlite3 --version

  # ──────────────────────────────────────────────────────────────
  # 镜像构建：页面自定义按钮触发（见 .cnb/web_trigger.yml）
  #
  # 结构沿用成熟的三 pipeline 形态：amd64 / arm64 两个原生架构作业并行编译，
  # 第三个作业 await 两者完成后合成多架构 manifest。
  # 之所以不用 buildx 一把梭多架构：本仓库最重的一步是 xcaddy build
  #（编译 Caddy + coraza 等 6 个插件），QEMU 模拟下的耗时不可接受，
  # 原生双 runner 反而更快。
  # ──────────────────────────────────────────────────────────────
  web_trigger_docker_build:
    - name: build-amd64
      runner:
        cpus: 8
        tags: cnb:arch:amd64
      services:
        - docker
      env:
        IMAGE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest-linux-amd64
        # 专用层缓存 tag：不与任何对外 tag 复用，避免下面 remove-tag 把下次
        # 构建的缓存源一起删掉；终端更新 APP_VERSION 的代价是几百 MB 存储。
        CACHE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:cache-linux-amd64
      stages:
        - name: docker login
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: docker build
          # xcaddy 冷缓存全量重编历史上可达 40 分钟级；默认的 2h 上限 /
          # 10min 无输出超时（哪怕只是 go build 长时间不打日志）都太紧，显式放宽。
          timeout: 4h
          script: |
            set -e
            # 版本号：优先取按钮传入的 VERSION，缺省时回退 Dockerfile 的 ARG 默认值。
            # 注意 Dockerfile 里还有一行 ARG CRS_VERSION=...，故必须锚定行首
            # ^ARG VERSION=，否则 head -1 可能抓错。
            VERSION="${VERSION:-$(sed -n 's/^ARG VERSION=//p' Dockerfile | head -1)}"
            echo "APP_VERSION=${VERSION}"
            # 首次构建必然没有缓存镜像，拉失败不能中断流水线
            docker pull ${CACHE_TAG} || true
            # BUILDKIT_INLINE_CACHE=1 让产物带上层缓存元数据，下次以它为 --cache-from
            # 即可吃到增量（比 --cache-to type=registry,mode=max 对默认 driver 更稳）
            docker build \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              --build-arg VERSION=${VERSION} \
              --cache-from ${CACHE_TAG} \
              -t ${IMAGE_TAG} .
        # 「构建成功 ≠ 镜像能跑」——真的把容器跑起来才算过。
        # 探针形态与 docker-compose.yml 的 healthcheck 保持一致的双探针：管理面板
        # 可能为自签 HTTPS（此时明文 HTTP 返回 301），也可能只有明文可用；
        # 且镜像内**没有 curl**（构建期临时装的 curl 事后 apk del 了），
        # 只能用 busybox wget，自签证书靠 --no-check-certificate 放行。
        # 探针走 docker exec 在容器内打 127.0.0.1:8000，不依赖宿主机端口映射。
        - name: docker smoke test
          timeout: 10m
          script: |
            set -e
            cid=$(docker run -d ${IMAGE_TAG})
            trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
            ok=0
            # 首次启动要 --init 建库 + 生成 Caddyfile + 拉起 Caddy 监督器，放宽到 ~2min
            for i in $(seq 1 60); do
              if [ "$(docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null || echo false)" != "true" ]; then
                echo ">>> 容器已退出，提前结束探活"
                break
              fi
              if docker exec "$cid" sh -c 'wget -q -O /dev/null -T 3 --no-check-certificate https://127.0.0.1:8000/health || wget -q -O /dev/null -T 3 http://127.0.0.1:8000/health'; then
                ok=1
                break
              fi
              sleep 2
            done
            echo "--- container logs (tail 40) ---"
            docker logs "$cid" 2>&1 | tail -40
            if [ "$ok" != "1" ]; then
              echo ">>> 镜像探活失败：容器未在 8000 提供 /health（构建绿 ≠ 镜像能跑）"
              exit 1
            fi
            echo ">>> 镜像探活通过"
        - name: docker push
          script: |
            set -e
            docker push ${IMAGE_TAG}
            # 同一份镜像换个 tag 推就是下次的缓存源（层在制品库只存一份）
            docker tag ${IMAGE_TAG} ${CACHE_TAG}
            docker push ${CACHE_TAG}
        - name: resolve
          type: cnb:resolve
          options:
            key: build-amd64

    - name: build-arm64
      runner:
        cpus: 8
        tags: cnb:arch:arm64:v8
      services:
        - docker
      env:
        IMAGE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest-linux-arm64
        CACHE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:cache-linux-arm64
      stages:
        - name: docker login
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: docker build
          timeout: 4h
          script: |
            set -e
            VERSION="${VERSION:-$(sed -n 's/^ARG VERSION=//p' Dockerfile | head -1)}"
            echo "APP_VERSION=${VERSION}"
            docker pull ${CACHE_TAG} || true
            docker build \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              --build-arg VERSION=${VERSION} \
              --cache-from ${CACHE_TAG} \
              -t ${IMAGE_TAG} .
        # arm64 作业不做真容器探活：一是此处是 arm64 原生 runner，镜像与运行架构
        # 天然一致，跑不起来的概率远低于交叉构建；二是每次探活要给缓慢的 arm64
        # 容器额外留 2 分钟启动窗口。冒烟已在 amd64 侧覆盖「构建绿 ≠ 镜像能跑」。
        # 若将来需要（例如怀疑某个插件在 arm64 上启动崩），把 amd64 作业那一段
        # smoke test 原样复制到这里即可。
        - name: docker push
          script: |
            set -e
            docker push ${IMAGE_TAG}
            docker tag ${IMAGE_TAG} ${CACHE_TAG}
            docker push ${CACHE_TAG}
        - name: resolve
          type: cnb:resolve
          options:
            key: build-arm64

    - name: manifest
      services:
        - docker
      env:
        IMAGE_BASE: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
        # 额外镜像（mirror）目标仓库。这是本文件唯一一处硬编码仓库名——因为
        # 「把镜像再推一份到另一个仓库」本质上就指向一个外部仓库，无法由
        # ${CNB_REPO_SLUG_LOWERCASE} 推导。与源同属 docker.cnb.cool 同一 registry，
        # 只是换到 mirrors 仓库的命名空间下（非同名制品，路径 = 仓库路径/制品名），
        # 故无需第二套凭据，仍用当前构建的 cnb:${CNB_TOKEN}；前提是触发者
        # 对该仓库有写权限。改成空串即可关闭镜像。
        MIRROR_REPO_SLUG: xzydm/mirrors
        # 空串表示不镜像；非空时镜像到该仓库下的同名制品
        MIRROR_BASE: ${CNB_DOCKER_REGISTRY}/${MIRROR_REPO_SLUG}/${CNB_REPO_NAME_LOWERCASE}
      stages:
        - name: await the amd64
          type: cnb:await
          options:
            key: build-amd64
        - name: await the arm64
          type: cnb:await
          options:
            key: build-arm64
        - name: docker login
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: manifest latest
          image: cnbcool/manifest
          settings:
            # 插件对 CNB 制品库有内置默认账号，但仅当 CNB_TOKEN_USER_NAME / CNB_TOKEN
            # 在插件容器内可见时才生效；显式传入更稳，且二者都取自构建环境变量
            #（日志打码），不会落成明文配置。
            username: ${CNB_TOKEN_USER_NAME}
            password: ${CNB_TOKEN}
            target: ${IMAGE_BASE}:latest
            # 源镜像模板必须写成 latest-OS-ARCH，不能写 latest-linux-OS-ARCH：
            # 插件的 ARCH/OS/VARIANT 是裸子串替换（不是占位符解析），tag 里已有
            # linux 再叠 OS 会得到 latest-linux-linux-amd64，制品库里没有该 tag，
            # manifest 直接 404。
            template: ${IMAGE_BASE}:latest-OS-ARCH
            platforms:
              - linux/amd64
              - linux/arm64
        # 版本号 tag：与 latest 指向完全相同的两个 per-arch 镜像，只是换了一个
        # manifest target（方便用户固定到某个发行版，不被后续 latest 带跑）。
        # VERSION 由页面按钮的入参注入（见 .cnb/web_trigger.yml，带默认值，必填），
        # 为空通常说明不是从该按钮触发（例如 API 触发），此时跳过而不是产出
        # 「{仓库}:」这种残缺 target。
        - name: manifest version
          if: '[ -n "${VERSION}" ]'
          image: cnbcool/manifest
          settings:
            username: ${CNB_TOKEN_USER_NAME}
            password: ${CNB_TOKEN}
            target: ${IMAGE_BASE}:${VERSION}
            template: ${IMAGE_BASE}:latest-OS-ARCH
            platforms:
              - linux/amd64
              - linux/arm64
        # 把刚合成的 latest 多架构镜像额外复制一份到 `xzydm/mirrors` 仓库。
        # 用 buildx imagetools create 做 registry→registry 复制：它按 manifest list
        # 逐个子 manifest/layer 搬运，不落地本地 daemon，比 pull + retag + push
        # （本机再拉一次 ~几百 MB 层）更快，也天然保留多架构索引。
        # 只镜像 latest（版本号 tag 保持仅在源仓库存在，避免镜像仓里堆一摞历史版本）。
        - name: mirror latest to mirrors repo
          timeout: 30m
          script: |
            set -e
            # MIRROR_REPO_SLUG 置空即关闭镜像，方便本文件被别的仓库直接复用
            if [ -z "${MIRROR_REPO_SLUG}" ]; then
              echo ">>> MIRROR_REPO_SLUG 为空，跳过 mirror"
              exit 0
            fi
            echo ">>> mirror ${IMAGE_BASE}:latest -> ${MIRROR_BASE}:latest"
            docker buildx imagetools create \
              -t ${MIRROR_BASE}:latest \
              ${IMAGE_BASE}:latest
            echo ">>> mirror 完成"
            docker buildx imagetools inspect ${MIRROR_BASE}:latest
        - name: remove tag
          type: artifact:remove-tag
          options:
            # 包名用仓库同名制品名，不能用完整镜像地址
            name: ${CNB_REPO_NAME_LOWERCASE}
            tags:
              # 只删两个架构作业实际推送的临时 tag；cache-linux-* 要留着给下次构建
              - latest-linux-amd64
              - latest-linux-arm64
            type: docker

  # ──────────────────────────────────────────────────────────────
  # 把本仓 main 同步到 GitHub fork 的 master-dev：页面自定义按钮触发
  #（见 .cnb/web_trigger.yml 的「推送 main 到 GitHub master-dev」）。
  #
  # 方向说明：本仓库是 GitHub 上游 v55448330/lazy-balancer-v2 的 fork 的
  # CNB 镜像。GitHub Actions 负责「上游 release → fork 的 master（上游镜像轨）」；
  # 这里补上反向的一环：「本仓 main（我们的开发主线）→ fork 的 master-dev」，
  # 让 GitHub 侧的开发主线也拿到我们最新的改动，两边互为备份。
  #
  # 凭据：GitHub PAT 存在 CNB 密钥仓库（xzydm/xzsecret 的 github.yml）里，
  # 通过 imports 注入，流水线内不出现任何明文。
  #
  # ── 关于密钥变量怎么用（含本流水线此前「token 为空」的真相）──
  #
  # 密钥仓库文件里的键名就是环境变量名，imports 会逐 key 原样注入，
  # 脚本里**直接用同名变量**即可，不要中转改名。中转会让"被审计的那个名字"
  # 与"实际参与拼接的字符串"分离：真正的 token 一旦落进你自己名字的变量里，
  # 它就不再是审计对象，而审计日志只记录"谁引用过这个文件"，不会区分中转。
  #
  # 本流水线此前 token 为空，根因是键名 `163_GIT_ALL_TOKEN` 以数字开头。
  # 官方文档对变量名有硬约束（云原生构建/环境变量/限制说明）：
  #   变量名格式：仅支持字母、数字和下划线，**不能以数字开头**
  # 且提示「不符合规则的变量会被忽略」。实测（debian 13，/bin/sh -> dash）：
  #
  #   env -i 163_GIT_ALL_TOKEN=SECRET123 dash -c 'printenv 163_GIT_ALL_TOKEN'
  #     -> 无输出（变量不存在）
  #   env -i 163_GIT_ALL_TOKEN=SECRET123 bash -c 'printenv 163_GIT_ALL_TOKEN'
  #     -> SECRET123
  #   env -i 163_GIT_ALL_TOKEN=SECRET123 dash -c 'python3 ...os.environ...'
  #     -> None            # 非法名被 shell 在启动时剔掉，子进程也拿不到
  #   env -i 163_GIT_ALL_TOKEN=SECRET123 python3 ...os.environ...
  #     -> SECRET123       # 不经 shell 就能拿到
  #
  # 也就是说：token 确实被 imports 注入到了进程环境，是**默认 shell（dash）
  # 在启动时把这条非法名目删掉了**，连 /proc/self/environ 里的对应槽位都没了。
  # 这跟密钥仓库的 allow_* 授权无关（授权不通过是整文件加载失败，不是空值）。
  #
  # 所以修法只有一条：**把密钥文件里的键名改成合法标识符，然后直接用**。
  # 163 是多账号场景的账号标识，必须留——只是不能放开头，挪到中间/结尾即可：
  #   # xzydm/xzsecret 的 github.yml
  #   GIT_163_ALL_TOKEN: "ghp_163..."   # ✅ 推荐：账号号夹在中间
  #   GIT_ALL_TOKEN_163: "ghp_163..."   # ✅ 等价：账号号放结尾
  #   GIT_ABC_ALL_TOKEN: "ghp_abc..."   # ✅ 多账号并列，各用各的、不串号
  #   163_GIT_ALL_TOKEN: "ghp_163..."   # ❌ 数字开头：sh 里永远读不到
  # 本流水线按 GIT_163_ALL_TOKEN 直接引用；换账号只改这一处键名 + GITHUB_REPO。
  #
  # 密钥文件需要在密钥仓库侧声明 allow_* 规则，否则只有密钥仓管理员触发的
  # 流水线才有权引用（allow_* 一旦声明，触发者角色不再参与判定）：
  #   allow_slugs: "xzydm/lazy-balancer-v2"
  #   allow_events: "web_trigger_push_github"
  #   allow_branches: "main"
  # ──────────────────────────────────────────────────────────────
  web_trigger_push_github:
    - name: push-main-to-github
      runner:
        # 纯 git 操作，1 核足够
        cpus: 1
      docker:
        image: docker.cnb.cool/xzydm/mirrors/debian:13-all
      imports:
        # 密钥仓库中的 GitHub 凭据文件；键名 GIT_163_ALL_TOKEN 被原样注入，
        # 脚本直接用同名变量读取（不做任何中转改名，保持审计链路干净）。
        - https://cnb.cool/xzydm/xzsecret/-/blob/main/github.yml
      env:
        # GitHub 目标仓库，owner/repo 形式。
        # 默认指向本仓库在 GitHub 侧的 fork；若 fork 在别的账号名下，改这一行即可。
        GITHUB_REPO: JacksonJiangxh/lazy-balancer-v2
        # 源分支（本仓 main）与默认目标分支（可被按钮输入覆盖）
        SOURCE_BRANCH: main
        DEFAULT_TARGET_BRANCH: master-dev
        # 目标分支白名单：只允许推到这些分支，防止手滑把 main 推到 master/production。
        ALLOWED_TARGET_BRANCHES: master-dev
      stages:
        - name: push to github
          timeout: 20m
          script: |
            set -eu

            command -v git >/dev/null 2>&1 || { echo ">>> 缺少依赖：git"; exit 1; }

            # imports 逐 key 原样注入，变量名 = 密钥文件里的键名，直接用。
            # 这里不做任何中转改名：中转会让审计对象与实际参与拼接的字符串分离。
            # GIT_163_ALL_TOKEN 就是密钥文件里的键名（163 = 账号标识），
            # 换账号时只改这里和 GITHUB_REPO。
            TOKEN="${GIT_163_ALL_TOKEN:-}"
            if [ -z "$TOKEN" ]; then
              echo ">>> 未拿到 GitHub 令牌。请检查密钥仓库 xzydm/xzsecret 的 github.yml："
              echo "    - 键名需为 GIT_163_ALL_TOKEN（163 是账号标识，可换；但不得以数字开头："
              echo "      写 163_GIT_ALL_TOKEN 会被 shell 启动时剔除，永远读不到）"
              echo "    - 若已声明 allow_* 规则，需 allow_slugs 含 xzydm/lazy-balancer-v2、"
              echo "      allow_events 含 web_trigger_push_github、allow_branches 含 main"
              exit 1
            fi

            TARGET="${TARGET_BRANCH:-${DEFAULT_TARGET_BRANCH}}"

            # 白名单守卫：逗号或竖线分隔（用 tr 归一，不依赖 bash 的 ${var//}
            # 替换语法，保证在 dash/sh 下也能跑）
            ALLOWED_NORM="$(printf '%s' "${ALLOWED_TARGET_BRANCHES}" | tr '|' ',')"
            case ",${ALLOWED_NORM}," in
              *",${TARGET},"*) ;;
              *) echo ">>> 目标分支 ${TARGET} 不在白名单内（允许：${ALLOWED_TARGET_BRANCHES}）"; exit 1 ;;
            esac

            # FORCE 来自按钮输入（字符串 "true"/"false"）
            PUSH_ARGS=""
            if [ "${FORCE:-false}" = "true" ]; then
              echo ">>> 警告：FORCE=true，将覆盖 GitHub 侧 ${TARGET} 的历史"
              PUSH_ARGS="--force"
            fi

            # 带认证的 HTTPS 地址；token 不回显（git 自身不会打印凭据）
            REMOTE_URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPO}.git"

            echo ">>> 源：本仓 ${SOURCE_BRANCH}（${CNB_COMMIT_SHORT:-unknown}）"
            echo ">>> 目标：github.com/${GITHUB_REPO} ${TARGET}"

            # 把当前检出（本仓 main 的这次提交）直接推到 GitHub 目标分支。
            # 用 HEAD:refs/heads/<target> 避免本地检出分支名（main）与目标名
            #（master-dev）不一致带来的歧义。
            git push ${PUSH_ARGS} "${REMOTE_URL}" "HEAD:refs/heads/${TARGET}"
            echo ">>> 推送完成"


  api_trigger:
    - runner: *runner  # ← 引用 .runner 锚点（机型见锚点）
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: 奉诏执行
          type: npc:go
          options:
            <<: *budget   # ← 机械级预算硬顶（#TASK-ORCH-BUDGET-20260911-01；口径见 AGENTS.md §6.6）
            model: *model
            # role 从 settings.yml 解析角色 prompt；调兵令触发时 NPC_ROLE 总是显式传入（工部/刑部/门下等）。
            # 注意：变量替换只支持 $VAR / ${VAR} 两种形式，不支持 ${VAR:-默认值} 语法。
            role: ${NPC_ROLE}
            systemPrompt: |
              先读 AGENTS.md 总纲的「〇渐进披露导航」→ 按路由只精读本角色必读章节（案例库回放根目录 CASEBOOK.md），避免整份无差别重读稀释核心；当前仓库没有 AGENTS.md 时，直接读取公开地址 https://cnb.cool/i.o/x/-/git/raw/main/AGENTS.md 获取总纲，按角色职责执行。
              当前仓库代码已检出在 /workspace；需要调下游 NPC 时**按三态判据选通道**（**唯一现行口径＝AGENTS.md §6 / §14.4 三态，禁再按旧「二选一」理解**）：**态A**（同根 ∧ 目标仓 `.cnb/settings.yml` 可解析出该角色）→ 用 cnb build start-build 链式触发（**唯一可称「主通道」的态**，格式见 AGENTS.md 6.1 节）；**态B**（跨根 ∧ 有真人首棒 ≥Developer 勾「替我上班」）→ 带 work_mode 令牌的评论嵌套 @ 接力（@i.o/x(<角色>)）；**态C**（跨根 ∧ 无真人首棒/无写权）→ **通道不成立**，如实告知只做对话级服务、**禁发 api_trigger**（必 403 或空载荷假成功）。发任何调兵令前先过 §14.4「派单前三项实测硬前置」（同根 / settings 可解析 / 写权，任一不成立即不得发 api_trigger）；**同根 ∧ 无 settings** 特例改走 `api_trigger_npc` 内联提示词（禁用完整总纲注入，守 §6.6-C）。**★落地态（上位轴·三态之上 · #TASK-CHANNEL-DOCTRINE-20261006-01）**：选通道**先判目标仓有无落地**（`.cnb.yml`／NPC 配置／构建流水线；**落地判据＝目标仓根 `GET /{repo}/-/git/raw/HEAD/.cnb.yml` 可得（200=有落地／404=无落地；取证须用有读权令牌，无读权 404 ≠ 0 落地）**）——有落地 ⇒ 心跳或 api_trigger 调兵可用（上方三态照旧）；**0 落地 ⇒ 评论 @ 为唯一（必选）通道**（该场景唯一能自动续接链的路子，吃 Issue 评论配额、守 §6.4 续接；**该场景下评论 @ 兼作写码/续接通道，不受 §6『纯对话 · 非调兵通道』条『不需写码』限定**）；**0 落地不得设想「内置密钥／凭据」式拉起**（一律评论 @）；本条**不授权**非 0 落地场景禁评论 @（跨根／断链兜底仍在）。依据＝AGENTS.md §6 头部；矩阵见 `casebook/platform.md`。完成后按【回奏】格式到台账 Issue 回报。
              若本任务命中'内容平台/体裁产出'类需求（如小红书文案/抖音脚本/公众号/周报/会议纪要...），而诏令未附带对应场景提示词，先自查 `.codebuddy/skills/scenario-prompt-router/prompts/` 是否有匹配场景，有则补入工作上下文再产出（'用该领域行家写法 + 结合用户原始需求'），别裸写平台文案。
              【收敛入口（对外事件侧 · `#TASK-ORCH-CONVERGE-20261004-01 AC-1`）】**结论先行**（先出结论/回奏、再补证据）；单轮**最多深挖 3 项**（含 merge/派单/裁决），其余维**只登记不展开**；**禁整份 `cat`/通读总纲**（只读〇导航+本角色必读切片，深水区用 `bash scripts/kb-query.sh` Top-K 检索）；**轮次自警**：工具调用累计约 ≥80 次或已深挖满 3 项即**立即收敛出手**（防撞机械轮次上限致 `error`=交付断链）；**逼近第⑨维① / 第⑩维阈值即自退**（限巡检类任务，不追加深挖）。（措辞同源＝心跳段 `#TASK-HB-BUDGET-HARDEN-20260912-01 AC-1`；防撞括注取**档位中性**表述、不绑定档位取值，故各档位段通用，防跨档失实。）**首动作纪律（FU-CC-4 · #TASK-CROSSROOT-CHAINBREAK-20261007-01）**：**第一个写动作必须早于深挖**（先建分支/先落最小骨架，再补调研），禁「全程只调研、零落盘」——跨根 0 落地实测末跳 `out=32000/content=0` 静默丢步 ⇒ 零产出断链。
            userPrompt: |
              你被「调兵遣将」机制召唤（api_trigger 链式触发，已默认开启工作模式）。
              【收敛入口（对外事件侧 · `#TASK-ORCH-CONVERGE-20261004-01 AC-1`）】**结论先行**（先出结论/回奏、再补证据）；单轮**最多深挖 3 项**（含 merge/派单/裁决），其余维**只登记不展开**；**禁整份 `cat`/通读总纲**（只读〇导航+本角色必读切片，深水区用 `bash scripts/kb-query.sh` Top-K 检索）；**轮次自警**：工具调用累计约 ≥80 次或已深挖满 3 项即**立即收敛出手**（防撞机械轮次上限致 `error`=交付断链）；**逼近第⑨维① / 第⑩维阈值即自退**（限巡检类任务，不追加深挖）。（措辞同源＝心跳段 `#TASK-HB-BUDGET-HARDEN-20260912-01 AC-1`；防撞括注取**档位中性**表述、不绑定档位取值，故各档位段通用，防跨档失实。）**首动作纪律（FU-CC-4 · #TASK-CROSSROOT-CHAINBREAK-20261007-01）**：**第一个写动作必须早于深挖**（先建分支/先落最小骨架，再补调研），禁「全程只调研、零落盘」——跨根 0 落地实测末跳 `out=32000/content=0` 静默丢步 ⇒ 零产出断链。
              【当前环境】仓库：${CNB_REPO_SLUG}（本流水线就跑在这个仓库，分支 ${CNB_BRANCH}）。
              【注意】本体系不再自动向任何仓库安装/补齐三件套，也不要创建此类引导 PR；
              若当前仓库缺少 .cnb/settings.yml 导致角色无法解析，直接在回奏中如实说明并停止。
              严格履行你的角色职责，完成下方诏令/公文：
              ${SUMMON_BRIEF}

  # ---- 外部 API 调度通道（api_trigger_npc · docs 标准形态 · F-11 2026-09-09）----
  # docs npc-integration.md（https://docs.cnb.cool/zh/build/npc-integration.md）：
  #   外部系统 POST /{repo}/-/build/start + event: api_trigger_npc，请求体 env 传 role/systemPrompt/userPrompt
  #   （提示词全内联：不传 role 即完全不触 settings，天然适配跨根外部调度器/看门狗；
  #   传 role 仍按本仓 .cnb/settings.yml roles 定义解析、作 system prompt 拼接，勿传 settings 外角色名）。
  #   与上方 api_trigger 的区别：api_trigger 按 NPC_ROLE 从 settings.yml 解析角色 prompt（**态A** 同根调兵通道）；
  #   api_trigger_npc 提示词全内联（$role/$systemPrompt/$userPrompt 由 API env 注入 options），
  #   npc.name=CodeBuddy + workMode:true 可收敛为 NPC 工作模式 scope（见 docs npc-integration.md 参数说明）。
  #   调用示例：POST https://api.cnb.cool/{repo}/-/build/start
  #     { "event": "api_trigger_npc", "env": { "role": "...", "systemPrompt": "...", "userPrompt": "..." } }
  #   注意：变量替换只支持 $VAR / ${VAR} 两种形式；$role/$systemPrompt/$userPrompt 由 API env 同名注入。
  api_trigger_npc:
    - runner: *runner  # ← 引用 .runner 锚点（机型见锚点）
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: 奉诏执行
          type: npc:go
          options:
            <<: *budget   # ← 机械级预算硬顶（#TASK-ORCH-BUDGET-20260911-01；口径见 AGENTS.md §6.6）
            model: *model
            role: $role
            systemPrompt: $systemPrompt
            userPrompt: $userPrompt

  # ---- 兜底：评论 @ 未单独配置的角色（含外协NPC）----
  issue.comment@npc: *npc
  pull_request.comment@npc: *npc



# ---- PR 质量门自含闭环（多 stage 串行，不再依赖刑部内 api_trigger 拉门下）----
#      pull_request 是平台不可信事件，job 令牌缺 repo-cnb-trigger:rw，刑部内 start-build 拉门下定然 403。
#      故改为同流水线内 stages 串行自含：文档体量门 → 刑部审查 → 门下复审 → 质量门 gate script 校验。
  pull_request:
    - runner: *runner  # ← 引用 .runner 锚点（机型见锚点）
      docker:
        image: cnbcool/default-npc:latest
      # 台账号（PR 评论撞线守卫的改道目标 · #TASK-QG-CIRCUITBREAKER-20260910-01）：本 PR 对应单任务台账 Issue，
      #   撞线（PR 评论 ≥90）时各 stage 的评审/自愈留痕改发此 Issue，PR 只留一行结论指针。
      #   ★ P1-5 修复：**不再全仓硬编码单一台账号**（旧硬编码 #183 实为另一任务台账且已 closed，会错投留痕、
      #     违反 §6.4B-2「单任务台账」与单一事实源）。改为**动态解析**：守卫 stage 优先从 PR 正文的台账链接
      #     （`<repo>/-/issues/<N>` 或 `台账：#N` / `Issue #N`）解析本 PR 自己的台账号；
      #   env `QG_LEDGER_IID` 退为**可选覆盖/兜底**（调度方逐任务下发 `--env QG_LEDGER_IID=`）；二者不一致时
      #     以 PR 正文解析值为准并告警（防"调度方记得改"无机制保障）。
      #   未传且正文无台账链接 → 各 stage 跳过留痕、只写 /workspace/qg-*.txt（gate 不依赖评论，结论传递不受影响）。
      # ★ P1-3 修复（#TASK-QG-CIRCUITBREAKER-20260910-01 封驳 · 刑部实证）：**不在此声明空值 env**。
      #   官方 grammar 仅规定 `Stage env > Pipeline env > imports`；触发注入（api_trigger/web_trigger）的 env
      #   文档表述为流水线「默认」环境变量，**未承诺**其优先级高于 pipeline `env`——若按"默认"语义，
      #   这里声明 `VAR: ""` 反而会**覆盖**注入值，致探针隔离开关（`QG_DRY_RUN=1`）与调度台账号兜底
      #   （`QG_LEDGER_IID`）双双失效（前者=伪载荷污染真实台账，正是 F1 要防、已复发 3 次的场景）。
      #   两处声明**均无必要**：脚本已用 `${QG_DRY_RUN:-0}` / `${QG_LEDGER_IID:-}` 取默认值，
      #   声明删除后「未注入=取默认、已注入=生效」，语义更干净且无覆盖风险。
      # PR 质量门：多 stage 串行自含闭环（含文档体量门：读 SIZE-BUDGET.md 预算比对 wc -c；结论写**机器可读** qg-体量.rc=PASS/FAIL → gate 逐字等值判定，v4/S1 去文本化）
      #   每个 npc:go stage 无论审查结论通过/拒绝均正常 exit 0（结论靠写 /workspace/qg-*.txt 共享文件传递，
      #   不靠 npc:go 退出码——npc:go exit 1 会直接跳 failStages，与「质量门拒绝」难区分）；
      #   最终门结论由最后一个「质量门-gate」script stage 读 qg 文件统一判定：均过 exit 0（流水线绿），
      #   任一未过 exit 1 → 触发 failStages 工部自愈（读 qg 文件定位缺陷 → 修复 → push → 触发新 CI 重走质量门 pass^k）。
      stages:
        # ---- 评论撞线守卫（#TASK-QG-CIRCUITBREAKER-20260910-01 · 判据本体外置＝方案 B #TASK-F-251-B2-20261003-01）----
        #   查 PR 评论数、按阈值判定留痕目标（pr / ledger / skip），写 /workspace/qg-留痕目标.txt 供后续 npc:go stage 读
        #   （**gate 靠 qg-*.txt 传递结论的机制不变、不依赖评论**）；判据细则见下方 stage 内注释与 `scripts/qg-ledger-resolve.sh`。
        - name: 评论撞线守卫
          script: |
            set +e
            #   ★ P1-1（门下 R3 封驳要求 · 与 `质量门-gate` stage §P1-1 同纪律）：**pin `LC_ALL=C`**，
            #     使本 stage 判据**自足 locale 无关**——`[[:space:]]` 等 POSIX 类在 C/POSIX 按字节、C.UTF-8 按字符，
            #     不 pin 则 marker 行含非 ASCII 空白时行为随环境漂移（生产 sh=dash、`LC_CTYPE=POSIX`）。
            #     判据本体另有 `qg_strip_ws` 归一做兜底（双保险），见 `scripts/qg-ledger-resolve.sh`。
            export LC_ALL=C
            # ---- 评论撞线守卫（#TASK-QG-CIRCUITBREAKER-20260910-01 · 方案 B #TASK-F-251-B2-20261003-01）：给各 stage 机器可判的留痕目标 ----
            #   PR 评论 >100 后其 @npc 事件静默停发，而 failStages/crontab（可信事件）照常运行 → 执行环自转、监督者失明。
            #   本 stage **只做 I/O**：取 PR 正文 / 评论数 → 调 `scripts/qg-ledger-resolve.sh` 的判据函数 → 写 /workspace/qg-留痕目标.txt。
            #   ★ 换方案 B（#423 · 源 #397 · 源 PR#421）——判据**外置为可测函数**，本 stage 内**不再有任何启发式文本解析**：
            #     旧形态（分层优先级 / 层序 / 80 字窗 / fail-open 复活）系「代理语义」逐句打补丁，每种层序各有失手形状
            #     （R1 层序倒挂 → R2 复活已判 closed 候选 + closed 候选压过 env）。现判据＝
            #       ① 权威源优先：正文 `QG-Ledger: <N>` 独立行 ＞ env `QG_LEDGER_IID` ＞ 正文自然语言候选（fallback）；
            #       ② 只采用 `state=open`；`closed` **确定排除、永不复活**（不入候选池），`unknown` 不猜；
            #       ③ fallback 须「唯一 ∧ 确定 open ∧ 无未知候选」；
            #       ④ 无可用台账号 ⇒ **fail-safe 回落 TARGET=pr**（不造 skip 全灭）。
            #     判据本体与用例矩阵：`scripts/qg-ledger-resolve.sh` + `scripts/gate-regression.sh` `C-guard` 组（闭合 P1-3 回归锁零覆盖）。
            REPO="${CNB_REPO_SLUG:-i.o/x}"
            PR="${CNB_PULL_REQUEST_IID:-}"
            LG_ENV="${QG_LEDGER_IID:-}"
            SAFE=90
            echo "===== PR 评论撞线守卫（阈值 $SAFE · 台账 ${LG_ENV:-未传}）====="
            #   判据函数来源：仓库工作区 `scripts/qg-ledger-resolve.sh`（缺失即判据不可用 → fail-safe 回落 PR 留痕，并大声告警）
            if [ -f scripts/qg-ledger-resolve.sh ]; then
              . scripts/qg-ledger-resolve.sh
            elif [ -f /workspace/scripts/qg-ledger-resolve.sh ]; then
              . /workspace/scripts/qg-ledger-resolve.sh
            fi

            LEDGER=""; LG_SOURCE="none"; LG_WARN=""; LG_ACTION=""
            if command -v qg_resolve_ledger >/dev/null 2>&1 && [ -n "$PR" ] && command -v cnb >/dev/null 2>&1; then
              #   I/O：取 PR 正文。★ 必须**从 JSON envelope 解出 `data.body`**（`qg_body_from_json`）——
              #     `cnb pulls get-pull -v` 把整篇正文压进**一行** JSON、换行记作字面 `\n`，直接喂判据则
              #     「marker 独立行」契约（`^…$`）恒不命中。
              #   ★ P2-2 收执（门下独立实测）：**无 python3 环境**时 `qg_body_from_json` 静默退空，
              #     旧「回落原文」会让 marker 因 JSON 引号被吸进匹配串而失效、**静默取到 fallback 候选**
              #     （实测本应 marker 423 却取到 397）且无降级告警。故解析未得 `data.body` ⇒
              #     **不再喂原文**（判据不可信），直接 **fail-safe 回落 TARGET=pr** 并大声告警。
              PR_JSON="$(cnb pulls get-pull --repo "$REPO" --number "$PR" -v 2>/dev/null)"
              PR_BODY="$(printf '%s' "$PR_JSON" | qg_body_from_json 2>/dev/null)"
              if [ -z "$PR_BODY" ]; then
                echo "⚠️ PR 正文 JSON 解析未得 data.body（python3 缺失 / 响应异常）→ 判据不可信，fail-safe 回落 TARGET=pr" >&2
                printf 'TARGET=pr reason=body-parse-failed ledger=none\n' > /workspace/qg-留痕目标.txt
                echo "TARGET=pr reason=body-parse-failed ledger=none"
                exit 0
              fi
              _res="$(qg_resolve_ledger "$REPO" "$PR_BODY" "$LG_ENV")"
              LEDGER="$(printf '%s\n' "$_res" | sed -n 's/^LEDGER=//p')"
              LG_SOURCE="$(printf '%s\n' "$_res" | sed -n 's/^SOURCE=//p')"
              LG_WARN="$(printf '%s\n' "$_res" | sed -n 's/^WARN=//p')"
              LG_ACTION="$(printf '%s\n' "$_res" | sed -n 's/^NO_LEDGER_ACTION=//p')"
              [ "$LEDGER" = "none" ] && LEDGER=""
              if [ -n "$LEDGER" ]; then
                echo "台账号解析：本 PR 单任务台账 = #$LEDGER（来源：$LG_SOURCE）"
              elif [ "$LG_ACTION" = "pr" ]; then
                echo "⚠️ 台账号解析：有候选但无一可采信（closed/unknown/多候选）→ fail-safe 回落 PR 留痕（不造 skip 全灭）"
              elif [ -n "$PR" ]; then
                echo "⚠️ 台账号解析：正文与 env 均无台账候选 → 撞线时将跳过留痕（只写 qg-*.txt）"
              fi
            elif [ -z "$PR" ]; then
              echo "⚠️ 无 PR IID（非 PR 事件），跳过留痕目标判定"
            else
              echo "⚠️ 判据函数不可用（scripts/qg-ledger-resolve.sh 缺失）→ fail-safe 回落 PR 留痕"
              [ -n "$LG_ENV" ] && { LEDGER="$LG_ENV"; LG_SOURCE="env-fallback"; }
            fi

            # ---- 评论数取数（x-cnb-total）----
            #   CLI 取数 + REST 兜底；REST 要点（#TASK-QG-CIRCUITBREAKER-20260910-01 修复 · 刑部 P1-2 / 门下 P1-2 实证）：
            #   ① 必须 GET（`-D - -o /dev/null`），`curl -sI`(HEAD) 打该端点返 404、无响应头可解析；
            #   ② 必须带 `Accept: application/json`，否则对 OpenAPI 返 401/406；
            #   ③ 真实头名 `X-Cnb-Total` 首字母大写，本镜像 awk=mawk 不支持 IGNORECASE → 用 `grep -i`、`tr -d '\r'` 后匹配。
            TOTAL=""
            if [ -n "$PR" ]; then
              TOTAL="$(cnb pulls list-pull-comments --repo "$REPO" --number "$PR" --page-size 1 -v 2>/dev/null \
                | tr -d '\r' | grep -m1 -oE '"x-cnb-total"[[:space:]]*:[[:space:]]*"?[0-9]+' | grep -oE '[0-9]+' | head -1)"
              if ! printf '%s' "$TOTAL" | grep -qE '^[0-9]+$'; then
                TOTAL="$(curl -s -D - -o /dev/null -H "Authorization: Bearer ${CNB_TOKEN:-}" \
                  -H "Accept: application/json" \
                  "${CNB_API_ENDPOINT:-https://api.cnb.cool}/$REPO/-/pulls/$PR/comments?pageSize=1" 2>/dev/null \
                  | tr -d '\r' | grep -im1 '^x-cnb-total:' | grep -oE '[0-9]+' | head -1)"
              fi
              printf '%s' "$TOTAL" | grep -qE '^[0-9]+$' || TOTAL="unknown"
            fi

            # ---- 留痕目标判定（判据函数：无台账号且无可信候选 ⇒ fail-safe 回 pr）----
            LEDGER_FIELD="none"
            printf '%s' "$LEDGER" | grep -qE '^[0-9]+$' && LEDGER_FIELD="$LEDGER"
            WARN_FIELD=""; [ -n "$LG_WARN" ] && WARN_FIELD=" warn=$LG_WARN"
            if [ -z "$PR" ]; then
              echo "TARGET=skip reason=no-pr-iid ledger=$LEDGER_FIELD$WARN_FIELD" > /workspace/qg-留痕目标.txt
              exit 0
            fi
            if command -v qg_compute_target >/dev/null 2>&1; then
              TARGET_LINE="$(qg_compute_target "$LEDGER" "$LG_ACTION" "$TOTAL" "$SAFE")"
            elif [ "$TOTAL" = "unknown" ]; then
              TARGET_LINE="TARGET=pr reason=total-unknown"      # 取数失败 → 保守回落 PR（口径同旧实现）
            elif [ "$LEDGER_FIELD" = "none" ]; then
              TARGET_LINE="TARGET=pr reason=resolver-missing"   # 判据不可用 → 一律回落 PR（fail-safe，不静默 skip）
            else
              TARGET_LINE="TARGET=pr"
            fi
            printf '%s total=%s ledger=%s%s\n' "$TARGET_LINE" "$TOTAL" "$LEDGER_FIELD" "$WARN_FIELD" > /workspace/qg-留痕目标.txt
            case "$TARGET_LINE" in
              TARGET=ledger*)
                echo "🚨 PR #$PR 评论数 $TOTAL ≥ $SAFE（已撞线，@npc 事件静默停发）→ 留痕改道台账 Issue #$LEDGER，PR 只留一行结论指针" ;;
              TARGET=pr\ reason=no-usable-ledger-failsafe)
                echo "🚨 PR #$PR 评论数 $TOTAL ≥ $SAFE 且无可采信台账号（候选 closed/unknown/多候选）→ fail-safe 回落 PR 留痕（不造 skip 全灭；ledger=none）" ;;
              TARGET=pr\ reason=total-unknown)
                echo "⚠️ PR 评论数取数失败 → 保守回落 TARGET=pr（真撞线时至多多 1 条，代价可控；ledger=$LEDGER_FIELD）" ;;
              TARGET=pr)
                echo "✅ PR #$PR 评论数 $TOTAL < $SAFE（未撞线）→ 照旧在 PR 留痕（ledger=$LEDGER_FIELD）" ;;
              *)
                echo "🚨 PR #$PR 评论数 $TOTAL ≥ $SAFE 且正文/env 均无台账候选 → 跳过留痕，只写 qg-*.txt" ;;
            esac
            exit 0
        # ---- 运行时产物守卫（AC-1 · #TASK-QG-ARTIFACT-GUARD-20261004-01）----
        #   为什么：`$:pull_request` 判定（既有：体量门 / 冲突标记残片门 / 刑部 / 门下；**本单新增**：GFM 表行竖线门）**均只读内容**，
        #   **不校验「tracked 文件清单 ⊆ 白名单」**⇒ 可能出现「门全绿、却携带越范围运行时产物」
        #   （该形态**已第 3 次复发**：① `qg-熔断-判定.txt` 曾被误提交；② PR#499 head `2196a4d` 误入库
        #    `qg-冲突.rc`/`qg-冲突.txt`；③ 本条立项）；且仓库根**原先无 `.gitignore`**，`git add -A` 必然带走
        #   `/workspace` 根层全部 `qg-*` / `CNB_BUILD_FAILED_*` / `selfheal.patch`。故本 stage 是**廉价前置守卫**：
        #   `git ls-files`（tracked 清单）命中运行时产物族即**判否**（exit 1 → failStages 工部自愈）。
        #   判据（机器可读 · 逐字契约）：黑名单**单源变量 `AR_PAT`**（仅此一处可改，防多份漂移）——
        #     `^(qg-|CNB_BUILD_FAILED_|selfheal\.patch$)`，**仅匹配仓库根一层**。
        #     ★ 为什么不匹配任意深度：`scripts/qg-ledger-resolve.sh` 是**合法 tracked 文件**（根层限定才不误杀，
        #       见 AC-3 误杀防护；「任意深度匹配」= 把合法脚本判否，是比漏判更坏的误杀）。
        #     ★ 取数必须走 `-z`（NUL 分隔）：`git ls-files` **默认 `core.quotePath=true`**，非 ASCII 路径被
        #       C 式转义**并加双引号**（`qg-冲突.rc` → `"qg-\345\206\262\347\252\201.rc"`，首字符是 `"` 而非 `q`）
        #       ⇒ 裸 `ls-files | grep -E '^qg-'` 对本仓**中文族名**（真实产物名几乎全为中文）**恒不命中**、
        #       守卫对该族 fail-open（同一夹具实测：默认输出命中 1/3、`-z` 输出命中 3/3）。
        #     ★ 取数失败 **fail-closed**：`git rev-parse --git-dir` 非 0（非 git 仓库 / git 不可用）⇒ **判否**；
        #       不得把「取数失败」当「无命中」放行（旧实现 `ls-files 2>/dev/null` 取空即判过，非 git 目录实测 rc=0）。
        #   结论另写机器可读 `/workspace/qg-产物.rc`（仅 PASS/FAIL，与既有 qg-*.rc 口径一致）
        #     + 人类可读 `qg-产物.txt`（审计留痕，**已入 failStages 转储清单**——判红时工部可直接取命中清单，
        #       与下方自述目的对齐；旧版未入转储、判红时工部只能去翻构建日志）。
        #   ★ 本 stage **自含判否**（硬门 = 自身 exit code），不依赖 `质量门-gate` 纳判——
        #     故无「孤儿产物 / 死指针」面（F-135⑦）；既有判定语义**零改动**（白名单禁改既有 stage 语义）。
        #   夹具驱动：仓库根可由 `QG_ARTIFACT_REPO_ROOT` 覆盖、输出目录由 `QG_ARTIFACT_OUT_DIR` 覆盖，
        #     供 `scripts/gate-regression.sh` C-ARTIFACT 组注入 fixture 原样复跑（判据源＝本 stage script，不复制不改写）。
        - name: 运行时产物守卫
          script: |
            set +e
            #   ★ `set +e`：本 stage 由平台 `sh -e -c` 执行（/bin/sh -> dash）；下方 `git ls-files | grep -E`
            #     在**无命中**时末条 grep 退出码=1，「赋值+命令替换」会继承该非零码 ⇒ `set -e` 直接中止整段
            #     （口径与同库 `评论撞线守卫`/`冲突标记残片门`/`质量门-gate` 一致：结论靠 rc 契约 + exit code 传递，
            #      且「无命中」是**通过**语义、不得致命化）。
            set +e
            export LC_ALL=C
            echo "===== 运行时产物守卫（AC-1 · #TASK-QG-ARTIFACT-GUARD-20261004-01）====="
            AR_ROOT="${QG_ARTIFACT_REPO_ROOT:-.}"
            AR_OUT="${QG_ARTIFACT_OUT_DIR:-/workspace}"
            #   黑名单族（单源变量 · 仅仓库根一层）：qg-* / CNB_BUILD_FAILED_* / selfheal.patch
            AR_PAT='^(qg-|CNB_BUILD_FAILED_|selfheal\.patch$)'
            echo "扫描根=$AR_ROOT（tracked 清单 = git ls-files -z · 仅根层 · 黑名单=$AR_PAT）"
            if ! git -C "$AR_ROOT" rev-parse --git-dir >/dev/null 2>&1; then
              printf 'FAIL\n' > "$AR_OUT/qg-产物.rc"
              {
                echo "❌ 运行时产物守卫未通过（取数失败 ⇒ fail-closed）";
                echo "→ 根=$AR_ROOT 非 git 仓库 / git 不可用（git rev-parse --git-dir 非 0）⇒ 无法核 tracked 清单；";
                echo "  按 fail-closed 判否（不得把「取数失败」当「无命中」放行）。";
              } > "$AR_OUT/qg-产物.txt"
              cat "$AR_OUT/qg-产物.txt"
              exit 1
            fi
            AR_HITS="$(git -C "$AR_ROOT" ls-files -z 2>/dev/null | tr '\0' '\n' | LC_ALL=C grep -E "$AR_PAT")"
            if [ -n "$AR_HITS" ]; then
              printf 'FAIL\n' > "$AR_OUT/qg-产物.rc"
              {
                echo "❌ 运行时产物守卫未通过（tracked 清单命中运行时产物族 · 命中文件如下）";
                echo "$AR_HITS";
                echo "→ 处置：这些是本流水线的运行时输出（非交付物）——逐文件 git rm --cached <file> 后重推；";
                echo "  后续提交**逐文件显式 add**（严禁 git add -A / git add . / git commit -a）。";
              } > "$AR_OUT/qg-产物.txt"
              cat "$AR_OUT/qg-产物.txt"
              exit 1
            fi
            printf 'PASS\n' > "$AR_OUT/qg-产物.rc"
            printf '%s\n' "✅ tracked 清单无运行时产物（根层 qg-* / CNB_BUILD_FAILED_* / selfheal.patch 命中 0）" > "$AR_OUT/qg-产物.txt"
            echo "✅ 运行时产物守卫通过（qg-产物.rc=PASS）"
            exit 0
        # ---- 冲突标记残片门（AC-4 · F-300 · #TASK-GUARD-NONSTD-20261003-01）----
        #   为什么：§7 第2条要求追加型文件冲突「取双方条目并集」，但**无任何断言**核验合并后无冲突标记残片
        #   （实证：PR#425 merge `2ba6f37` 后 `CHANGELOG.md` 残留 `<<<<<<< HEAD` 类残片，破坏结构；
        #    `CHANGELOG.md` 豁免体量门 ⇒ 该形态只可能由本门堵）。
        #   判据：全仓 `.md` 不得出现冲突标记族（`^<{7}` / `^={7}$` / `^>{7}`）；命中即 **exit 1**（判红 → failStages 工部自愈）。
        #   结论另写机器可读 `/workspace/qg-冲突.rc`（仅 PASS/FAIL）+ 人类可读 `qg-冲突.txt`（审计留痕）。
        #   夹具驱动：扫描根可由 `QG_MD_SCAN_ROOT` 覆盖，供 `scripts/gate-regression.sh` C-CONFLICT 组
        #   注入 fixture（残片件必红 / 干净件必绿）原样复跑——判据源＝本 stage script 本身（不复制、不改写）。
        - name: 冲突标记残片门
          script: |
            set +e
            echo "===== 冲突标记残片门（AC-4 · F-300）====="
            CM_ROOT="${QG_MD_SCAN_ROOT:-.}"
            #   ★ 结论落盘目录 env 可覆盖（#TASK-GATEREG-REDIR-20261005-01 AC-1 实现①）：
            #     默认 `/workspace`（现网运行口径不变）；`scripts/gate-regression.sh` C-CONFLICT 组注入
            #     `QG_CM_OUT_DIR=$TMP/cm_out` ⇒ 原样抽取复跑时结论**不再写仓库根**（对齐既有 `QG_MD_SCAN_ROOT`
            #     夹具驱动范式；本 stage 是全库唯一写仓库根运行时产物的判据源，见台账 #546）。
            CM_OUT="${QG_CM_OUT_DIR:-/workspace}"
            #   ★ fail-closed（P2-3 · 刑部/门下并案）：落盘目录不可用时**不得静默 fail-open**——
            #     原实现下 `printf > "$CM_OUT/..."` 报错但整段仍 `exit 0`、结论件全缺 ⇒ 下游 gate
            #     走「两缺 ⇒ 跳过」⇒ 冲突门静默 fail-OPEN。故先确保目录可达，不可达即判否退出。
            if ! mkdir -p "$CM_OUT" 2>/dev/null || [ ! -w "$CM_OUT" ]; then
              echo "❌ 冲突标记残片门：结论落盘目录不可用（CM_OUT=$CM_OUT）⇒ fail-closed 判否（禁静默放行）"
              exit 1
            fi
            CM_HITS="$(find "$CM_ROOT" -type f -name '*.md' ! -path '*/.git/*' 2>/dev/null \
              | LC_ALL=C sort | while IFS= read -r f; do
                  LC_ALL=C grep -nE -e '^<{7}' -e '^={7}$' -e '^>{7}' "$f" 2>/dev/null | sed "s#^#$f:#"
                done)"
            if [ -n "$CM_HITS" ]; then
              printf 'FAIL\n' > "$CM_OUT/qg-冲突.rc"
              { echo "❌ 冲突标记残片门未通过（全仓 .md 检出冲突标记族 · 命中行如下）"; echo "$CM_HITS"; } > "$CM_OUT/qg-冲突.txt"
              cat "$CM_OUT/qg-冲突.txt"
              echo "→ 处置：按 §7 第2条重做并集改写（只追加不删史、取双方条目并集），清残片后重推；本 stage 判红触发 failStages 自愈"
              exit 1
            fi
            printf 'PASS\n' > "$CM_OUT/qg-冲突.rc"
            printf '%s\n' "✅ 无冲突标记残片（全仓 .md）" > "$CM_OUT/qg-冲突.txt"
            echo "✅ 冲突标记残片门通过（扫描根=$CM_ROOT）"
            exit 0
        # ---- GFM 表行竖线门（AC-2 · #TASK-GROWTH-20261006-05 · 台账 #616）----
        #   为什么：表行内**未转义** `|` 被 GFM 当单元格分隔符 ⇒ 超出表头列数的 cell 被**静默丢弃**
        #   （GFM Spec §4.10 Tables："the excess is ignored"）、正文后段读者看不到且**无 fail 信号**——
        #   既有判定只读内容与体量，该形态全绿逃逸（本门立项时全仓 2 处实测）。
        #   判据（机器可读 · 逐字契约）：调 `scripts/gfm-table-guard.sh`（判据本体在脚本内、本 stage 不复制）
        #   ——**表识别交由 GFM 参照实现**（`markdown-it-py`，锁版本声明于守卫常量），守卫**逐源行比对单元数**
        #   （表头列数 vs 数据行源串单元数）；不等即违规。（旧「自研容器栈近似」对列表项/块引用/惰性续行
        #   三类容器**双向失真**：真表整类漏检 + 对 GFM 非表内容误杀——已由台账 #616 换方案轮整体替换。）
        #   违规 → 非零退出即**判否**（exit 1 → failStages 工部自愈）；不可检视（python3 缺失 / 参照实现不可用 /
        #   扫描根不存在 / 扫描面 0 个 `.md`）→ exit 2 **fail-closed 判否**（不得把「取数失败」当「无违规」放行）。
        #   结论另写机器可读 `/workspace/qg-表行.rc`（仅 PASS/FAIL）+ 人类可读 `qg-表行.txt`（审计留痕，已入 failStages 转储清单）。
        #   回归锁：`scripts/gate-regression.sh` **C-GFM** / **C-GFM-WIRE** 组（判据双向 + 扫空 fail-closed + 接线 E2E + 变异负向自证）。
        - name: GFM 表行竖线门
          script: |
            set +e
            echo "===== GFM 表行竖线门（AC-2 · 台账 #616）====="
            GR_ROOT="${QG_MD_SCAN_ROOT:-.}"
            bash scripts/gfm-table-guard.sh "$GR_ROOT" > /workspace/qg-表行.txt 2>&1
            gr_rc=$?
            cat /workspace/qg-表行.txt
            if [ "$gr_rc" -ne 0 ]; then
              printf 'FAIL\n' > /workspace/qg-表行.rc
              echo "❌ GFM 表行竖线门未通过（rc=$gr_rc · 违规或不可检视）"
              echo "→ 处置：表行内竖线一律转义（反斜杠+竖线）；含裸竖线的枚举/命令移出 cell（置表后代码块/引用块）；清后重推"
              exit 1
            fi
            printf 'PASS\n' > /workspace/qg-表行.rc
            echo "✅ GFM 表行竖线门通过（qg-表行.rc=PASS · 扫描根=$GR_ROOT）"
            exit 0
        - name: 文档体量门
          # ★ 换方案 S1（#229 · 中书令 14:13 裁决 · 体量门判据去文本化）：
          #   产出方（本 stage）按 size-check 的 **exit code** 写**机器可读逐字契约** /workspace/qg-体量.rc
          #   （仅 `PASS`/`FAIL`）；消费方（质量门-gate）对 `.rc` **逐字等值**判定，**零归一/零正则/零锚定**。
          #   `qg-体量.txt` 降为**人类可读留痕**（日志/审计），**不进判据**——从根上消灭「锚定（左/右/两端）/
          #   伪造后缀/不可见字符前缀/剥离彻底性/重复次数/空白字符类」整族 5 代同族变体（§8 护栏②）。
          script: |
            # ★ set +e（P1-1 收口 · #TASK-FAILSTAGE-SETPLUS-20261004-01 R2）：
            #   本 stage 由平台 `sh -e -c` 执行（/bin/sh -> dash）；`bash scripts/size-check.sh > …`
            #   在 size-check 自身 rc≠0（超预算）时返回非零 ⇒ `set -e` **立即中止整段**，
            #   下方 `rc=$?` / `printf FAIL > qg-体量.rc` / `exit 0` 全不执行 ⇒ rc 契约不生成、
            #   stage error，其后的 刑部自动审查/门下侍中复审/质量门-gate **不接续**（与本案
            #   failStages 首段所修缺陷**同类同因**，两门独立实跑反证）。本 stage 的结论语义是
            #   「由 qg-体量.rc 逐字契约传递、stage 自身恒 exit 0」⇒ 必须声明 `set +e` 才能让
            #   `rc=$?` 捕获到 size-check 的退出码。与同库其余 script stage 口径一致。
            set +e
            echo "===== 文档体量门（SIZE-BUDGET.md 唯一体量事实源）开始 ====="
            if [ -f /workspace/SIZE-BUDGET.md ] || [ -f SIZE-BUDGET.md ]; then
              bash scripts/size-check.sh > /workspace/qg-体量.txt 2>&1
              rc=$?
              echo "--- size-check 输出（写入 /workspace/qg-体量.txt，仅供人读，**不参与判据**）---"
              cat /workspace/qg-体量.txt
              if [ $rc -ne 0 ]; then
                printf 'FAIL\n' > /workspace/qg-体量.rc
                echo "❌ 文档体量门未通过（超预算）→ qg-体量.rc=FAIL（判据源）"
                exit 0   # 结论靠 qg-体量.rc 传递；最终门判定由质量门-gate 统一做
              else
                printf 'PASS\n' > /workspace/qg-体量.rc
                echo "✅ 文档体量门通过 → qg-体量.rc=PASS"
                exit 0
              fi
            else
              echo "⚠️ SIZE-BUDGET.md 不存在，跳过文档体量门（该仓库未启用体量预算治理）"
              printf 'PASS\n' > /workspace/qg-体量.rc
              echo "✅通过（无预算表，跳过）" > /workspace/qg-体量.txt
              exit 0
            fi
        - name: 刑部自动审查
          type: npc:go
          options:
            <<: *budget   # ← 机械级预算硬顶（#TASK-ORCH-BUDGET-20260911-01；口径见 AGENTS.md §6.6）
            model: *model
            role: 刑部尚书
            systemPrompt: |
              你是「刑部尚书」，掌测试与质量审计（QA）。先读 AGENTS.md 总纲的「〇渐进披露导航」→ 按路由精读必读章节（案例库回放根目录 CASEBOOK.md，按任务领域读对应分册），避免整份无差别重读稀释核心；当前仓库没有 AGENTS.md 时，直接读取公开地址 https://cnb.cool/i.o/x/-/git/raw/main/AGENTS.md 获取总纲，按角色职责执行。
              本次任务：对当前 PR 做质量审查（PR 质量门第一道门）。跑测试与静态检查，对照 PR 目的与仓库既有约定逐项核验，产出「通过/拒绝 + 缺陷清单」结论写入 /workspace/qg-刑部.txt。**留痕按条件改道**（见 userPrompt 第 5 步·PR 评论撞线守卫）：默认在 PR 评论按【回奏】格式留痕，撞线时改发台账 Issue。只测不改，发现缺陷不自己修，写清给工部的修复指引。
            userPrompt: |
              你是被【PR 质量门·刑部自动审查】stage 唤起的「刑部尚书」。请对当前 PR 做第一道质量门审查。
              ★【环境失联早退护栏 · #TASK-SELFHEAL-MECH-20260912-01-R4 · 必读】本轮 bash 若返回
              `Error response from daemon: No such container: <本构建 sn>-001`（或其等价「容器不存在」文案），
              即表示**本 stage 的运行沙箱容器已死亡**（历史上多由 `cp -a /workspace` 全量拷贝 + 反复整跑
              `gate-regression.sh` 触发 OOM/SIGKILL 所致——PR#316 实录：此后每条命令恒返回该错误，Agent 却
              重试 ~180 次直至 `aborted by maxTurns: 200` → stage error → 整条 pipeline error）。
              **判据＝二进制**：同一「容器不存在」错误**连续出现 2 次**即**立即停止重试**——
              不要再 `echo/ls/cd` 试活、不要轮询等待容器恢复（它不会自行恢复），直接按下方「异常处理」收尾：
                · 若尚未写出本 stage 结论文件 → 写入**异常结论**（刑部写 `❌拒绝`、门下写 `驳`，第 2 行起注明
                  「沙箱容器失联，无法完成独立验证：<错误原文>」），保证 gate fail-closed（不过度判过）；
                · 若已写出结论文件（结论已固化）→ 直接正常结束本 stage，不因环境失联改写既有结论。
              **禁重试纪律**：容器失联后**任何**重试都无意义，重试只会烧穿 maxTurns 把「环境故障」升级为
              「质量门结论缺失」。环境故障应在**回奏**中据实登记为遗留项（供调度方重跑/换机），而非死磕。
              ★【禁 OOM 重探针】验证判别力/复现判据时，**禁止** `cp -a /workspace <dest>` 全量拷贝仓库、
              亦禁止在单 stage 内多次整跑 `scripts/gate-regression.sh`；如需副本/变异体，只在 `/tmp` 下用
              **最小必要文件**（如单脚本 + 其依赖）以小样构建，或直接用管线（`sed`/`awk`）做内存内变异。
              【当前仓库】${CNB_REPO_SLUG}（分支 ${CNB_BRANCH}，PR #${CNB_PULL_REQUEST_IID}）。代码已检出在 /workspace（PR 源分支最新 commit）。
              ★【落盘硬要求 · 先落盘再深挖 · #TASK-QG-CHANNEL-FAULT-20261004-01 · 必读】：
                本 stage 是 `npc:go`，平台**恒 exit 0**（你正常结束即 stage success）。若你**未写**结论文件，
                gate 只能看到「文件不存在」，无法与「判否」区分（实测 sn `cnb-s4c-1k42o39kb`：本 stage success、
                `done. 55 turns`，`/workspace/qg-刑部.txt` 全程未落盘）。故**首个动作**即落盘一条**fail-closed 初值**：
                  `printf '❌拒绝\n（初判 · 待复核：本行以下将按最终结论覆盖）\n' > /workspace/qg-刑部.txt && : > /workspace/qg-刑部.初值`
                **为什么先写 `❌拒绝`**：初值必须是**否决态**——若你中途停止/未及覆盖，gate 只会按否决处理
                （fail-**closed**、绝不放行未审完的 PR）；**禁**先写 `✅通过`（那会让中途停止变成 fail-**open** 误放行）。
                核验完成后**覆盖写**最终结论（通过 ⇒ `✅通过`；拒绝 ⇒ `❌拒绝`+清单）**并 `rm -f /workspace/qg-刑部.初值`**。
                落初值时 `: > /workspace/qg-刑部.初值` 建**旁路标记**、覆盖写时删它——gate 据「标记在 ⇒ 初值未被覆盖」
                把「0 字节 / 纯空白 / 初值残留」一并归机制面（`MG-XB-NOCONC`），而非与真判否同码；**只要不覆盖，就以否决论**。
              【要做的事】：
                1. 查看本 PR 变更：`git log --oneline -10` + `git diff origin/${CNB_DEFAULT_BRANCH}...HEAD`（或 cnb pulls 接口获取 PR diff）了解改动内容与范围；
                2. 若改动涉代码，跑仓库测试/静态检查（npm test / lint / 构建等，按仓库既有脚本），记录结果；
                   - ★ 若本 PR 触及 **gate 判据**（`.cnb.yml` 质量门-gate / 体量门 / 首行 token 契约），**必须**跑 `bash scripts/gate-regression.sh`（判据用例矩阵单一源，含 3 locale 一致性断言）并贴输出——判据改动未附该矩阵全绿即视为**证据不足**；
