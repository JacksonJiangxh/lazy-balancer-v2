                  return t
                }
                function _lp_val(line, f,   s, n, seg, i, t, pick) {
                  s = line; gsub(/\r/, "", s); gsub(/｜/, "|", s)
                  n = split(s, seg, "|"); pick = ""
                  for (i = 1; i <= n; i++) {
                    t = _lp_strip(seg[i])
                    if (index(t, f "：") == 1) { pick = t; break }
                  }
                  if (pick == "") pick = _lp_strip(s)
                  sub(/^[^：]*：/, "", pick)
                  gsub(/^[ \t]+/, "", pick); gsub(/[ \t]+$/, "", pick)
                  return pick
                }
                function _lp_nums(v,   r, s, out) {
                  out = ""; s = v
                  while (match(s, /#[ \t]*[0-9]+/)) {
                    r = substr(s, RSTART, RLENGTH); gsub(/[# \t]/, "", r)
                    if (out == "") out = r
                    else if (index("," out ",", "," r ",") == 0) out = out "," r
                    s = substr(s, RSTART + RLENGTH)
                  }
                  return out
                }
                { _lp_body[NR] = $0 }
                END {
                  _lp_n = 3; _lp_f[1] = "承接"; _lp_f[2] = "前置"; _lp_f[3] = "封驳计数"
                  for (k = 1; k <= _lp_n; k++) { _lp_form[k] = ""; _lp_line[k] = "" }
                  for (k = 1; k <= _lp_n; k++) {
                    for (i = 1; i <= NR; i++)
                      if (index(_lp_body[i], _lp_f[k] "：") == 1) { _lp_form[k] = "clean"; _lp_line[k] = _lp_body[i]; break }
                    if (_lp_form[k] != "") continue
                    for (i = 1; i <= NR; i++) {
                      t = _lp_strip(_lp_body[i])
                      if (index(t, _lp_f[k] "：") == 1) { _lp_form[k] = "prefixed"; _lp_line[k] = _lp_body[i]; break }
                    }
                    if (_lp_form[k] != "") continue
                    for (i = 1; i <= NR; i++)
                      if (index(_lp_body[i], _lp_f[k] "：") > 0) { _lp_form[k] = "inline"; _lp_line[k] = _lp_body[i]; break }
                  }
                  for (k = 1; k <= _lp_n; k++) {
                    if (_lp_form[k] != "clean") continue
                    rest = _lp_line[k]; sub(/^[^：]*：/, "", rest); gsub(/\r/, "", rest)
                    for (j = 1; j <= _lp_n; j++)
                      if (j != k && index(rest, _lp_f[j] "：") > 0) { _lp_form[k] = "inline"; break }
                  }
                  warn = ""; ok = "yes"; vlg = ""; vpre = ""
                  for (k = 1; k <= _lp_n; k++) {
                    if (_lp_form[k] == "") { ok = "no"; warn = warn "缺「" _lp_f[k] "」行;"; continue }
                    v = _lp_val(_lp_line[k], _lp_f[k])
                    if (_lp_form[k] != "clean") { ok = "no"; warn = warn _lp_f[k] " 行非行首形态（" _lp_form[k] "）;" }
                    if (k == 1) vlg = v
                    if (k == 2) vpre = v
                  }
                  pre = ""
                  #   ★ P1-2 修复（F-308 同族 · 判据「方向反转」根治）：**文本语义优先**。
                  #     旧实现「先抽号、抽到即定，抽不到才认『无』」在模板**明文允许**的
                  #     「前置：无（原前置 PR#395 已 merged）」形态上**语义反转**——把括注里的
                  #     历史引证号当成前置号（真实 open 台账 #397/#293 即此形态）⇒ 第⑧维误派；
                  #     对「暂缓（… PR#273 …）」等**明写不得开工**的陈述句亦反向给出可解除号。
                  #     故按**文本语义优先**分三支：① 值以 `无` 起（可带括注）⇒ 判 `无`，**不抽号**；
                  #     ② 值以**号引形态**起（`PR#N` / `#N` / `N`·可多号 + 分隔）⇒ 才抽号（复合多前置仍全取）；
                  #     ③ 其余陈述句（`暂缓`/`等上游`…）⇒ `?` + 告警（**禁抽号**，防再被误派）。
                  #     判据置前、不再让「抽号」越权覆盖文本语义（§11.2 方向完备性审计同向）。
                  if (vpre ~ /^[ \t]*无([（(]|[ \t]|$)/) {
                    pre = "无"
                  } else if (vpre == "") {
                    pre = "?"; ok = "no"; warn = warn "前置值为空;"
                  } else if (vpre ~ /^[ \t]*(PR[ \t]*)?#?[0-9]+([ \t]|[，,、+]|$)/) {
                    pre = _lp_nums(vpre)
                    if (pre == "") {
                      pre = "?"; ok = "no"; warn = warn "前置值无可辨识单号（原文=[" vpre "]）·禁静默按「无前置」;"
                    }
                  } else {
                    pre = "?"; ok = "no"; warn = warn "前置值非「无」亦非号引形态（原文=[" vpre "]）·禁静默抽号·禁静默按「无前置」;"
                  }
                  if (vlg == "") { ok = "no"; warn = warn "承接值为空;" }
                  if (warn == "") warn = "none"
                  printf "承接=%s\n前置=%s\n合规=%s\n告警=%s\n", (vlg == "" ? "-" : vlg), pre, ok, warn
                }
                #LEDGER_PARSE_AWK>>
                ```

              9. 扫「**预算维**」（**第⑨维 · token/评论预算失控维** · #TASK-ORCH-BUDGET-20260911-01 AC-4）：
                 逐条核**近 24h** 已完成构建的 AI 用量（`cnb build get-build-ai-audit --repo ${CNB_REPO_SLUG} --sn <sn> --pipelineId <sn>-001`），命中任一条即判「预算失控」：
