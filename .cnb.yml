                 不再经中书令逐次裁决（本维落地 = 自举缺口闭合，此后同类由机制直接派单）。
                 **护栏（交集判据面 · #TASK-ORCH-SERIALOCK-20260915-01 AC-1）**：派单前按 §7 核该台账白名单与在途
                 **open PR + 在途 api_trigger 派单**交集——**有交集即不派**（重叠串行锁，等其合并后再派），只登记不派；
