翰林学士:
  issue.comment@npc: *hy_pipelines
  pull_request.comment@npc: *hy_pipelines
  #   ★ P2-1 收口（R5）：原 `api_trigger: *hy_pipelines` 键**已删**——角色段 `api_trigger:` 结构性不被
  #     平台匹配（NPC 事件仅由评论触发；详见上方「通道面」段 + 探针 sn `cnb-teq-1k43gcb0f`），
  #     保留可执行键形态会与「非生效通道」口径两处并存、易误读为已同源。经 api_trigger 拉起翰林学士
  #     仍走顶层 `$: api_trigger` 兜底段（免费档 + 常规档）；三档路由请用评论 @ 通道。

