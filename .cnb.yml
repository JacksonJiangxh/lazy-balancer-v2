        timeout: 21600
        expires: 72000
      # 2核4G：runner.cpus=2 → 内存=2×2GiB=4G（平台规则：内存=CPU核数×2GiB，docs grammar.md#pipeline-cpus）
      # 巡检心跳为轻量巡检任务（既有七维+第⑧维+**第⑨维（预算维）**+**第⑩维（构建量维）**＝**十一维**（含第⑪维「跨根断链检测」），见下 userPrompt 只扫可自动推进项、重活 api_trigger 派单下游），无需 8核16G 默认规格
