        # timeout（AC-5 补 · 根因修复闭环 · 日/夜两处逐字一致）：平台默认 3600s ⇒ 持锁轮超 3600s 时**排队轮失败退出**
        #   （`timeout while waiting for lock`，平台实测 sn `cnb-h0l-1k26i49rg` 显式 timeout:20 在 20.019s 失败），
        #   而本仓心跳单轮实测**最长可达数小时**（sn `cnb-mug-1k27r3tuj`；**具体秒数以构建记录为唯一源，此处不手写现值**）⇒ 仅去 ciw 只解「被取消」路径、
        #   解不了「等锁超时」路径（AC-5 根因残留路径）。**本值取值以本段 `lock` 活配置为唯一源**——须 ≥ 实测最长单轮，
        #   并留足余量（实测最长单轮的倍数量级）以覆盖多轮排队叠加，使长轮持锁时后到轮能等到锁而非失败退出。
