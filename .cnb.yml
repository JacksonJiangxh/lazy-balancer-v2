# Lazy Balancer V2 · CNB 流水线
#
# 两类事件：
#   1) vscode：仓库页面「云原生开发」按钮 → 远程开发环境（Go 1.26 + Node 22 + sqlite）
#   2) web_trigger_docker_build：页面自定义按钮（见 .cnb/web_trigger.yml）→
#      amd64/arm64 原生并行构建镜像 → 探活 → 推送 → 合成多架构 manifest
#      → 再把 latest 多架构镜像额外镜像一份到 xzydm/mirrors 仓库
#
# 适配约定：仓库名、镜像源一律走内置变量（${CNB_REPO_SLUG_LOWERCASE} /
# ${CNB_REPO_NAME_LOWERCASE} / ${CNB_DOCKER_REGISTRY}），**零硬编码仓库名**，
# 本文件可直接复制到任意 CNB 仓库使用。唯一例外是 mirror 目标仓库
# （manifest 作业的 MIRROR_REPO_SLUG），它必须显式指向一个外部仓库；
# 置空即关闭镜像，复制本文件到其它仓库时按需修改或留空。
#
# 两者都必须写在 `$`（兜底分支）下：vscode 属仓库级事件（与分支无关），
# web_trigger 也建议放兜底分支以免漏配分支。


# main 分支：
#   crontab 定时任务 —— 上游版本巡检（发现了就开 Issue 叫人）。
#   之所以单独放在具体分支名（main）下：CNB 的 crontab 事件不支持 `$` 兜底分支
#   或 glob 分支，必须挂在确切的分支 key 上。
main:
  # ──────────────────────────────────────────────────────────────
  # 上游版本巡检：定时任务（每 6 小时）检查原作者仓库有没有新「版本级」tag。
  #
  # 与 GitHub Actions 的分工：GH Action 负责「真的把上游 tag 同步到 fork 的
  # master」；这里负责「发现了就开 Issue 叫人」，两件事互不依赖——
  # 哪怕 GH Action 因 token 过期没跑成，这里的 Issue 也会照开，不会静默错过版本。
  #
  # 必须写在具体分支名（main）下：crontab 事件不支持 $ 兜底分支或 glob 分支。
  # 事件名用 "crontab: <cron>" 形式，系统时区 Asia/Shanghai。
  #
  # 幂等：开 Issue 前先查本仓是否已有同名未关闭的巡检 Issue，有就只更新/跳过，
  # 不会每 6 小时刷一条新 Issue。状态记号写在 Issue 的 HTML 注释里（人类不可见），
  # 形如 <!--upstream-sync-state: v2.3.5-->。
  #
  # 依赖：jq（查 GitHub API / 解析 CNB Issue 列表）。CNB 默认环境已自带，
  # 这里仍显式检查一遍，缺失就报错而不是产出错数据。
  # ──────────────────────────────────────────────────────────────
  # ──────────────────────────────────────────────────────────────
  # 上游版本巡检：定时任务（每 6 小时）检查原作者仓库有没有新「版本级」tag。
  #
  # 与 GitHub Actions 的分工：GH Action 负责「真的把上游 tag 同步到 fork 的
  # master」；这里负责「发现了就开 Issue 叫人」，两件事互不依赖——
  # 哪怕 GH Action 因 token 过期没跑成，这里的 Issue 也会照开，不会静默错过版本。
  #
  # 必须写在具体分支名（main）下：crontab 事件不支持 $ 兜底分支或 glob 分支。
  # 事件名用 "crontab: <cron>" 形式，系统时区 Asia/Shanghai。
  #
  # 幂等：开 Issue 前先查本仓是否已有同名未关闭的巡检 Issue，有就补一条评论，
  # 不会每 6 小时刷一条新 Issue。版本记号写在 Issue 正文的 HTML 注释里
  # （人类不可见），形如 <!--upstream-sync-state: v2.3.5-->。
  #
  # 依赖 curl + jq；二者在下面显式检查，缺失就报错而不是产出错数据。
  # ──────────────────────────────────────────────────────────────
  "crontab: 30 */6 * * *":
    - name: upstream-release-watch
      # 纯 curl + jq 的轻量作业，1 核足够
      runner:
        cpus: 1
      docker:
        image: docker.cnb.cool/xzydm/mirrors/debian:13-all
      env:
        # 上游（原作者）仓库，owner/repo 形式
        UPSTREAM_REPO: v55448330/lazy-balancer-v2
        # 我们已合并到的上游版本（人工确认基线）。上游最新 tag 比它新 -> 开 Issue。
        # 每次真正合并完一个上游版本后，把这里改成新版本号再关 Issue——
        # 这是唯一的人工确认点：不改它，巡检就会一直提醒同一个版本。
        BASELINE_TAG: v2.3.6-beta
      stages:
        - name: check upstream release
          script: |
            set -euo pipefail

            for c in curl jq; do
              command -v "$c" >/dev/null 2>&1 || { echo "缺少依赖：$c"; exit 1; }
            done

            echo ">>> 上游仓库：${UPSTREAM_REPO}"
            echo ">>> 已合并基线：${BASELINE_TAG}"

            # tags API 单页 100 条足够覆盖（上游历史版本远少于 100）。
            # 只认 v<major>.<minor>.<patch> 形态的「版本级」tag，
            # 排除 nightly / beta / rc 之类滚动 tag（它们不是发布）。
            TAGS_JSON=$(curl -fsSL --max-time 30 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: cnb-upstream-watch" \
              "https://api.github.com/repos/${UPSTREAM_REPO}/tags?per_page=100")

            LATEST=$(printf '%s' "$TAGS_JSON" \
              | jq -r '.[].name' \
              | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -Vr \
              | head -1)

            if [ -z "${LATEST}" ]; then
              echo ">>> 上游没有版本级 tag，结束"
              exit 0
            fi
            echo ">>> 上游最新版本：${LATEST}"

            # 语义版本比较：LATEST 是否比 BASELINE 新
            newer=$(printf '%s\n%s\n' "$BASELINE_TAG" "$LATEST" | sort -V | tail -1)
            if [ "$newer" = "$LATEST" ] && [ "$LATEST" != "$BASELINE_TAG" ]; then
              echo ">>> 发现新版本 ${LATEST}（基线 ${BASELINE_TAG}）"
            else
              echo ">>> 无新版本（${LATEST} <= ${BASELINE_TAG}），结束"
              exit 0
            fi

            # 取该 tag 的提交与发布时间，写进 Issue 便于定位。
            # 这两处只看成败、不阻断：取不到就写 unknown，Issue 照开。
            TAG_META=$(curl -fsSL --max-time 30 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: cnb-upstream-watch" \
              "https://api.github.com/repos/${UPSTREAM_REPO}/git/ref/tags/${LATEST}" || echo '{}')
            TAG_SHA=$(printf '%s' "$TAG_META" | jq -r '.object.sha // "unknown"' | cut -c1-10)
            RELEASED_AT=$(curl -fsSL --max-time 30 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: cnb-upstream-watch" \
              "https://api.github.com/repos/${UPSTREAM_REPO}/releases/tags/${LATEST}" \
              | jq -r '.published_at // "unknown"' || echo "unknown")

            # 幂等守卫：查本仓是否已有「未关闭」的同名巡检 Issue。
            # cnb CLI 要加 --verbose 才输出可解析 JSON（形如 {"data":[...]}）；
            # 分页默认 10 条，open 状态的巡检 Issue 不会多到需要翻页。
            ISSUE_TITLE="[上游巡检] ${UPSTREAM_REPO} 发布新版本 ${LATEST}"
            EXISTING=$(cnb issues list-issues --repo "${CNB_REPO_SLUG}" --state open --verbose 2>/dev/null               | jq -r --arg t "$ISSUE_TITLE" '.data[]? | select(.title == $t) | .number' 2>/dev/null | head -1 || true)

            # Issue 正文用 printf 逐行拼，不用 heredoc：heredoc 的内容行若跟着
            # script 块的缩进，正文每行都会带前导空格、markdown 表格直接散架；
            # 而 <<- 只去 TAB 不去空格，在这个全空格的 YAML 块里用不上。
            BODY_FILE=$(mktemp)
            {
              printf '%s\n' "<!--upstream-sync-state: ${LATEST}-->"
              printf '%s\n' ""
              printf '%s\n' "## 上游有新版本发布"
              printf '%s\n' ""
              printf '%s\n' "| 项 | 值 |"
              printf '%s\n' "|---|---|"
              printf '%s\n' "| 上游仓库 | \`${UPSTREAM_REPO}\` |"
              printf '%s\n' "| 新版本 tag | **${LATEST}** |"
              printf '%s\n' "| tag 提交 | \`${TAG_SHA}\` |"
              printf '%s\n' "| 发布时间 | ${RELEASED_AT} |"
              printf '%s\n' "| 本仓已合并基线 | \`${BASELINE_TAG}\` |"
              printf '%s\n' ""
              printf '%s\n' "### 接下来要做的事"
              printf '%s\n' ""
              printf '%s\n' "1. 确认 GitHub Actions 的 \`Sync upstream release to master\` 已把 \`${LATEST}\` 同步到 fork 的 **master**（镜像轨）；没成功就手动 \`workflow_dispatch\` 补跑一次。"
              printf '%s\n' "2. 拿到一份基于 fork 的 master 与本仓 main 的代码合并清单，逐项拍板。"
              printf '%s\n' "3. 拍板后再动代码；改完把本仓 \`.cnb.yml\` 里 \`upstream-release-watch\` 的 \`BASELINE_TAG\` 提到 \`${LATEST}\`，再关闭本 Issue。"
              printf '%s\n' ""
              printf '%s\n' "> 本 Issue 由 CNB 定时任务自动创建（每 6 小时巡检一次）。同一版本只会开一条。"
            } > "$BODY_FILE"

            if [ -n "${EXISTING}" ]; then
              echo ">>> 已有未关闭的巡检 Issue #${EXISTING}，补一条评论而不是新开"
              cnb issues comment --repo "${CNB_REPO_SLUG}" --number "${EXISTING}"                 --body "又巡检到上游版本 **${LATEST}** 仍未合并（基线 ${BASELINE_TAG}，tag 提交 \`${TAG_SHA}\`）。详见上方清单。"
            else
              echo ">>> 新建巡检 Issue：${ISSUE_TITLE}"
              cnb issues create-issue --repo "${CNB_REPO_SLUG}"                 --title "${ISSUE_TITLE}"                 --body-file "$BODY_FILE"                 --priority P2
            fi
            rm -f "$BODY_FILE"

$:
  # ──────────────────────────────────────────────────────────────
  # 云原生开发环境：专供页面中点击「云原生开发」启动远程开发用
  # ──────────────────────────────────────────────────────────────
  vscode:
    - name: dev-env
      docker:
        image: docker.cnb.cool/xzydm/mirrors/debian:13-all
      runner:
        cpus: 8
        tags: cnb:arch:amd64
      services:
        - docker
        - name: vscode
          options:
            # false（默认）：走标准 WebIDE / VSCode 客户端，而不是只打开预览页
            onlyPreview: false
            # 参考仓写的是 `launch: python keepalive.py`（依赖仓内一个 py 脚本）。
            # 本仓库是 Go 项目，没有也不打算为开发环境往仓库塞脚本，故用等价的
            # inline 长驻命令：配合 daemon: true 由平台后台 detach 执行，
            # docker exec 立即返回，不会卡在「等待 launch 退出」上（非守护模式下
            # launch 超过 5 分钟不退出会判失败）。
            launch: sh -c "while true; do sleep 3600; done"
            # 离线保活 16h（默认仅 10 分钟无心跳就回收环境）
            keepAliveTimeout: 16h
            daemon: true
      stages:
        # 开发环境每次启动都会重跑 stages，故安装必须幂等（command -v 命中即跳过），
        # 否则每次进环境都要白白重装几百 MB 工具链。
        - name: install toolchain
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive

            # 基础命令缺失才 apt-get（apt install 属平台侧的 slow-path，能省则省）
            MISSING=""
            for c in curl ca-certificates-x509-tool sqlite3 git jq xz-utils; do
              case "$c" in
                ca-certificates-x509-tool) command -v update-ca-certificates >/dev/null 2>&1 || MISSING="$MISSING ca-certificates";;
                xz-utils) command -v xz >/dev/null 2>&1 || MISSING="$MISSING xz-utils";;
                *) command -v "$c" >/dev/null 2>&1 || MISSING="$MISSING $c";;
              esac
            done
            if [ -n "$MISSING" ]; then
              echo ">>> installing system packages:$MISSING"
              apt-get update -y
              apt-get install -y --no-install-recommends $MISSING
            fi

            # ── Go 1.26.6（与 Dockerfile 的 golang:1.26.6-alpine 对齐）──
            # 主源阿里云（实测 200），回退 google.cn，最后兜底官方 dl
            if ! command -v go >/dev/null 2>&1; then
              echo ">>> installing go1.26.6"
              for base in https://mirrors.aliyun.com/golang https://golang.google.cn/dl https://go.dev/dl; do
                if curl -fsSL --max-time 300 -o /tmp/go.tgz "$base/go1.26.6.linux-amd64.tar.gz"; then
                  tar -C /usr/local -xzf /tmp/go.tgz
                  rm -f /tmp/go.tgz
                  break
                fi
                echo ">>> go 下载失败，换下一个源：$base"
              done
            fi
            command -v go >/dev/null 2>&1 || { echo ">>> go 安装失败：所有下载源均不可达"; exit 1; }

            # ── Node 22（前端 web/ 需要 vite 8 + vue-tsc，Node 20 不够）──
            # 主源阿里云 nodejs-release（实测 200），回退 npmmirror 二进制站，最后兜底官方
            if ! command -v node >/dev/null 2>&1; then
              echo ">>> installing node 22.23.3"
              NODE_PKG=node-v22.23.3-linux-x64.tar.xz
              for base in https://mirrors.aliyun.com/nodejs-release/v22.23.3 \
                          https://registry.npmmirror.com/-/binary/node/v22.23.3 \
                          https://nodejs.org/dist/v22.23.3; do
                if curl -fsSL --max-time 300 -o /tmp/node.tar.xz "$base/$NODE_PKG"; then
                  mkdir -p /usr/local/nodejs
                  tar -C /usr/local/nodejs --strip-components=1 -xJf /tmp/node.tar.xz
                  rm -f /tmp/node.tar.xz
                  break
                fi
                echo ">>> node 下载失败，换下一个源：$base"
              done
            fi

            # PATH：同时写入 /etc/profile.d（登录 shell）与 ~/.bashrc（部分 IDE
            # 终端只加载交互式配置），避免 WebIDE 终端出现 command not found
            cat > /etc/profile.d/lazy-balancer-dev.sh <<'EOF'
            export PATH=$PATH:/usr/local/go/bin:/usr/local/nodejs/bin
            export GOPROXY=https://mirrors.aliyun.com/goproxy/,https://goproxy.cn,direct
            export GOPATH=$HOME/go
            EOF
            chmod +x /etc/profile.d/lazy-balancer-dev.sh
            grep -q 'lazy-balancer-dev.sh' /etc/bash.bashrc 2>/dev/null || \
              echo '[ -f /etc/profile.d/lazy-balancer-dev.sh ] && . /etc/profile.d/lazy-balancer-dev.sh' >> /etc/bash.bashrc
            grep -q 'lazy-balancer-dev.sh' "$HOME/.bashrc" 2>/dev/null || \
              echo '[ -f /etc/profile.d/lazy-balancer-dev.sh ] && . /etc/profile.d/lazy-balancer-dev.sh' >> "$HOME/.bashrc"

            export PATH=$PATH:/usr/local/go/bin:/usr/local/nodejs/bin
            echo "=== toolchain ==="
            go version
            node -v
            npm -v
            sqlite3 --version

  # ──────────────────────────────────────────────────────────────
  # 镜像构建：页面自定义按钮触发（见 .cnb/web_trigger.yml）
  #
  # 结构沿用成熟的三 pipeline 形态：amd64 / arm64 两个原生架构作业并行编译，
  # 第三个作业 await 两者完成后合成多架构 manifest。
  # 之所以不用 buildx 一把梭多架构：本仓库最重的一步是 xcaddy build
  #（编译 Caddy + coraza 等 6 个插件），QEMU 模拟下的耗时不可接受，
  # 原生双 runner 反而更快。
  # ──────────────────────────────────────────────────────────────
  web_trigger_docker_build:
    - name: build-amd64
      runner:
        cpus: 8
        tags: cnb:arch:amd64
      services:
        - docker
      env:
        IMAGE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest-linux-amd64
        # 专用层缓存 tag：不与任何对外 tag 复用，避免下面 remove-tag 把下次
        # 构建的缓存源一起删掉；终端更新 APP_VERSION 的代价是几百 MB 存储。
        CACHE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:cache-linux-amd64
      stages:
        - name: docker login
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: docker build
          # xcaddy 冷缓存全量重编历史上可达 40 分钟级；默认的 2h 上限 /
          # 10min 无输出超时（哪怕只是 go build 长时间不打日志）都太紧，显式放宽。
          timeout: 4h
          script: |
            set -e
            # 版本号：优先取按钮传入的 VERSION，缺省时回退 Dockerfile 的 ARG 默认值。
            # 注意 Dockerfile 里还有一行 ARG CRS_VERSION=...，故必须锚定行首
            # ^ARG VERSION=，否则 head -1 可能抓错。
            VERSION="${VERSION:-$(sed -n 's/^ARG VERSION=//p' Dockerfile | head -1)}"
            echo "APP_VERSION=${VERSION}"
            # 首次构建必然没有缓存镜像，拉失败不能中断流水线
            docker pull ${CACHE_TAG} || true
            # BUILDKIT_INLINE_CACHE=1 让产物带上层缓存元数据，下次以它为 --cache-from
            # 即可吃到增量（比 --cache-to type=registry,mode=max 对默认 driver 更稳）
            docker build \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              --build-arg VERSION=${VERSION} \
              --cache-from ${CACHE_TAG} \
              -t ${IMAGE_TAG} .
        # 「构建成功 ≠ 镜像能跑」——真的把容器跑起来才算过。
        # 探针形态与 docker-compose.yml 的 healthcheck 保持一致的双探针：管理面板
        # 可能为自签 HTTPS（此时明文 HTTP 返回 301），也可能只有明文可用；
        # 且镜像内**没有 curl**（构建期临时装的 curl 事后 apk del 了），
        # 只能用 busybox wget，自签证书靠 --no-check-certificate 放行。
        # 探针走 docker exec 在容器内打 127.0.0.1:8000，不依赖宿主机端口映射。
        - name: docker smoke test
          timeout: 10m
          script: |
            set -e
            cid=$(docker run -d ${IMAGE_TAG})
            trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
            ok=0
            # 首次启动要 --init 建库 + 生成 Caddyfile + 拉起 Caddy 监督器，放宽到 ~2min
            for i in $(seq 1 60); do
              if [ "$(docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null || echo false)" != "true" ]; then
                echo ">>> 容器已退出，提前结束探活"
                break
              fi
              if docker exec "$cid" sh -c 'wget -q -O /dev/null -T 3 --no-check-certificate https://127.0.0.1:8000/health || wget -q -O /dev/null -T 3 http://127.0.0.1:8000/health'; then
                ok=1
                break
              fi
              sleep 2
            done
            echo "--- container logs (tail 40) ---"
            docker logs "$cid" 2>&1 | tail -40
            if [ "$ok" != "1" ]; then
              echo ">>> 镜像探活失败：容器未在 8000 提供 /health（构建绿 ≠ 镜像能跑）"
              exit 1
            fi
            echo ">>> 镜像探活通过"
        - name: docker push
          script: |
            set -e
            docker push ${IMAGE_TAG}
            # 同一份镜像换个 tag 推就是下次的缓存源（层在制品库只存一份）
            docker tag ${IMAGE_TAG} ${CACHE_TAG}
            docker push ${CACHE_TAG}
        - name: resolve
          type: cnb:resolve
          options:
            key: build-amd64

    - name: build-arm64
      runner:
        cpus: 8
        tags: cnb:arch:arm64:v8
      services:
        - docker
      env:
        IMAGE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest-linux-arm64
        CACHE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:cache-linux-arm64
      stages:
        - name: docker login
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: docker build
          timeout: 4h
          script: |
            set -e
            VERSION="${VERSION:-$(sed -n 's/^ARG VERSION=//p' Dockerfile | head -1)}"
            echo "APP_VERSION=${VERSION}"
            docker pull ${CACHE_TAG} || true
            docker build \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              --build-arg VERSION=${VERSION} \
              --cache-from ${CACHE_TAG} \
              -t ${IMAGE_TAG} .
        # arm64 作业不做真容器探活：一是此处是 arm64 原生 runner，镜像与运行架构
        # 天然一致，跑不起来的概率远低于交叉构建；二是每次探活要给缓慢的 arm64
        # 容器额外留 2 分钟启动窗口。冒烟已在 amd64 侧覆盖「构建绿 ≠ 镜像能跑」。
        # 若将来需要（例如怀疑某个插件在 arm64 上启动崩），把 amd64 作业那一段
        # smoke test 原样复制到这里即可。
        - name: docker push
          script: |
            set -e
            docker push ${IMAGE_TAG}
            docker tag ${IMAGE_TAG} ${CACHE_TAG}
            docker push ${CACHE_TAG}
        - name: resolve
          type: cnb:resolve
          options:
            key: build-arm64

    - name: manifest
      services:
        - docker
      env:
        IMAGE_BASE: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
        # 额外镜像（mirror）目标仓库。这是本文件唯一一处硬编码仓库名——因为
        # 「把镜像再推一份到另一个仓库」本质上就指向一个外部仓库，无法由
        # ${CNB_REPO_SLUG_LOWERCASE} 推导。与源同属 docker.cnb.cool 同一 registry，
        # 只是换到 mirrors 仓库的命名空间下（非同名制品，路径 = 仓库路径/制品名），
        # 故无需第二套凭据，仍用当前构建的 cnb:${CNB_TOKEN}；前提是触发者
        # 对该仓库有写权限。改成空串即可关闭镜像。
        MIRROR_REPO_SLUG: xzydm/mirrors
        # 空串表示不镜像；非空时镜像到该仓库下的同名制品
        MIRROR_BASE: ${CNB_DOCKER_REGISTRY}/${MIRROR_REPO_SLUG}/${CNB_REPO_NAME_LOWERCASE}
      stages:
        - name: await the amd64
          type: cnb:await
          options:
            key: build-amd64
        - name: await the arm64
          type: cnb:await
          options:
            key: build-arm64
        - name: docker login
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: manifest latest
          image: cnbcool/manifest
          settings:
            # 插件对 CNB 制品库有内置默认账号，但仅当 CNB_TOKEN_USER_NAME / CNB_TOKEN
            # 在插件容器内可见时才生效；显式传入更稳，且二者都取自构建环境变量
            #（日志打码），不会落成明文配置。
            username: ${CNB_TOKEN_USER_NAME}
            password: ${CNB_TOKEN}
            target: ${IMAGE_BASE}:latest
            # 源镜像模板必须写成 latest-OS-ARCH，不能写 latest-linux-OS-ARCH：
            # 插件的 ARCH/OS/VARIANT 是裸子串替换（不是占位符解析），tag 里已有
            # linux 再叠 OS 会得到 latest-linux-linux-amd64，制品库里没有该 tag，
            # manifest 直接 404。
            template: ${IMAGE_BASE}:latest-OS-ARCH
            platforms:
              - linux/amd64
              - linux/arm64
        # 版本号 tag：与 latest 指向完全相同的两个 per-arch 镜像，只是换了一个
        # manifest target（方便用户固定到某个发行版，不被后续 latest 带跑）。
        # VERSION 由页面按钮的入参注入（见 .cnb/web_trigger.yml，带默认值，必填），
        # 为空通常说明不是从该按钮触发（例如 API 触发），此时跳过而不是产出
        # 「{仓库}:」这种残缺 target。
        - name: manifest version
          if: '[ -n "${VERSION}" ]'
          image: cnbcool/manifest
          settings:
            username: ${CNB_TOKEN_USER_NAME}
            password: ${CNB_TOKEN}
            target: ${IMAGE_BASE}:${VERSION}
            template: ${IMAGE_BASE}:latest-OS-ARCH
            platforms:
              - linux/amd64
              - linux/arm64
        # 把刚合成的 latest 多架构镜像额外复制一份到 `xzydm/mirrors` 仓库。
        # 用 buildx imagetools create 做 registry→registry 复制：它按 manifest list
        # 逐个子 manifest/layer 搬运，不落地本地 daemon，比 pull + retag + push
        # （本机再拉一次 ~几百 MB 层）更快，也天然保留多架构索引。
        # 只镜像 latest（版本号 tag 保持仅在源仓库存在，避免镜像仓里堆一摞历史版本）。
        - name: mirror latest to mirrors repo
          timeout: 30m
          script: |
            set -e
            # MIRROR_REPO_SLUG 置空即关闭镜像，方便本文件被别的仓库直接复用
            if [ -z "${MIRROR_REPO_SLUG}" ]; then
              echo ">>> MIRROR_REPO_SLUG 为空，跳过 mirror"
              exit 0
            fi
            echo ">>> mirror ${IMAGE_BASE}:latest -> ${MIRROR_BASE}:latest"
            docker buildx imagetools create \
              -t ${MIRROR_BASE}:latest \
              ${IMAGE_BASE}:latest
            echo ">>> mirror 完成"
            docker buildx imagetools inspect ${MIRROR_BASE}:latest
        - name: remove tag
          type: artifact:remove-tag
          options:
            # 包名用仓库同名制品名，不能用完整镜像地址
            name: ${CNB_REPO_NAME_LOWERCASE}
            tags:
              # 只删两个架构作业实际推送的临时 tag；cache-linux-* 要留着给下次构建
              - latest-linux-amd64
              - latest-linux-arm64
            type: docker

  # ──────────────────────────────────────────────────────────────
  # 把本仓 main 同步到 GitHub fork 的 master-dev：页面自定义按钮触发
  #（见 .cnb/web_trigger.yml 的「推送 main 到 GitHub master-dev」）。
  #
  # 方向说明：本仓库是 GitHub 上游 v55448330/lazy-balancer-v2 的 fork 的
  # CNB 镜像。GitHub Actions 负责「上游 release → fork 的 master（上游镜像轨）」；
  # 这里补上反向的一环：「本仓 main（我们的开发主线）→ fork 的 master-dev」，
  # 让 GitHub 侧的开发主线也拿到我们最新的改动，两边互为备份。
  #
  # 凭据：GitHub PAT 存在 CNB 密钥仓库（xzydm/xzsecret 的 github.yml）里，
  # 通过 imports 注入，流水线内不出现任何明文。
  #
  # ── 关于密钥变量怎么用（含本流水线此前「token 为空」的真相）──
  #
  # 密钥仓库文件里的键名就是环境变量名，imports 会逐 key 原样注入，
  # 脚本里**直接用同名变量**即可，不要中转改名。中转会让"被审计的那个名字"
  # 与"实际参与拼接的字符串"分离：真正的 token 一旦落进你自己名字的变量里，
  # 它就不再是审计对象，而审计日志只记录"谁引用过这个文件"，不会区分中转。
  #
  # 本流水线此前 token 为空，根因是键名 `163_GIT_ALL_TOKEN` 以数字开头。
  # 官方文档对变量名有硬约束（云原生构建/环境变量/限制说明）：
  #   变量名格式：仅支持字母、数字和下划线，**不能以数字开头**
  # 且提示「不符合规则的变量会被忽略」。实测（debian 13，/bin/sh -> dash）：
  #
  #   env -i 163_GIT_ALL_TOKEN=SECRET123 dash -c 'printenv 163_GIT_ALL_TOKEN'
  #     -> 无输出（变量不存在）
  #   env -i 163_GIT_ALL_TOKEN=SECRET123 bash -c 'printenv 163_GIT_ALL_TOKEN'
  #     -> SECRET123
  #   env -i 163_GIT_ALL_TOKEN=SECRET123 dash -c 'python3 ...os.environ...'
  #     -> None            # 非法名被 shell 在启动时剔掉，子进程也拿不到
  #   env -i 163_GIT_ALL_TOKEN=SECRET123 python3 ...os.environ...
  #     -> SECRET123       # 不经 shell 就能拿到
  #
  # 也就是说：token 确实被 imports 注入到了进程环境，是**默认 shell（dash）
  # 在启动时把这条非法名目删掉了**，连 /proc/self/environ 里的对应槽位都没了。
  # 这跟密钥仓库的 allow_* 授权无关（授权不通过是整文件加载失败，不是空值）。
  #
  # 所以修法只有一条：**把密钥文件里的键名改成合法标识符，然后直接用**。
  # 163 是多账号场景的账号标识，必须留——只是不能放开头，挪到中间/结尾即可：
  #   # xzydm/xzsecret 的 github.yml
  #   GIT_163_ALL_TOKEN: "ghp_163..."   # ✅ 推荐：账号号夹在中间
  #   GIT_ALL_TOKEN_163: "ghp_163..."   # ✅ 等价：账号号放结尾
  #   GIT_ABC_ALL_TOKEN: "ghp_abc..."   # ✅ 多账号并列，各用各的、不串号
  #   163_GIT_ALL_TOKEN: "ghp_163..."   # ❌ 数字开头：sh 里永远读不到
  # 本流水线按 GIT_163_ALL_TOKEN 直接引用；换账号只改这一处键名 + GITHUB_REPO。
  #
  # 密钥文件需要在密钥仓库侧声明 allow_* 规则，否则只有密钥仓管理员触发的
  # 流水线才有权引用（allow_* 一旦声明，触发者角色不再参与判定）：
  #   allow_slugs: "xzydm/lazy-balancer-v2"
  #   allow_events: "web_trigger_push_github"
  #   allow_branches: "main"
  # ──────────────────────────────────────────────────────────────
  web_trigger_push_github:
    - name: push-main-to-github
      runner:
        # 纯 git 操作，1 核足够
        cpus: 1
      docker:
        image: docker.cnb.cool/xzydm/mirrors/debian:13-all
      imports:
        # 密钥仓库中的 GitHub 凭据文件；键名 GIT_163_ALL_TOKEN 被原样注入，
        # 脚本直接用同名变量读取（不做任何中转改名，保持审计链路干净）。
        - https://cnb.cool/xzydm/xzsecret/-/blob/main/github.yml
      env:
        # GitHub 目标仓库，owner/repo 形式。
        # 默认指向本仓库在 GitHub 侧的 fork；若 fork 在别的账号名下，改这一行即可。
        GITHUB_REPO: xzydm/lazy-balancer-v2
        # 源分支（本仓 main）与默认目标分支（可被按钮输入覆盖）
        SOURCE_BRANCH: main
        DEFAULT_TARGET_BRANCH: master-dev
        # 目标分支白名单：只允许推到这些分支，防止手滑把 main 推到 master/production。
        ALLOWED_TARGET_BRANCHES: master-dev
      stages:
        - name: push to github
          timeout: 20m
          script: |
            set -eu

            command -v git >/dev/null 2>&1 || { echo ">>> 缺少依赖：git"; exit 1; }

            # imports 逐 key 原样注入，变量名 = 密钥文件里的键名，直接用。
            # 这里不做任何中转改名：中转会让审计对象与实际参与拼接的字符串分离。
            # GIT_163_ALL_TOKEN 就是密钥文件里的键名（163 = 账号标识），
            # 换账号时只改这里和 GITHUB_REPO。
            TOKEN="${GIT_163_ALL_TOKEN:-}"
            if [ -z "$TOKEN" ]; then
              echo ">>> 未拿到 GitHub 令牌。请检查密钥仓库 xzydm/xzsecret 的 github.yml："
              echo "    - 键名需为 GIT_163_ALL_TOKEN（163 是账号标识，可换；但不得以数字开头："
              echo "      写 163_GIT_ALL_TOKEN 会被 shell 启动时剔除，永远读不到）"
              echo "    - 若已声明 allow_* 规则，需 allow_slugs 含 xzydm/lazy-balancer-v2、"
              echo "      allow_events 含 web_trigger_push_github、allow_branches 含 main"
              exit 1
            fi

            TARGET="${TARGET_BRANCH:-${DEFAULT_TARGET_BRANCH}}"

            # 白名单守卫：逗号或竖线分隔（用 tr 归一，不依赖 bash 的 ${var//}
            # 替换语法，保证在 dash/sh 下也能跑）
            ALLOWED_NORM="$(printf '%s' "${ALLOWED_TARGET_BRANCHES}" | tr '|' ',')"
            case ",${ALLOWED_NORM}," in
              *",${TARGET},"*) ;;
              *) echo ">>> 目标分支 ${TARGET} 不在白名单内（允许：${ALLOWED_TARGET_BRANCHES}）"; exit 1 ;;
            esac

            # FORCE 来自按钮输入（字符串 "true"/"false"）
            PUSH_ARGS=""
            if [ "${FORCE:-false}" = "true" ]; then
              echo ">>> 警告：FORCE=true，将覆盖 GitHub 侧 ${TARGET} 的历史"
              PUSH_ARGS="--force"
            fi

            # 带认证的 HTTPS 地址；token 不回显（git 自身不会打印凭据）
            REMOTE_URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPO}.git"

            echo ">>> 源：本仓 ${SOURCE_BRANCH}（${CNB_COMMIT_SHORT:-unknown}）"
            echo ">>> 目标：github.com/${GITHUB_REPO} ${TARGET}"

            # 把当前检出（本仓 main 的这次提交）直接推到 GitHub 目标分支。
            # 用 HEAD:refs/heads/<target> 避免本地检出分支名（main）与目标名
            #（master-dev）不一致带来的歧义。
            git push ${PUSH_ARGS} "${REMOTE_URL}" "HEAD:refs/heads/${TARGET}"
            echo ">>> 推送完成"
