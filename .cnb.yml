# ================= 外协·协同 · 专职规划（翰林学士 · 方案/规划书产出 · 不进执行链） =================
# 为何单列顶层段：翰林学士＝「规划位」**单点覆盖**角色（AGENTS.md §5.5 / §11.4 骨骼-引擎解耦）——
#   引擎由「翰林档位选择」stage 三档路由，**不动全员 `.model` 锚点**。
# 三档阶梯（唯一源＝台账 #467 中书令裁定，评论 `2106643857897734144` + 台账 #457 body「C4（改）」段；
#   本段**只引用该取值、不另立基线**）：
#     T1 `glm-5.3`（中档）→ T2 `hy4-preview`（低压档）→ T3 `deepseek-v4.1-flash`（保底/托底）
#   判据（`M = Σ coalesce(original_milli_credit, milli_credit)`，**本自然月**；`B = 670000000` 固定锚）：
#     · `M < 268000000` ⇒ T1；`M ≥ 268000000` ⇒ T2；`M ≥ 469000000` ⇒ T3（等价 `R = 1 − M/B`）
#     · **额度信号可达 ∧ 剩余 ≤ 0** ⇒ T3（无点数/清零）
#     · **额度信号不可达**（`charge` 族 403·常态）⇒ **保留 T1**（**不可达 ≠ 不足**）
#     · **硬化闸**：**本自然月累计实付 `Σ milli_credit` ≥ 阈值** ⇒ **强制 T3**（阈值＝判据脚本
#       `HY_HARDSTOP_MC` 单一常量，**本段不复写数值**，见 `scripts/hanyuan-tier-judge.sh` 为唯一源）；
#       取数不完整（`m` 不可求和）按**部分和（单调下界）**二分：部分和 ≥ 阈值 ⇒ 仍 T3；
#       部分和 < 阈值 ⇒ 保留 T1（`REASON=hardstop-undercomplete`、`ESTIMATED=1`），**禁外推**
#   判据本体＝`scripts/hanyuan-tier-judge.sh`（可自测/桩驱动；回归锁见 `scripts/gate-regression.sh` C-HY 组）。
# ★ 数据源前置（据实 · 同 ⑧/⑨/⑩ 维写法 · #TASK-PLANNER-ROLE-20261004-01-B R7）：
#   本段三档判据依赖 `cnb build get-build-logs` / `cnb build get-build-ai-audit`（权限 `repo-cnb-history:r`）。
#   该权限**只随可信事件 ∪ 工作模式令牌可达**（`casebook/platform.md`「可用面＝可信事件 ∪ 工作模式」）——
#   即经 **api_trigger（crontab 心跳/调兵令）或带 work_mode 的评论 @** 拉起时可达；**普通评论 @（不带 work_mode）不可达**：
#     ① 取数不可达 ⇒ `m = null` ⇒ 本段按**方向纪律 D 保留 T1**（付费中档 `glm-5.3`）——**降级不生效**。
#        **显式告警（禁静默降级）**：该态由脚本在 stderr 落 `REASON=ledger-unreachable` **告警行**，
#        随 stage 日志输出、可审计（现跑取值与判据命令见台账 #457 回奏；出口＝脚本 `hy_print_tier`/`emit`）。
#     ② 因此「无点数/低于阈值自动降免费档」**仅在可信事件 ∪ 工作模式通道成立**；其余通道为已知边界（台账 #457 登记）。
# 通道面（据实 · #TASK-PLANNER-ROLE-20261004-01-B R2 更正）：
#   `issue.comment@npc` / `pull_request.comment@npc` **两个评论事件**复用同一锚点 `.hy_pipelines`（同源）。
#   ★ **`api_trigger` 不是本角色的生效通道**：据官方 T0（`docs.cnb.cool/zh/build/trigger-rule.md` §API 请求
#     事件 / §NPC 事件 + `npc.md` §事件类型）：**NPC 事件仅由评论触发**（`issue.comment@npc` /
#     `pull_request.comment@npc`）；`api_trigger` 是**通用 API 事件、不带角色维度**，其流水线命中
#     顶层 `$: api_trigger`（非角色 key）⇒ 角色段下的 `api_trigger:` 键**结构性不被匹配**。
#     探针实证（sn `cnb-teq-1k43gcb0f`，`NPC_ROLE=翰林学士`）：走 `$:` 兜底段（`deepseek-v4.1-flash` +
#     常规档），**未**命中本段三档 + 轻量档。
#   ⇒ 要经 api_trigger 拉起翰林学士时用 `$: api_trigger`（免费档 + 常规档）；要三档路由 + 轻量档，
#     请用**评论 @i.o/x(翰林学士)** 通道。本段**不含** `api_trigger:` 键（R5 已删）；
#     经 api_trigger 拉起走 `$:` 兜底段（免费档 + 常规档）。保留该键会与「非生效通道」口径两处
#     并存、易误读为已同源（P2-1 收口；键面核验见台账 #457 回奏）。
# 预算：引用 `.budget-light` 轻量档（规划位不占常规业务预算）。
.hy_pipelines: &hy_pipelines
  - runner: *runner  # ← 引用 .runner 锚点（机型见锚点）
    docker:
      image: cnbcool/default-npc:latest      # 官方默认运行环境，开箱即用
    stages:
      - name: 翰林档位选择
        #   ★ P1-2 收口（R5）：**声明 `timeout`**——平台「连续无输出即超时」对间隔取大响应的
        #     逐条审计过紧（真实月量级的条数与串行墙钟取值，见台账 #457 回奏）；本 stage 已改「增量输出 + 并发取数」，
        #     输出即重置窗口，此处设**双保险上界**（取值依据：月量级审计并发后实测墙钟远小于该上界，
        #     留足余量；且流水线总上限不构成新约束）。
        timeout: 15m
        script: |
          set +e
          export LC_ALL=C
          # 判据本体在 scripts/hanyuan-tier-judge.sh（唯一源切点 + 硬化闸 + 方向纪律）；
          # 本 stage 只做调用与声明行转交（异常兜底：脚本自身保证声明行恒被输出）。
          #   ★ P1-2 收口（R5）：**不再用 `$( )` 整体缓冲**——子进程 stdout/stderr **直连**本 stage 输出，
          #     脚本内部 `_progress` 的进度行使平台「无输出窗口」不断重置；声明行经临时文件转交
          #     （`##[set-output]` 行由 stdout 直出，`--emit-set-output` 保证恰一行）。
          # diag（stderr · 进度/TIER/REASON）直连 stage 输出 → 平台「无输出窗口」持续被重置；
          # stdout（恰一行的 `##[set-output …]`）落临时文件，供非零退出兜底判定。
          HY_OUT="$(mktemp)"
          bash scripts/hanyuan-tier-judge.sh --emit-set-output > "$HY_OUT"
          rc=$?
          cat "$HY_OUT"
          echo "── 档位判定结束（rc=$rc）──"
          if [ "$rc" -ne 0 ]; then
            echo "⚠️ 档位判定脚本非零退出（rc=$rc）⇒ fail-safe 保留 T1 glm-5.3"
            echo '##[set-output hanyuan_tier=glm-5.3]'
          fi
          rm -f "$HY_OUT"
          exit 0
        exports:
          hanyuan_tier: HY_TIER
      - name: npc go（T1 · glm-5.3）
        if: |
          [ -z "$HY_TIER" ] || [ "$HY_TIER" = "glm-5.3" ]
        type: npc:go
        options:
          <<: *budget-light   # ← 轻量档：规划位不占常规业务预算
          model: glm-5.3      # ← T1 静态中间档（单点覆盖，不动全员 .model 锚点）
          # role/userPrompt 仅 api_trigger 面生效（评论面由平台按 .cnb/settings.yml 注入、此二者被忽略）；
          # api_trigger 面 userPrompt **必填**（官方 T0：缺失或为空直接报错），故三档同源齐备。
          # ★ 收敛入口（对外事件侧 · AC-1）：本角色段经**评论双事件**命中、且不复用 `.npc` 锚点
          #   ⇒ 段内提示词字段须同措辞在位（三档逐段声明；措辞与 `.npc` 锚点 / 心跳段同源，须同批改齐）。
          role: ${NPC_ROLE}
          systemPrompt: |
            【收敛入口（对外事件侧 · `#TASK-ORCH-CONVERGE-20261004-01 AC-1`）】**结论先行**（先出结论/回奏、再补证据）；单轮**最多深挖 3 项**（含 merge/派单/裁决），其余维**只登记不展开**；**禁整份 `cat`/通读总纲**（只读〇导航+本角色必读切片，深水区用 `bash scripts/kb-query.sh` Top-K 检索）；**轮次自警**：工具调用累计约 ≥80 次或已深挖满 3 项即**立即收敛出手**（防撞机械轮次上限致 `error`=交付断链）；**逼近第⑨维① / 第⑩维阈值即自退**（限巡检类任务，不追加深挖）。（措辞同源＝心跳段 `#TASK-HB-BUDGET-HARDEN-20260912-01 AC-1`；防撞括注取**档位中性**表述、不绑定档位取值，故各档位段通用，防跨档失实。）**首动作纪律（FU-CC-4 · #TASK-CROSSROOT-CHAINBREAK-20261007-01）**：**第一个写动作必须早于深挖**（先建分支/先落最小骨架，再补调研），禁「全程只调研、零落盘」——跨根 0 落地实测末跳 `out=32000/content=0` 静默丢步 ⇒ 零产出断链。
          userPrompt: |
            【收敛入口（对外事件侧 · `#TASK-ORCH-CONVERGE-20261004-01 AC-1`）】**结论先行**（先出结论/回奏、再补证据）；单轮**最多深挖 3 项**（含 merge/派单/裁决），其余维**只登记不展开**；**禁整份 `cat`/通读总纲**（只读〇导航+本角色必读切片，深水区用 `bash scripts/kb-query.sh` Top-K 检索）；**轮次自警**：工具调用累计约 ≥80 次或已深挖满 3 项即**立即收敛出手**（防撞机械轮次上限致 `error`=交付断链）；**逼近第⑨维① / 第⑩维阈值即自退**（限巡检类任务，不追加深挖）。（措辞同源＝心跳段 `#TASK-HB-BUDGET-HARDEN-20260912-01 AC-1`；防撞括注取**档位中性**表述、不绑定档位取值，故各档位段通用，防跨档失实。）**首动作纪律（FU-CC-4 · #TASK-CROSSROOT-CHAINBREAK-20261007-01）**：**第一个写动作必须早于深挖**（先建分支/先落最小骨架，再补调研），禁「全程只调研、零落盘」——跨根 0 落地实测末跳 `out=32000/content=0` 静默丢步 ⇒ 零产出断链。
            ${SUMMON_BRIEF}
      - name: npc go（T2 · hy4-preview）
        if: |
          [ "$HY_TIER" = "hy4-preview" ]
        type: npc:go
        options:
          <<: *budget-light   # ← 轻量档（与上下档同源）
          model: hy4-preview  # ← T2 低压档（M ≥ 268000000）
          systemPrompt: |
            【收敛入口（对外事件侧 · `#TASK-ORCH-CONVERGE-20261004-01 AC-1`）】**结论先行**（先出结论/回奏、再补证据）；单轮**最多深挖 3 项**（含 merge/派单/裁决），其余维**只登记不展开**；**禁整份 `cat`/通读总纲**（只读〇导航+本角色必读切片，深水区用 `bash scripts/kb-query.sh` Top-K 检索）；**轮次自警**：工具调用累计约 ≥80 次或已深挖满 3 项即**立即收敛出手**（防撞机械轮次上限致 `error`=交付断链）；**逼近第⑨维① / 第⑩维阈值即自退**（限巡检类任务，不追加深挖）。（措辞同源＝心跳段 `#TASK-HB-BUDGET-HARDEN-20260912-01 AC-1`；防撞括注取**档位中性**表述、不绑定档位取值，故各档位段通用，防跨档失实。）**首动作纪律（FU-CC-4 · #TASK-CROSSROOT-CHAINBREAK-20261007-01）**：**第一个写动作必须早于深挖**（先建分支/先落最小骨架，再补调研），禁「全程只调研、零落盘」——跨根 0 落地实测末跳 `out=32000/content=0` 静默丢步 ⇒ 零产出断链。
          userPrompt: |
            【收敛入口（对外事件侧 · `#TASK-ORCH-CONVERGE-20261004-01 AC-1`）】**结论先行**（先出结论/回奏、再补证据）；单轮**最多深挖 3 项**（含 merge/派单/裁决），其余维**只登记不展开**；**禁整份 `cat`/通读总纲**（只读〇导航+本角色必读切片，深水区用 `bash scripts/kb-query.sh` Top-K 检索）；**轮次自警**：工具调用累计约 ≥80 次或已深挖满 3 项即**立即收敛出手**（防撞机械轮次上限致 `error`=交付断链）；**逼近第⑨维① / 第⑩维阈值即自退**（限巡检类任务，不追加深挖）。（措辞同源＝心跳段 `#TASK-HB-BUDGET-HARDEN-20260912-01 AC-1`；防撞括注取**档位中性**表述、不绑定档位取值，故各档位段通用，防跨档失实。）**首动作纪律（FU-CC-4 · #TASK-CROSSROOT-CHAINBREAK-20261007-01）**：**第一个写动作必须早于深挖**（先建分支/先落最小骨架，再补调研），禁「全程只调研、零落盘」——跨根 0 落地实测末跳 `out=32000/content=0` 静默丢步 ⇒ 零产出断链。
            ${SUMMON_BRIEF}
          role: ${NPC_ROLE}
      - name: npc go（T3 · 免费保底）
        if: |
          [ "$HY_TIER" = "deepseek-v4.1-flash" ]
        type: npc:go
        options:
          <<: *budget-light   # ← 轻量档（与上下档同源）
          model: deepseek-v4.1-flash   # ← T3 保底/托底档（M ≥ 469000000 ∨ 额度清零 ∨ 硬化闸命中）
          systemPrompt: |
            【收敛入口（对外事件侧 · `#TASK-ORCH-CONVERGE-20261004-01 AC-1`）】**结论先行**（先出结论/回奏、再补证据）；单轮**最多深挖 3 项**（含 merge/派单/裁决），其余维**只登记不展开**；**禁整份 `cat`/通读总纲**（只读〇导航+本角色必读切片，深水区用 `bash scripts/kb-query.sh` Top-K 检索）；**轮次自警**：工具调用累计约 ≥80 次或已深挖满 3 项即**立即收敛出手**（防撞机械轮次上限致 `error`=交付断链）；**逼近第⑨维① / 第⑩维阈值即自退**（限巡检类任务，不追加深挖）。（措辞同源＝心跳段 `#TASK-HB-BUDGET-HARDEN-20260912-01 AC-1`；防撞括注取**档位中性**表述、不绑定档位取值，故各档位段通用，防跨档失实。）**首动作纪律（FU-CC-4 · #TASK-CROSSROOT-CHAINBREAK-20261007-01）**：**第一个写动作必须早于深挖**（先建分支/先落最小骨架，再补调研），禁「全程只调研、零落盘」——跨根 0 落地实测末跳 `out=32000/content=0` 静默丢步 ⇒ 零产出断链。
