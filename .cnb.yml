                 「一律不参与熔断」单源口径一致，防"恒 0 维发伪裁决"）
                 #<<FUSE_HB_FREEZE
                 ★ **终局裁决冻结感知（F-308c · #TASK-FUSE-FOLLOWUP-20261006-01）——本维命中后、发起 api_trigger 之前**：
                 先对该 PR **所属台账**（取数口径同第①维：PR 正文 `QG-Ledger:` 行 / 正文台账链接）跑**冻结判定**——
                 **判据复用第①维内 `#<<FROZEN_GUARD_SH … #FROZEN_GUARD_SH>>` 哨兵块、原样抽取执行**（**禁**在本段另立第二份判据文本）；
                 入参 `FG_LEDGER_STATE` / `FG_LEDGER_REASON` / `FG_LEDGER_BODY` / `FG_PR_BODY` 含义见该块首注。
                 · `FROZEN=yes`（台账 `state=closed ∧ reason=not_planned` ∧ body 含「转出 #<M>」/「另立台账 #<M>」等承接台账）⇒ **只登记告警行、不发起向中书令的 api_trigger**（本单已终局裁决，重复投递即 #566 同族）；
                 · `FROZEN=no` **或** `FROZEN=?`（台账号/裁决文本**取不到**）⇒ **照常判定并照常拉起**——**fail-closed 方向与第①维相反**：此处「取不到」**禁**静默跳过升级（**误停升级比重复投递更危险**，沿 F-308a 判据本体方向）。
                 → 视同"断链接棒"，api_trigger 拉起中书令裁决换方案（补 failStages 熔断升级出口 a/b 均不可达时的盲区，防熔断后静默停摆）。
                 #FUSE_HB_FREEZE>>
                 **轮次计数口径与熔断 stage 一致（P1-1 修复 · 只认专属信号，**不取大**；**F-134 起为「分段」口径**）**：**唯一计轮判据**=`git log --format=%B <base>..<PR分支> | grep -c '^QG-Fingerprint:'`
                 （自愈环自产的机器可读指纹尾行，外部/人工 commit 不可能携带 → 天然不可 over-count）；
                 **分段语义（F-134 · #TASK-BREAKER-RESET-20260914-01 · 与熔断 stage 单源、不在此另立定义）**：
                 `<base>` 取**最近一次换方案归零 commit**（**任意行**以 `^QG-Reset:` 起头）——该值由熔断 stage 判定并打印于
                 `/workspace/qg-熔断-判定.txt` / 构建日志；**无归零留痕时 `<base>`＝默认分支（＝累计口径，与旧行为一致）**。
                 为什么：指纹尾行数在分支不可变历史上**只增不减** ⇒ 换方案轮按 §8 护栏② 归零后仍恒 ≥ 阈值
                 ⇒ 熔断永久有效、自愈环被 `if` 守卫永久跳过（F-134）；故巡检须与熔断 stage 同取**分段**值，
                 否则「stage 判 CLOSED、巡检判 ≥3」→ 误拉起中书令换方案（正是本段开头所禁的口径漂移复发）。
                 `^\[[^]]+\][[:space:]]*fix:` commit 数**仅作一致性告警、不参与计轮**
                 （它是 §11 规定的**所有**修复 commit 通用格式，含初始实现/常规 bugfix；旧版"双信号取大"会把常规 PR 误判 ≥3 轮 → **误拉起中书令换方案**，
