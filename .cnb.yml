        - name: 质量门-gate
          script: |
            set +e
            # ★ P1-1（#184 · 刑部独立复验）：判据**自足 locale 无关**——`[[:space:]]` 在 C/POSIX 按字节、
            #   C.UTF-8 按字符，多字节空白（U+3000/U+2003…）行为相反（体量门侧 fail-open / 刑部侧误杀）。
            #   故**不用 `[[:space:]]`**：改 `LC_ALL=C` 字节语义 + **显式 ASCII `[ \t\v\f\r]`** + **固定字节序列**
            #   剥离常见 Unicode 空白（字面字节序列在字节模式下 3 locale 一致）→ 判据结果与外部 locale 无关。
            export LC_ALL=C
            _WS_SED='s/^\xC2\x85//;s/\xC2\x85$//;s/^\xC2\xA0//;s/\xC2\xA0$//;s/^\xE1\x9A\x80//;s/\xE1\x9A\x80$//;s/^\xE2\x80\x80//;s/\xE2\x80\x80$//;s/^\xE2\x80\x81//;s/\xE2\x80\x81$//;s/^\xE2\x80\x82//;s/\xE2\x80\x82$//;s/^\xE2\x80\x83//;s/\xE2\x80\x83$//;s/^\xE2\x80\x84//;s/\xE2\x80\x84$//;s/^\xE2\x80\x85//;s/\xE2\x80\x85$//;s/^\xE2\x80\x86//;s/\xE2\x80\x86$//;s/^\xE2\x80\x87//;s/\xE2\x80\x87$//;s/^\xE2\x80\x88//;s/\xE2\x80\x88$//;s/^\xE2\x80\x89//;s/\xE2\x80\x89$//;s/^\xE2\x80\x8A//;s/\xE2\x80\x8A$//;s/^\xE2\x80\xA8//;s/\xE2\x80\xA8$//;s/^\xE2\x80\xA9//;s/\xE2\x80\xA9$//;s/^\xE2\x80\xAF//;s/\xE2\x80\xAF$//;s/^\xE2\x81\x9F//;s/\xE2\x81\x9F$//;s/^\xE3\x80\x80//;s/\xE3\x80\x80$//;s/^\xEF\xBB\xBF//;s/\xEF\xBB\xBF$//'
            _normalize_ws() {   # stdin → stdout：去首尾 ASCII + Unicode 空白（字节模式 · locale 无关）
              #   ★ P1-1 二修（#184 · 刑部实证「≥2 个连续多字节空白前缀」残留 → 体量门 fail-open）：
              #     `_WS_SED` 每条规则**每趟只剥 1 个**字符（sed 不自动重复）→ 固定 N 趟会随前缀长度漏判。
              #     故改**循环至稳定（loop-until-stable）**：`break` 保证严格递减必终止。
              #     ★ P2-4（#229 · 门下新增）据实：`_WS_MAX`（默认 100000）仅**防无限循环**，
              #     **既非功能上界、也非耗时上界**——归一为**逐趟 sed**（每趟剥 1 字符），耗时随前缀
              #     长度线性增长（实测 1000×→~1.1s、5000×→~6.8s、20000×→~40s）；当前**输入源仅
              #     刑部/门下首行**（`head -1` 单行，非外部可控）→ 现实风险极低；若需消除该开销，
              #     改**单趟固定点**实现（一次 sed/awk 等价物）而非逐趟循环。
              #   ★ S1（#229 · 去文本化）后本函数**仅服务刑部/门下首行归一**（体量门侧已改读 `qg-体量.rc`、
              #     不再解析文本）；保留因「首行 canonical 闭集等值 + 首尾空白容忍」仍需要它。
              #     ASCII 空白含 VT/FF/CR；Unicode 空白含 NEL(U+0085)。字节模式 → 3 locale 一致。
              local x y i
              x="$(cat)"
              i=0
              while [ "$i" -lt "${_WS_MAX:-100000}" ]; do
                y="$(printf '%s' "$x" | sed -E -e 's/^[ \t\v\f\r]+//' -e 's/[ \t\v\f\r]+$//' -e "$_WS_SED")"
                [ "$y" = "$x" ] && break
                x="$y"
                i=$((i+1))
              done
              printf '%s' "$x"
            }
            # ---- 「门未跑出结论」判据（#TASK-QG-CHANNEL-FAULT-20261004-01 · 质量门 P1-1 收口）----
            #   ★ 为什么不是「只看文件是否存在」：AC-2 要求把「文件缺失/**空值**」与「已判否」给**互不相同**
            #     的机器可读标识。仅看存在性时，`0 字节` / `纯空白` / **初值残留**（Agent 落盘 fail-closed 初值后
            #     中途停止，正是本单要防的形态）都会落进 `CN-*-REJECT`（与真判否同码）⇒ 自愈按内容缺陷动手、
            #     而文件里没有任何内容缺陷可改 = 与源 PR#474「12 轮同族连红」同构的空转。
            #   ★ 判据（二进制 · 四形态任一成立即「未跑出结论」· fail-closed 机制面优先）：
            #     ① 结论文件不存在；② 0 字节（`! -s`）；③ 首行**归一后为空**（纯空白/纯 Unicode 空白）；
            #     ④ **旁路标记残留** `<门>.初值`（两门 stage 落初值时**同时** touch 该标记、覆盖写最终结论时
            #        `rm -f` 它）——标记在即「初值未被覆盖」⇒ 机制面。
            #   ★ 为什么用旁路标记而非文本哨兵串：哨兵串判别属文本启发式，措辞一改即漂移；标记是同一动作的
            #     结构性伴生（与结论同址、不占评论配额、不越白名单），无法被措辞变化绕过。
            _qg_noconc() {   # $1 = 门结论文件路径**去扩展名**前缀（如 /workspace/qg-刑部）
              [ -f "$1.txt" ] || return 0
              [ -f "$1.初值" ] && return 0
              [ -s "$1.txt" ] || return 0
              [ -z "$(head -1 "$1.txt" | tr -d '\r' | _normalize_ws)" ] && return 0
              return 1
            }
            echo "===== 质量门 gate 校验开始 ====="
            echo "--- /workspace/qg-体量.rc（判据源 · 逐字契约）---"
            cat /workspace/qg-体量.rc 2>/dev/null || echo "(文件不存在，体量门被跳过或未执行)"
            echo ""
            echo "--- /workspace/qg-体量.txt（人类可读留痕 · 不进判据）---"
            cat /workspace/qg-体量.txt 2>/dev/null || echo "(文件不存在，体量门被跳过或未执行)"
            echo ""
            echo "--- /workspace/qg-刑部.txt ---"
            cat /workspace/qg-刑部.txt 2>/dev/null || echo "(文件不存在)"
            echo ""
            echo "--- /workspace/qg-门下.txt ---"
            cat /workspace/qg-门下.txt 2>/dev/null || echo "(文件不存在)"
            echo ""
            TILIANG_PASS=""
            XINGBU_PASS=""
            MENXIA_PASS=""
            CONFLICT_PASS=""
            # ---- 体量门判据（S1 · **去文本化** · #TASK-QG-GATE-LOCALE-FIX-20260910-01 · 换方案）----
            #   ★★ 换方案（S1 · 体量门判据去文本化 · §8 护栏② 第 5 代范式级）：
            #     判据**不再解析** qg-体量.txt 的人类可读文本，改读产出方由 `size-check` **exit code**
            #     写入的机器可读逐字契约 `qg-体量.rc`（仅 `PASS`/`FAIL`）→ 逐字等值判定。
            #     结构性消除「锚定（左/右/两端）/ 伪造后缀 / 不可见字符前缀 / 剥离彻底性 / 重复次数 /
            #     空白字符类」整族旁路（该族已历 5 代同族变体、每补一维即裂一维 = 范式错）。
            #   ★ fail-closed：FAIL / 未知 token / **前导**空白 / 结尾 CR / 有旧文本通道但无 rc 契约 → 判红。
            #     （P2-D 据实：**尾随换行**由 `$(cat)` 命令替换归一，不被判红——产出方 `printf 'PASS\n'`
            #      形态不受影响；如需字节级严格，可在 case 前显式断言 rc 文件字节内容。）
            #     仅「rc 与 txt 均缺失」视为跳过（旧仓库未启用体量门）。
            #   注：`_normalize_ws` / `_WS_SED` 仍为**刑部/门下首行归一**所必需（保留）；仅体量门侧不再使用。
            if [ -f /workspace/qg-体量.rc ]; then
              case "$(cat /workspace/qg-体量.rc)" in
                PASS) TILIANG_PASS="yes" ;;
                *)    TILIANG_PASS="" ;;   # FAIL / 未知 / 前导空白 / CR → fail-closed 判红（尾随换行由 $(cat) 归一）
              esac
            elif ls /workspace/qg-体量.* >/dev/null 2>&1; then
              TILIANG_PASS=""   # 仅存旧文本通道、无 rc 契约 → fail-closed（**只探存在性、不读内容**）
            else
              TILIANG_PASS="yes"   # 文件缺失视为跳过（旧仓库无体量门）
            fi
            # ---- 刑部/门下判据（C1/C2 · #184 中书令裁决：首行 canonical 闭集等值 + fail-closed）----
            #   ★ 为什么不用「剥离式豁免 / 否定词枚举 / 语义推断」（三轮同族复发的根因）：
            #     对**自由文本首行**做剥离/枚举，放行面随措辞发散——补了 `遗留|待修` 族又漏 `问题` 族
            #     （P0-1 fail-open 复发），且剥离正则本身会误杀合法肯定式（P1-1 fail-closed 过度）。
            #     故判据收敛为**有限、可穷举、无正则**的**逐字等值**：放行只认首行恰好等于闭集 token，
            #     任何多余字符（括注/分句/顿号/证据/后缀）→ 判红，空行/缺失/未知 token → 判红。
            #   ★ 产出方契约：首行**仅写结论 token**（刑部 `✅通过`；门下 `准`），缺陷清单/证据从第 2 行起。
            #   ★ 判红面与判过面均**有限闭集**，无「否定词枚举/语义推断」面；空白归一由 `_normalize_ws`
            #     循环剥净（ASCII `[ \t\v\f\r]` + Unicode 固定字节序列）→ **多字节空白按空白归一**（作填充）。
            #   ★ 回归用例矩阵：`scripts/gate-regression.sh`（从本 stage 原样抽取 script 驱动，×3 locale）。
            #   ★ P1-1（#184 · 刑部独立复验）：判据**自足 locale 无关**——不用 `[[:space:]]`（其在 C/POSIX
            #     按字节、C.UTF-8 按字符，多字节空白行为相反 → 体量门 fail-open / 刑部误杀）；改 ASCII
            #     `[ \t\v\f\r]` + Unicode 固定字节序列**循环归一**。故多字节空白（U+3000/U+2003/NEL…）
            #     **按空白归一**：`✅通过`+U+3000 尾 → 判过（rc=0）；`U+3000`+`❌` 行 → 判红（rc=1）。
            #     （实测以 `gate-regression.sh` C1-4 组 ×3 locale 断言为准，勿凭本注释推断。）
            #   ★ F-49（#184 中书令裁决 · 闭集扩零值族）：原闭集过窄，致验收清单 C1 逐字要求 exit 0 的
            #     `✅通过（无P0/P1缺陷）` 等**零值肯定括注**被误杀。按 §8「验收清单权责」**不修订 C1、
            #     只扩闭集白名单**：把「零值肯定括注」以**逐字枚举**并入放行闭集（**仍不引入任何正则/
            #     剥离/语义推断**——只在 case 模式里多列若干**字面串**，放行面依然有限可穷举）。
            #     ★ 白名单**只收零值形态**（无/0/零 + 缺陷族）；任何**非零计数**（如 `问题1处`/`遗留1处`）
            #       或**未枚举形态**一律不进闭集 → 判红（fail-closed 不放松）。
            #   ★ F-49 收口 R1/R2（#184 中书令复验 head `ac7df3a` 裁决 · 2026-09-10）：
            #     R1（同义异判 → fail-closed 二者判红）：`（无P0、P1缺陷）`（顿号）原被收编放行、
            #       `（无P0，P1缺陷）`（半角逗号）判否——语义等价却异判 = 判据不自洽，且该形态**不在
            #       台账 C1 文本内**（C1 只列 `（无P0/P1缺陷）`）。裁决：**从白名单移除顿号变体**，
            #       二者一律判红（不对账外歧义形态开口）。
            #     R2（合法零值式误杀 → 补入白名单）：`✅通过（缺陷 0 处）`（含空格）原判否，与 C1
            #       「不误杀合法首行」子句不符 → **补入含空格变体 `（缺陷 0 处）`**。
            #   ★ 白名单维护纪律：新增形态须同时补 `scripts/gate-regression.sh` 对应用例并跑 ×3 locale；
            #     **禁**把「非零缺陷标注」加入白名单（那是 P0-1 fail-open 族，必须判红）。
            # ★★ A7 单一事实源（#TASK-QG-GATE-LOCALE-FIX-20260910-01 · 换方案①③）：闭集**只列举一次**
            #   （下方 `_QG_X` = 刑部侧权威表）；门下闭集由前缀映射表 `_QG_MAP` **机械派生**（本 stage 内构建，
            #   非手写第二份），仅另附**逐条登记的 main 兼容异写**（`_QG_MENXIA_LEGACY`）。
            #   ★ 判据由 `scripts/gate-regression.sh` 双向锁定：① 门下闭集 ⊇ 派生集（镜像完整性）；
            #     ② 门下闭集 ⊆ 派生集 ∪ 登记异写（**禁自扩枚举**）。
            #   ★ F-64（#229 · 中书令实测）：**禁**用 `case "$tok" in $VAR)` 做登记/交替——POSIX `case` 对
            #     **变量展开**的 `|` 不作词法交替（多 token 清单恒 NOMATCH，静默失效）。
            #     本段一律**逐 token 比对**（`grep -qxF` / 逐行循环），不依赖变量内 `|`。
            _QG_MAP='✅ 通过=>✅ 准
            ✅通过=>✅ 准
            ✅ 合格=>✅ 准
            ✅合格=>✅ 准
            通过=>准
            合格=>准'
            _QG_X='✅通过
            ✅ 通过
            通过
            合格
            ✅合格
            ✅ 合格
            ✅通过（无P0/P1缺陷）
            ✅ 通过（无P0/P1缺陷）
            通过（无P0/P1缺陷）
            ✅通过（无 P0/P1 缺陷）
            ✅通过（无缺陷）
            ✅通过（无P0，无P1）
            ✅通过（无 P0，P1=0）
            ✅通过（P0/P1=0）
            ✅通过（P0=0, P1=0）
            ✅通过（P0:0, P1:0）
            ✅通过（缺陷0处）
            ✅通过（缺陷 0 处）
            ✅通过（缺陷：0）
            ✅通过（无遗留）
            ✅通过（遗留0处）
            ✅通过（零缺陷）
            ✅通过（没有缺陷）
            ✅通过（未见缺陷）
            ✅通过（不含P0/P1）'
            # main 兼容异写（main 上 `✅` 后空格两写并存）：逐条登记、非自扩（矩阵断言「全部例外仅此 2 条」）
            _QG_MENXIA_LEGACY='✅准
            ✅准（无P0/P1缺陷）'
            _qg_derive_menxia() {   # 刑部 token（stdin）→ 门下 token（前缀映射 · 逐 token 循环 · 长前缀优先）
              local t pre rep line
              while IFS= read -r t; do
                [ -n "$t" ] || continue
                rep=""
                while IFS= read -r line; do
                  [ -n "$line" ] || continue
                  pre="${line%%=>*}"
                  case "$t" in "$pre"*) rep="${line#*=>}${t#"$pre"}"; break ;; esac
                done <<QG_MAP_EOF
            $_QG_MAP
            QG_MAP_EOF
                [ -n "$rep" ] && printf '%s\n' "$rep"
              done <<QG_X_EOF
            $_QG_X
            QG_X_EOF
            }
            # 门下闭集 = 派生集 ∪ 登记异写（滤空行：空 token 恒判否，防 fail-open）
            _QG_MENXIA_TOKENS="$({ _qg_derive_menxia; printf '%s\n' "$_QG_MENXIA_LEGACY"; } | grep -vE '^$')"
            # 逐字等值判定：闭集成员关系用 `grep -qxF`（逐 token 比对 · 无正则 · 无变量内交替）
            xingbu_token_ok() { printf '%s\n' "$_QG_X" | grep -qxF -- "$1"; }
            menxia_token_ok() { printf '%s\n' "$_QG_MENXIA_TOKENS" | grep -qxF -- "$1"; }
            if [ -f /workspace/qg-刑部.txt ] && [ ! -f /workspace/qg-刑部.初值 ] && [ -s /workspace/qg-刑部.txt ]; then
              XINGBU_L1="$(head -1 /workspace/qg-刑部.txt | tr -d '\r' | _normalize_ws)"
              xingbu_token_ok "$XINGBU_L1" && XINGBU_PASS="yes"
            fi
            if [ -f /workspace/qg-门下.txt ] && [ ! -f /workspace/qg-门下.初值 ] && [ -s /workspace/qg-门下.txt ]; then
              MENXIA_L1="$(head -1 /workspace/qg-门下.txt | tr -d '\r' | _normalize_ws)"
              menxia_token_ok "$MENXIA_L1" && MENXIA_PASS="yes"
            fi
            # ---- 冲突标记残片门判据（P2-2 收口 · 消除「孤儿产物 / 死指针」）----
            #   F-300 的「冲突标记残片门」stage 原写 `qg-冲突.rc` 却**无消费方**（实测 gate 引用数 = 0）
            #   ——硬门虽由该 stage `exit 1` 成立，但「stage 间机器契约」产物无消费方即死指针面
            #   （F-135⑦ 同族）。此处让 gate **消费并纳判**：与体量门同款**逐字等值 + fail-closed**
            #   （`PASS` 判过；`FAIL`/未知/前导空白/CR 判红；**rc 与 txt 均缺＝该 stage 未启用 ⇒ 视为跳过**）。
            if [ -f /workspace/qg-冲突.rc ]; then
              case "$(cat /workspace/qg-冲突.rc)" in
                PASS) CONFLICT_PASS="yes" ;;
                *)    CONFLICT_PASS="" ;;
              esac
            elif ls /workspace/qg-冲突.* >/dev/null 2>&1; then
              CONFLICT_PASS=""   # 仅有 txt 无 rc 契约 → fail-closed
            else
              CONFLICT_PASS="yes"   # 两缺 ⇒ 该 stage 未执行（旧仓库）⇒ 跳过
            fi
            # ---- GFM 表行竖线门判据（AC-2 · #TASK-GROWTH-20261006-05 · 台账 #616）----
            #   与冲突标记残片门同款：stage 硬门由自身 `exit 1` 成立，此处让 gate **消费并纳判**该机器契约
            #   （`PASS` 判过；`FAIL`/未知/前导空白/CR 判红；**rc 与 txt 均缺＝该 stage 未启用 ⇒ 视为跳过**）。
            if [ -f /workspace/qg-表行.rc ]; then
              case "$(cat /workspace/qg-表行.rc)" in
                PASS) GFMTABLE_PASS="yes" ;;
                *)    GFMTABLE_PASS="" ;;
              esac
            elif ls /workspace/qg-表行.* >/dev/null 2>&1; then
              GFMTABLE_PASS=""   # 仅有 txt 无 rc 契约 → fail-closed
            else
              GFMTABLE_PASS="yes"   # 两缺 ⇒ 该 stage 未执行 ⇒ 跳过
            fi
            # ---- 失败码：**可区分「机制故障（门未跑出结论）」与「内容缺陷（门判否）」** ----
            #   ★ 为什么有这一段（#TASK-QG-CHANNEL-FAULT-20261004-01 · 源 PR#474 同族 12 轮连红）：
            #     刑部/门下 stage 是 `npc:go`，平台**恒 exit 0**（Agent 正常结束即 success）。若 Agent
            #     未执行「写结论文件」这一步（实录 sn `cnb-s4c-1k42o39kb`：刑部 stage status=success /
            #     `done. 55 turns`，全程**未落盘** `/workspace/qg-刑部.txt`，门下却写出了自己的），
            #     gate 只能看到「文件不存在」。旧实现下「文件不存在」与「刑部判否」**同为 exit 1、
            #     同一条日志形状** ⇒ failStages 一律当「内容缺陷」自愈 ⇒ 改内容修不动机制故障、
            #     空转烧轮次（本单已 12 轮同族连红）。
            #   故产出**机器可读单行契约** `/workspace/qg-失败码.txt`：
            #     · `MG-*`（mechanism）＝门**未跑出结论**（结论文件缺失 / 0 字节 / 首行归一为空 / 初值标记残留）
            #       ⇒ 机制故障，禁按内容缺陷自愈；
            #     · `CN-*`（content）＝门**判否**（文件在、首行非闭集 token）⇒ 内容缺陷，照常自愈；
            #     · `PASS` ＝全门通过。
            #   判据（fail-closed · 机制面优先）：`_qg_noconc`（缺失/空值/初值残留）判定**先于**内容判否——
            #     门都没跑出结论时，不得把它记成「判否」（那会把机制故障误标成内容缺陷，正是本单要根治的淹没面）。
            #     ★ 若你的口径是「空值＝『文件缺失』在 gate 日志中的表现」而非独立输入形态：本实现**已覆盖**
            #       空值/初值残留（见 `_qg_noconc` 四态），无需另立旁注。
            #   消费方＝failStages「转储失败信息」（转储该文件）+「工部尚书自愈」userPrompt（据 MG/CN 分流）。
            QG_FAILCODE="PASS"
            if _qg_noconc /workspace/qg-刑部; then
              QG_FAILCODE="MG-XB-NOCONC"      # 第一道门（刑部）未跑出结论（缺失/空值/初值残留）
            elif _qg_noconc /workspace/qg-门下; then
              QG_FAILCODE="MG-MX-NOCONC"      # 第二道门（门下）未跑出结论（缺失/空值/初值残留）
            elif [ "$TILIANG_PASS" != "yes" ]; then
              QG_FAILCODE="CN-TL-FAIL"        # 文档体量门判否（rc=FAIL/未知）
            elif [ "$CONFLICT_PASS" != "yes" ]; then
              QG_FAILCODE="CN-CF-FAIL"        # 冲突标记残片门判否
            elif [ "$GFMTABLE_PASS" != "yes" ]; then
              QG_FAILCODE="CN-GR-FAIL"        # GFM 表行竖线门判否
            elif [ "$XINGBU_PASS" != "yes" ]; then
              QG_FAILCODE="CN-XB-REJECT"      # 刑部结论在、首行非闭集 token（判否）
            elif [ "$MENXIA_PASS" != "yes" ]; then
              QG_FAILCODE="CN-MX-REJECT"      # 门下结论在、首行非闭集 token（判否）
            fi
            printf '%s\n' "$QG_FAILCODE" > /workspace/qg-失败码.txt
            echo "质量门失败码（qg-失败码.txt）= $QG_FAILCODE"
            if [ "$TILIANG_PASS" = "yes" ] && [ "$XINGBU_PASS" = "yes" ] && [ "$MENXIA_PASS" = "yes" ] && [ "$CONFLICT_PASS" = "yes" ] && [ "$GFMTABLE_PASS" = "yes" ]; then
              echo "✅ 质量门全部通过：文档体量门 ✅ + 冲突标记残片门 ✅ + GFM 表行竖线门 ✅ + 刑部 ✅ + 门下 准"
              exit 0
            else
              echo "❌ 质量门未通过（exit 1 触发 failStages 工部自愈）：失败码=$QG_FAILCODE"
              case "$QG_FAILCODE" in
                MG-*) echo "  ⚠️ 机制故障（门未跑出结论）：**不是**内容缺陷——不得按 qg 结论改内容（无结论可改），按机制故障上报/重跑。" ;;
                *)    echo "  内容缺陷（门判否）：按下方 qg 结论逐条修复。" ;;
              esac
              echo "  体量门结论 = $(cat /workspace/qg-体量.rc 2>/dev/null)"
              echo "  冲突门结论 = $(cat /workspace/qg-冲突.rc 2>/dev/null)"
              echo "  GFM 表行门结论 = $(cat /workspace/qg-表行.rc 2>/dev/null)"
              echo "  刑部结论 = $(cat /workspace/qg-刑部.txt 2>/dev/null | head -3)"
              echo "  门下结论 = $(cat /workspace/qg-门下.txt 2>/dev/null | head -3)"
              echo "  缺陷详情见上方 qg-*.txt 内容（failStages 工部会读取定位修复）"
              exit 1
            fi

      # ---- 构建失败自愈（failStages）：本流水线任一 stage 失败即自动拉起工部尚书诊断+修复+推 PR。
      #      失败原因分两类，工部须先区分再定位：
      #      ① 质量门拒绝（gate exit 1，因刑部❌/门下驳）→ 优先读 /workspace/qg-*.txt 定位缺陷并修复；
      #      ② 技术故障（npc:go 崩溃/脚本报错等）→ 读 CNB_BUILD_FAILED_MSG + get-build-logs 定位根因修复。
      #      ★ 自愈环有上限（#TASK-QG-CIRCUITBREAKER-20260910-01）：先过「自愈熔断判定」stage，达阈值即熔断、
      #        跳过工部自愈、改走升级出口拉起中书令裁决（不再自动 push 修复 commit，防无界空转）。
      failStages:
        - name: 转储失败信息
          script: |
            # ★ P0 修复（#TASK-FAILSTAGE-SETPLUS-20261004-01）：本 stage 原先**缺 `set +e`**，
            #   而 CNB `script` 默认 `set -e`（且 runner 用 dash）。
            #   下方 F-308a 段的取数行形如 `_x="$(… | grep -oE '…' | head -1 | grep -oE '…')"`——
            #   **无命中时末条 grep 退出码=1**，dash 下「赋值+命令替换」会**继承该非零码** ⇒ `set -e` 直接
            #   **中止整个 stage**（实测：PR 正文无 `QG-Ledger:` marker 时，stage 在首个取数行即 exit 1）。
            #   后果：本 stage 后续的 `CNB_BUILD_FAILED_MSG.txt` 转储与 qg 三件套打印**全部不执行**，
            #   且 failStages 内后续 stage（`自愈熔断判定`/`工部尚书自愈`）一并 skipped ⇒
            #   **整条质量门自愈链静默失效**（PR#458 实录：PR 正文用 `台账：链接` 形态、无 marker，
            #   failStages 三 stage 全灭，构建停在 error 上，只能人工喊「CI failed」）。
            #   故：① 补 `set +e`——口径与**本 stage 体的首条可执行语句**规范一致（同库各 script stage 体
            #          首条即声明 `set +e` 者：`熔断守卫`/`评论撞线守卫`/`运行时产物守卫`/`冲突标记残片门`/`GFM 表行竖线门`/
            #          `文档体量门`/`质量门-gate`/`转储失败信息`/`自愈熔断判定`（枚举随 stage 增删同步；可 `grep -n 'set +e' .cnb.yml` 回查）；
            #          ★ 「文档体量门」**曾**同形缺 `set +e`（**锚点式指认＝ stage 名「文档体量门」**；两门 `sh -e` 实跑反证：size-check
            #          返回非零时 rc 在 `rc=$?` 之前致命化、`qg-体量.rc` 不生成，与本 stage 缺陷同类同因）
            #          ——本单（R2）已在**同 PR**一并收口：该 stage 体首补 `set +e`，结论仍由 `qg-体量.rc`
            #          逐字契约传递、stage 自身恒 `exit 0`。其余流水线（`main` 心跳日/夜段、`api_trigger`）
            #          同形面**未清点**，据实另立 follow-up 台账 #463，不以全称句注销；
            #       ② 取数行本就声明「取不到 ⇒ 告警、不早退」（fail-open 语义），**不得**因无命中而致命。
            #   本修复只补护栏、不改 F-308a 判据本体（判据仍 fail-closed：取不到 ⇒ 不早退、照常自愈）。
            set +e
            echo "CNB_BUILD_FAILED_MSG >>>"
            # ---- F-308a（#433 并入）：裁决状态须对「CI 失败事件 → 承接方」通道可见 ----
            #   ★ 哨兵载体＝**独立文件 `/workspace/qg-裁决冻结.txt`**（不复用 `qg-熔断.txt`：紧随其后的
            #     「自愈熔断判定」stage 在 CLOSED 分支会 `rm -f qg-熔断.txt`，复用即被静默清除 ⇒ 假护栏）。
            #   实录：终局裁决（「本单不再产生新 commit」）之后，平台仍自动评论「CI failed, please fix.」
            #   ⇒ 承接方在**裁决后**继续产出修复轮（F-296/F-274/F-286 同族第 3 次实证）。
            #   故 failStages 入口先读「已终局裁决」标记，命中即**置哨兵早退**（后续「工部尚书自愈」stage
            #   的 `if` 已绑定 `qg-熔断.txt` ⇒ 天然跳过）；判据 fail-closed：取不到 ⇒ **不早退**（照常自愈），
            #   只写告警行（不得据「取不到」静默判「已终局」而误停自愈——那是比不拦更危险的误杀）。
            #   ★★ P1-1 修复（F-308 同族第 3 次实证 · 取数面与解析面**解耦**）：
            #     原实现读「评论撞线守卫」产物 `ledger=<N>`，而该产物由 `scripts/qg-ledger-resolve.sh`
            #     产出——**该解析器的语义恰是「显式排除 closed 台账」**（`QG_CLOSED` 集 + fail-safe
            #     `ledger=none`）。而 F-308a 的**目标场景**就是「台账 closed ∧ not_planned」⇒
            #     **目标场景与取数器互斥**：主源恒不供给目标号（真实语料下取到的是**他任务** open 号或
            #     `none`）⇒ 守卫在真实链路上**不触发**（inert guard，非结构不可达）。
            #     故本守卫**不复用**留痕解析器，改**独立取数**：直接取 PR 正文 `QG-Ledger:` marker
            #     **原值**（不经 closed 过滤）→ 回落 PR 正文台账链接（`issues/<N>` / `台账：#N` 形态，
            #     取**首个**）→ 仍取不到 ⇒ 告警、不早退。取到号后**直接**判 `closed ∧ not_planned`
            #     ∧ 有承接台账（这才是本守卫真正要判的）。
            if [ -n "${CNB_PULL_REQUEST_IID:-}" ] && command -v cnb >/dev/null 2>&1; then
              _f308_rep="${CNB_REPO_SLUG:-i.o/x}"
              _f308_body=""
              _f308_prjson="$(cnb pulls get-pull --repo "$_f308_rep" --number "$CNB_PULL_REQUEST_IID" -v 2>/dev/null | tr -d '\r')"
              #   取 PR 正文：`-v` 原始 JSON 的 `body:` 多为字面量多行块（非 JSON 转义），直接整段留用做
              #   正则抽取即可（不解析 JSON 结构，避免平台封套形态漂移；见 qg-ledger-resolve 同款坑）。
              _f308_body="$_f308_prjson"
              #   ① 独立取数：PR 正文 `QG-Ledger: <N>` marker **原值**（**不经** qg_resolve_ledger 的 closed 过滤）。
              _f308_led="$(printf '%s' "$_f308_body" | LC_ALL=C grep -oE 'QG-Ledger:[[:space:]]*[0-9]{1,6}' | head -1 | grep -oE '[0-9]+')"
              #   ② 回落：PR 正文台账链接（`issues/<N>` 或 `台账：#N`）取首个。**只作取数线索、不作裁决依据**。
              if [ -z "$_f308_led" ]; then
                _f308_led="$(printf '%s' "$_f308_body" | tr -d '*`' \
                  | LC_ALL=C grep -oE 'issues/[0-9]{1,6}|(台账|本任务台账|单任务台账|本单)[：: ]{0,3}#[0-9]{1,6}' \
                  | LC_ALL=C grep -oE '[0-9]{1,6}' | head -1)"
              fi
              printf '%s' "$_f308_led" | LC_ALL=C grep -qE '^[0-9]+$' || _f308_led=""
              _f308_hit=""
              if [ -n "$_f308_led" ]; then
                #   取数须 `-v`：CLI 摘要只印 `state`、**不印 `state_reason`**（实测），而裁决态判据
                #   同时依赖二者；故按原始 JSON 取 `"state"` / `"state_reason"`（容忍引号与空白形态）。
                _f308_meta="$(cnb issues get --repo "$_f308_rep" --number "$_f308_led" -v 2>/dev/null | tr -d '\r')"
                _f308_st="$(printf '%s' "$_f308_meta" | LC_ALL=C grep -m1 -oE '"state"[[:space:]]*:[[:space:]]*"[a-z_]+"' | grep -oE '[a-z_]+"?$' | tr -d '"')"
                _f308_rs="$(printf '%s' "$_f308_meta" | LC_ALL=C grep -m1 -oE '"state_reason"[[:space:]]*:[[:space:]]*"[a-z_]+"' | grep -oE '[a-z_]+"?$' | tr -d '"')"
                if [ "$_f308_st" = "closed" ] && [ "$_f308_rs" = "not_planned" ] \
                   && printf '%s' "$_f308_meta" | LC_ALL=C grep -qE '转出[[:space:]]*#[0-9]+|另立台账[[:space:]]*#[0-9]+'; then
                  _f308_hit="ledger-closed-not-planned-with-successor"
                fi
              else
                echo "⚠️ F-308a 告警：PR 正文无 QG-Ledger 行 / 台账号取不到 ⇒ 不早退（照常自愈，不静默判「已终局」）"
              fi
              if [ -n "$_f308_hit" ]; then
                echo "🛑 F-308a：本 PR（台账 #$_f308_led）已终局裁决（换方案转出 · $_f308_hit）⇒ 不拉起承接方追加修复轮"
                printf '❌ 终局裁决已冻结（F-308a）：台账 #%s state=closed(not_planned) 且有换方案承接台账 ⇒ 跳过工部尚书自愈\n' "$_f308_led" > /workspace/qg-裁决冻结.txt
              fi
            fi
            echo "$CNB_BUILD_FAILED_MSG" > /workspace/CNB_BUILD_FAILED_MSG.txt 2>/dev/null || true
            echo "CNB_BUILD_FAILED_STAGE_NAME >>>"
            echo "$CNB_BUILD_FAILED_STAGE_NAME" > /workspace/CNB_BUILD_FAILED_STAGE_NAME.txt 2>/dev/null || true
            echo "failStages 已触发（PR 质量门流水线某 stage 失败），失败 stage=$CNB_BUILD_FAILED_STAGE_NAME"
            echo "--- 以下为质量门 qg-*.txt 内容（工部请优先读此定位缺陷）---"
            # P2-2 修复：不在此转储 /workspace/qg-熔断.txt——failStages 顺序为「转储 → 熔断判定 → 工部自愈」，
            #   转储先跑、那时熔断文件尚未生成，该行恒空（死行）。熔断全文由紧随其后的「自愈熔断判定」stage
            #   自行 cat 输出（已覆盖），此处只需转储质量门三件套结论。
            # ★ 失败码入转储（#TASK-QG-CHANNEL-FAULT-20261004-01）：`qg-失败码.txt` 是 gate 产出的**机制/内容分流契约**
            #   （`MG-*` 门未跑出结论 / `CN-*` 门判否 / `PASS`），供工部自愈**先分流再动手**——缺此则机制故障
            #   被淹没进内容缺陷自愈（本单 12 轮空转的成因），故与 qg 三件套**同位转储**。
            # ★ GFM 表行门结论入转储（AC-2 · 台账 #616）：与冲突门同位——判红时工部可直接取命中行数定位。
            # ★ 产物守卫结论入转储（#TASK-QG-ARTIFACT-GUARD-20261004-01 P1-2 · 门下二轮封驳）：
            #   守卫自述「qg-产物.txt 供工部自愈定位」，但原清单不含它 ⇒ 判红时工部只能去翻构建日志，
            #   「自述目的」与「可定位面」背离。故与其余结论**同位转储**（命中清单直接可见，免二次取数）。
            for f in /workspace/qg-失败码.txt /workspace/qg-产物.rc /workspace/qg-产物.txt /workspace/qg-表行.rc /workspace/qg-表行.txt /workspace/qg-体量.rc /workspace/qg-体量.txt /workspace/qg-刑部.txt /workspace/qg-门下.txt; do
              echo "### $f"
              cat "$f" 2>/dev/null || echo "(文件不存在)"
              echo ""
            done
        # ---- 自愈环·非收敛熔断判定（#TASK-QG-CIRCUITBREAKER-20260910-01）----
        #   为什么：failStages → push → 新 CI → gate 再红 → 再自愈 是无界环，必须配「阈值 + 熔断 + 升级出口」
        #   三件套（circuit breaker）。判据（任一命中即熔断）：① 本分支自愈轮次 ≥ QG_MAX_SELFHEAL_ROUNDS（默认 3）——
        #   轮次数 = **分段** `^QG-Fingerprint:` 尾行数（A3 强制、纯 git 可读、外部/人工 commit 不可能携带）——
        #   分段语义见下「① 自愈轮次」块（F-134：以最近 `^QG-Reset:` 归零 commit 为基线 ref，换方案后归零；无留痕时=累计），
        #   `[部] fix:` commit 数仅作一致性告警**不参与取大**（防 over-count 误熔断常规 PR）；
        #   ② 连续 2 轮同族缺陷：上一轮与本轮 qg 缺陷号集合**互含（缺陷集未增长）**才判同族——任一侧有新增即视为有实质进展、放行自愈（防首轮即误熔断）；
        #   ③ 本分支 error 构建数——**仅留痕、不参与熔断**（PR 不可信事件令牌缺 repo-cnb-history:r，
        #      该维实测恒失效/恒 0，不得作为熔断依据；单源口径见 stage 内注释）。
        #   熔断动作：写 /workspace/qg-熔断.txt → 跳过「工部尚书自愈」（该 stage 带 if 守卫）→ 升级出口拉起中书令。
        #   升级出口（两级，均为 api_trigger/评论、不吃 PR 评论配额）：
        #     a) `cnb build start-build --event api_trigger ... NPC_ROLE=中书令`（PR 事件令牌缺 repo-cnb-trigger:rw 时可能 403，
        #        best-effort 尝试）；
        #     b) api_trigger 不可用则**回落评论**（不可信事件仍有 repo-issue:rw / repo-notes:rw）——有台账号发台账
        #        （守 ≥90 滚动续接 §6.4C）、无台账号发 PR；均附 `@i.o/x(中书令)` 触发其裁决。
        #        出口 b **不绑定 PR 撞线产物**（旧实现只在 TARGET=ledger 才有台账号 → <90 常态下恒不可达）。
        - name: 自愈熔断判定
          script: |
            set +e
            echo "===== 自愈环·非收敛熔断判定（#TASK-QG-CIRCUITBREAKER-20260910-01）====="
            # ★ F-308a 守卫**前置**（#TASK-FUSE-AFTER-FREEZE-20261006-01 · 熔断升级出口「终局裁决后重复投递」收口）：
            #   为什么：终局裁决冻结哨兵由**上一 stage**（`转储失败信息`·F-308a 段）在「台账 closed·not_planned
            #   ∧ 有换方案承接台账」时写入；而本 stage 原先**不读**该哨兵 ⇒ 已裁决的分支若再产生一次失败 CI，
            #   本 stage 照常计轮（分段指纹 ≥ 阈值）⇒ TRIP ⇒ 走升级出口 a/b，把**已裁决过的旧单**再次投给中书令
            #   （#566 实录：05:39Z 终局裁决 → 05:53Z 又一条「熔断升级 · 换方案请求」送达同一台账）。
            #   方向契约（fail-closed · 与 F-308a 判据本体同向）：哨兵**在位** ⇒ 早退（不写 qg-熔断.txt、不发
            #   升级出口）；哨兵**取不到**（文件不存在）⇒ **照常判定、照常升级**，禁据此静默早退
            #   （「误停升级」比「重复投递」更危险）。
            if [ -f /workspace/qg-裁决冻结.txt ]; then
              echo "🛑 F-308a 前置守卫：/workspace/qg-裁决冻结.txt 在位（本单已终局裁决）⇒ 不写 qg-熔断.txt、不发升级出口 a/b，本 stage 早退"
              echo "   哨兵首行：$(head -1 /workspace/qg-裁决冻结.txt 2>/dev/null)"
              exit 0
            fi
            BASE="${CNB_DEFAULT_BRANCH:-main}"
            BRANCH="${CNB_PULL_REQUEST_BRANCH:-${CNB_BRANCH:-}}"
            REPO="${CNB_REPO_SLUG:-i.o/x}"
            PR="${CNB_PULL_REQUEST_IID:-}"
            # 台账号解析（P0-2 / P1-3 修复）：**单一事实源 = 前置「评论撞线守卫」stage 的产物**
            #   /workspace/qg-留痕目标.txt 的 `ledger=<N>`（守卫已做「PR 正文动态解析 + env 兜底 + 不一致告警」）。
            #   旧实现熔断 stage 另起一套只读 env QG_LEDGER_IID，而该 env 默认空 → LEDGER 恒空 → 出口 b 恒不执行
            #   （熔断后无任何升级动作、静默停摆）。现统一读共享文件，env 仅作文件缺失时的兜底。
            # ★ P1-1 修复（#TASK-QG-CIRCUITBREAKER-20260910-01 封驳）：守卫产物**始终**带 `ledger=<N>`
            #   （解析失败写哨兵 `ledger=none`，不臆造）；此处只认纯数字，`none`/缺失一律视为「无台账」，
            #   下游出口 b 随之回落 PR 评论（不再因 LEDGER 恒空而两出口全灭）。
            LEDGER="$(grep -oE 'ledger=[0-9]+' /workspace/qg-留痕目标.txt 2>/dev/null | head -1 | cut -d= -f2)"
            printf '%s' "$LEDGER" | grep -qE '^[0-9]+$' || LEDGER="${QG_LEDGER_IID:-}"
            printf '%s' "$LEDGER" | grep -qE '^[0-9]+$' || LEDGER=""
            THRESH_ROUNDS="${QG_MAX_SELFHEAL_ROUNDS:-3}"
            THRESH_ERRORS="${QG_MAX_ERROR_ROUNDS:-3}"
            case "$THRESH_ROUNDS" in *[!0-9]*|'') THRESH_ROUNDS=3 ;; esac
            case "$THRESH_ERRORS" in *[!0-9]*|'') THRESH_ERRORS=3 ;; esac

            # ① 自愈轮次：数本 PR 分支上工部自愈 commit 的**机器可读指纹尾行** `^QG-Fingerprint:`。
            #    判据修复（#TASK-QG-CIRCUITBREAKER-20260910-01 修复 · 刑部 P1-1 / 门下 P1-1 实证）：
            #    旧实现 `grep -cE '质量门|自愈|CI 修复|熔断'` 用自由文本关键词计数，**双向失真**——
            #      (a) over-count：feature commit 含「质量门/熔断」被误计 1 轮（不该熔却先扣轮）；
            #      (b) under-count（更致命）：A3 强制格式 `[工部] fix: #TASK-<任务号> <说明>` 已**明令禁止**「第 N 轮」过程叙述，
            #          合规自愈 commit 可完全不含上述关键词 → 计数恒 0 → **永不熔断**。
            #    改用 A3 已强制写入的确定性标记尾行（同一机制自产、纯 git 可读、不依赖额外令牌权限）。
            #    基线解析：优先 origin/<默认分支>，缺失则用 merge-base（防 ref 未 fetch 时信号静默失效）
            BASE_REF="origin/${BASE}"
            git rev-parse --verify -q "$BASE_REF" >/dev/null 2>&1 || BASE_REF="$(git merge-base HEAD "$BASE" 2>/dev/null)"
            #   判据修复（#TASK-QG-CIRCUITBREAKER-20260910-01 修复 · 刑部 P1-1 / 门下 P1-1 实证）：
            #     轮次数**只认自愈环自产的机器可读信号**，与"人工/常规修复轮"彻底解耦。
            #     · 自愈轮次 = 本分支上 `^QG-Fingerprint:` 尾行数（**分段**口径 · F-134 起以最近 `^QG-Reset:` 归零
            #       commit 为基线；唯一判据源＝下方 `#<<BREAKER_CNT_SH … BREAKER_CNT_SH>>` 哨兵块，本行不复述数值）；
            #       A3 强制每条自愈 commit 携带该行，与轮次一一对应，**外部/人工 commit 不可能带**→ 天然不可 over-count）；
            #     · `HEAL_COMMITS`（`^\[<部>\] fix:` subject 数）**降级为一致性告警**：
            #       它会把"初始实现 commit / 常规 bugfix commit"一并计入（本 PR 实证：HEAL=5 而真自愈仅 3），
            #       若参与取大 → **任何含 ≥3 条 `[部] fix:` 的常规 PR 在首次质量门失败时即被误熔断、跳过自愈**
            #       （与 A1「只加上限、不删既有自愈能力」相悖，刑部/门下隔离探针均复现）。
            #     · 不一致只提示"有自愈 commit 漏写指纹尾行"，**不抬升轮次**（漏写由 A3 规范 + 本告警收敛）。
            #     · `PREV_FP` 取**最近一条带指纹的 commit**（非 HEAD），HEAD 无指纹不再使同族判据失效。
            HEAL_COMMITS=0
            BASE_OK="no"
            if [ -n "$BASE_REF" ] && git rev-parse --verify -q "$BASE_REF" >/dev/null 2>&1; then
              BASE_OK="yes"
              # 前缀**泛化为任意部**（`[兵部]/[工部]/[礼部]…`）——同一 failStages 服务各部的 PR（本 PR 自身即 `[兵部] fix:`）。
              # 仅用于一致性告警，**不参与轮次计数**（见上）。
              HEAL_COMMITS="$(git log --format=%s "${BASE_REF}..HEAD" 2>/dev/null | grep -cE '^\[[^]]+\][[:space:]]*fix:')"
              printf '%s' "$HEAL_COMMITS" | grep -qE '^[0-9]+$' || HEAL_COMMITS=0
            fi
            FP_LINES=0
            ROUNDS=0
            CNT_BASE="$BASE_REF"
            SEAL_OK="no"
            if [ "$BASE_OK" = "yes" ]; then
              #   ★ F-134（#TASK-BREAKER-RESET-20260914-01 · 方案 A 分段计轮）：
              #     原口径 = `BASE_REF..HEAD` 全部指纹尾行数 ⇒ **只增不减**（分支不可变历史）⇒ 换方案轮按
              #     §8 护栏② 归零后该值仍恒 ≥ 阈值 → 熔断永久有效、自愈环被 `if` 守卫永久跳过
              #     （#317 §六 F-134 实录）。改**分段**：以「最近一次换方案归零 commit」（**任意行**以 `^QG-Reset:` 起头，
              #     D14 既定约定）为基线 ref，只数 `归零基线..HEAD` ⇒ 换方案后自然归零；
              #     **无归零留痕 ⇒ 基线＝BASE_REF，与旧口径逐字一致**（不劣化常态 PR）。
              #     写入方仅限换方案轮（裁决落地时携带 `QG-Reset:`）；**自愈 commit 禁携带**（否则熔断器自失效，
              #     矩阵 C14-⑩ 有反向守卫断言）。判据仍纯只读（无 push/fetch/写权）。
              #     判据源**原样抽取**供矩阵 C14-⑨ 纯夹具复跑（sentinel 内即唯一事实源，不复制口径）。
              #<<BREAKER_CNT_SH
              CNT_BASE="$BASE_REF"
              SEAL_OK="no"
              #   ★ F-308b（#433 并入）· 归属前置：本单任务号**优先取自分支名**（`feat/TASK-<号>-*` 为标准形态，
              #     不随提交历史变动）；分支名取不到时回落**本单最早一个带号 commit 的 subject**。
              #     该号同时服务：① 归零锚归属过滤（本方止下款）；② 指纹计轮归属过滤（本方止下下款）。
              #   ★ P2-1 修复（F-308b 同族 · 归属过滤**反向欠计**）：原正则 `TASK-[A-Z0-9]+(-[A-Z0-9]+)*`
              #     贪婪吞掉分支名**后缀段**（`-R4` / `-FU` / `-S23` 等大写后缀，真实远端分支即有此形态，
              #     如 `feat/TASK-SELFHEAL-MECH-20260912-01-R4`）；而 commit subject 常写**主号**
              #     （`#TASK-GROWTH-20261001-01`，两种写法在同一任务历史中并存）⇒ `index(subj, own)==0`
              #     ⇒ 本单自产指纹被他单化剔除 ⇒ **轮次欠计、熔断失效**（与其注释自述的「防欠计」方向相反）。
              #     故取**任务号核心**（`TASK-<名>-<日期>-<序>` 三段式；末尾大写后缀段剥离）作归属号，
              #     并于比对时**双向前缀匹配**（own 与 subject 号互为前缀即视为本单）——两种写法兼容。
              OWN_TASK="$(printf '%s' "${BRANCH:-}" | LC_ALL=C grep -oE 'TASK-[A-Z0-9]+(-[A-Z0-9]+)*' | head -1)"
              if [ -z "$OWN_TASK" ]; then
                OWN_TASK="$(git log --reverse --format=%s "${BASE_REF}..HEAD" 2>/dev/null | LC_ALL=C grep -m1 -oE 'TASK-[A-Z0-9]+(-[A-Z0-9]+)*')"
              fi
              #   核心化：`TASK-<名>-<YYYYMMDD>-<2位序>` 为规范号（日期段＝8 位数字、序段＝2 位数字）；
              #   其后追加的大写段（如 `-R4`/`-S23`）为**轮次/任务后缀**、非任务号本体 ⇒ 截除。
              #   正则不匹配（非规范号）⇒ 保留原值（不劣化）。
              _own_core="$(printf '%s' "${OWN_TASK:-}" \
                | LC_ALL=C grep -oE '^TASK-[A-Z0-9]+(-[A-Z0-9]+)?-[0-9]{8}-[0-9]{2}')"
              if [ -n "$_own_core" ]; then OWN_TASK="$_own_core"; fi
              SEAL_SHA="$(git log --format='%x1e%H%x1f%s%x1f%B' "${BASE_REF}..HEAD" 2>/dev/null \
                | awk -v RS='\036' -F'\037' -v own="${OWN_TASK:-}" '
                    NF>=3 {
                      subj=$2; ok=0
                      # 归属过滤：subject 带他单号者，其 QG-Reset 不得作本单归零锚（防 under-count）。
                      #   ★ P2-1：**双向前缀匹配**——subject 号与本单号互为前缀即视为本单（兼容
                      #     「分支名带后缀 / subject 写主号」两种真实写法），仍防他单误锚。
                      if (own != "") {
                        if (index(subj, own) > 0) ok=1
                        else if (match(subj, /TASK-[A-Z0-9]+(-[A-Z0-9]+)*/)) {
                          st=substr(subj, RSTART, RLENGTH)
                          if (index(st, own)==1 || index(own, st)==1) ok=1; else ok=0
                        }
                        else ok=1
                      }
                      else ok=1
                      n=split($3,L,"\n")
                      for(i=1;i<=n;i++) if (L[i] ~ /^QG-Reset:/) { if (ok) { s=$1; gsub(/[^0-9a-f]/,"",s); if (length(s)>=7) { print s; exit } } }
                    }')"
              if [ -n "$SEAL_SHA" ] && git rev-parse --verify -q "${SEAL_SHA}^{commit}" >/dev/null 2>&1; then
                CNT_BASE="$SEAL_SHA"; SEAL_OK="yes"
              else
                SEAL_SHA=""
              fi
              FP_LINES="$(git log --format=%B "${BASE_REF}..HEAD" 2>/dev/null | grep -c '^QG-Fingerprint:')"
              printf '%s' "$FP_LINES" | grep -qE '^[0-9]+$' || FP_LINES=0
              #   ★ F-308b（#433 并入）：**单号归属过滤**——他单 `QG-Fingerprint:` 尾行可经 merge 进入本分支
              #     （与本单首 commit 的 `QG-Reset:` 同段），按可达性计数即 **over-count**（他单指纹计入本单轮次）；
              #     方向相反的 **under-count** 同源：分段归零锚被他单 `QG-Reset:` 锚定 ⇒ 本单真实轮次被少算。
              #     故按**本分支任务号**过滤：任务号取自**本单首个 commit subject**（分支起点即本单首 commit；
              #     反引号包裹 `TASK-…` 一律剥离后比对），与他单号不同者不计入。
              #     门槛：取不到任务号（无 `#TASK-` 形态）⇒ **不过滤**（fail-open 到旧口径，不静默归零——防把
              #     「无法归属」误当「全是他单」而放行自愈环无界空转）；同时留痕标 `归属过滤=跳过`。
              rp_count_fp() {   # $1=range → 按归属过滤后计数（无任务号 ⇒ 回落旧口径）
                if [ -z "${OWN_TASK:-}" ]; then
                  git log --format=%B "$1" 2>/dev/null | grep -c '^QG-Fingerprint:'
                  return
                fi
                git log --format='%x1e%H%x1f%s%x1f%B' "$1" 2>/dev/null \
                  | awk -v RS='\036' -F'\037' -v own="$OWN_TASK" '
                      NF>=2 {
                        subj=$2
                        # 归属：subject 含本单任务号 ⇒ 本单；含其他 `TASK-…` 号 ⇒ 他单（剔除）；
                        #       subject 无任何任务号 ⇒ 无法归属、保守计入（防欠计 → 熔断失效）
                        if (subj !~ /TASK-/) { n=split($3,L,"\n"); for(i=1;i<=n;i++) if (L[i] ~ /^QG-Fingerprint:/) c++; next }
                        #   ★ P2-1：**双向前缀匹配**（兼容「分支名带后缀 / subject 写主号」两种真实写法）
                        if (index(subj, own) > 0) { n=split($3,L,"\n"); for(i=1;i<=n;i++) if (L[i] ~ /^QG-Fingerprint:/) c++; next }
                        if (match(subj, /TASK-[A-Z0-9]+(-[A-Z0-9]+)*/)) {
                          st=substr(subj, RSTART, RLENGTH)
                          if (index(st, own)==1 || index(own, st)==1) { n=split($3,L,"\n"); for(i=1;i<=n;i++) if (L[i] ~ /^QG-Fingerprint:/) c++ }
                        }
                      }
                      END { print c+0 }'
              }
              ROUNDS="$(rp_count_fp "${CNT_BASE}..HEAD")"
              printf '%s' "$ROUNDS" | grep -qE '^[0-9]+$' || ROUNDS=0
              if [ -n "${OWN_TASK:-}" ]; then OWN_NOTE="$OWN_TASK"; else OWN_NOTE="归属过滤=跳过（本段无 TASK- 号 ⇒ 回落旧口径）"; fi
              echo "分段归零留痕=$SEAL_OK   分段基线=$CNT_BASE   轮次=$ROUNDS   累计指纹行数=$FP_LINES   归属=$OWN_NOTE"
              #BREAKER_CNT_SH>>
              if [ "$HEAL_COMMITS" -ne "$FP_LINES" ]; then
                echo "ℹ️ 轮次信号口径差异（仅告警、不影响熔断判定）：\\[部\\] fix: commit 数=$HEAL_COMMITS ≠ 累计指纹行数=$FP_LINES"
                echo "   说明：前者含初始实现/常规 bugfix commit（非自愈轮），**故本轮次以分段指纹行数 $ROUNDS 为准**；差额提示有自愈 commit 漏写 QG-Fingerprint 尾行（按 A3 补齐）。"
              fi
            fi
            printf '%s' "$ROUNDS" | grep -qE '^[0-9]+$' || ROUNDS=0

            # ② 缺陷指纹：本轮 qg-刑部/门下 中的 P 编号集合（同族缺陷判定）
            FP="$(cat /workspace/qg-刑部.txt /workspace/qg-门下.txt 2>/dev/null | grep -oE 'P[0-9]+-[0-9]+' | sort -u | tr '\n' ',' | sed 's/,$//')"
            # ★ F-312（#TASK-BREAKER-FPOWN-20261003-01）：**本消费点加本单任务号 `own` 归属过滤**——
            #   复用**同一 `OWN_TASK`**（上面哨兵块内已解析，禁另立第二套）。
            #   为什么：他单 `QG-Fingerprint:` 尾行可经**跨单 merge** 进入本单分段（F-308b 只堵了 `ROUNDS` /
            #   分段归零锚（`CNT_BASE`+`SEAL_OK`/`SEAL_SHA`）两个计数点、**漏了本同族比对点**）——其值与本轮
            #   缺陷号**偶然全等**即集合互含 ⇒ **假阳 TRIPPED**、`工部尚书自愈` 被 `if` 守卫跳过
            #   （**自愈静默失效，比不拦更危险**）。
            #   ★ 覆盖边界据实（**非**「全段唯一」，仓内并存同族未过滤消费点，F-135⑦ 禁无边界全称句）：
            #     本单只收口**熔断 stage 判定面内**的本比对点；**不覆盖**（现跑存证、另立 follow-up）：
            #       (i) 本 stage `FP_LINES`（`git log ... | grep -c`，仅一致性告警、**不参与熔断判定**）；
            #       (ii) 心跳第③/⑦维「计轮判据」（日/夜两段逐字同构，仍为未过滤 `grep -c`）——
            #            跨单 merge 下与已过滤的 `ROUNDS` 取值不一致，属同族「口径漂移」，见 CHANGELOG/台账 #445 登记的 follow-up。
            #   ★ 归属口径与 `rp_count_fp` **近似同源、非逐字等同**（据实标注，F-135⑦）：`rp_count_fp` 首支为
            #     `subj !~ /TASK-/`（**完全无** "TASK-" 才 fail-open）；本段 `else ok=1` 兜底还覆盖
            #     **含 "TASK-" 但正则 `TASK-[A-Z0-9]+(-[A-Z0-9]+)*` 不匹配的畸形 subject** ⇒ 该形态下两处取值分叉
            #     （现跑：`ROUNDS=0` 而 `PREV_FP` 计）。保持分叉是**有意**的——本点怕假阳（见下方向据实），
            #     但注释**禁**以「逐字同源」落笔。
            #   ★ 方向据实（两处 fail-* 方向相反、各有据）：`rp_count_fp` 怕**欠计**⇒无号时 fail-open 不过滤；
            #   本消费点怕**假阳**（假同族 ⇒ 误熔断）⇒ **取不到本单指纹即取空**、判「不同族」放行自愈，
            #   **禁回落「全段首条」**（回落即复发本缺陷）。故 `OWN_TASK` 不可得时本值保持空。
            #   边界：同族判据是**兜底维**（主力是 ① 指纹轮次上限）；本处放行不削弱 ①，故取空安全。
            #   ★ 未收口形态据实（P2 边界标注）：他单 commit subject **完全无任务号**（无 "TASK-"）时，本点仍按
            #     `else ok=1` **保守计入本单** ⇒ 该形态下假阳仍可复发（与 `rp_count_fp` 同向的 fail-open 取舍）。
            #     史实：携独立 `^QG-Fingerprint:` 行且 subject 无 TASK 字样的 commit 有 2 笔（均为 `[中书令] fix:`
            #     `QG-Fingerprint: E-1` 形态）；C-OWN-PREV 夹具 (c) 机械锁定该边界。
            # 上一轮指纹：最近一个**本单**自愈 commit 的机器可读尾行（工部自愈提交时写入）
            PREV_FP=""
            if [ "$BASE_OK" = "yes" ]; then
              # P1-2 修复：取**最近一条带指纹的 commit**（按时间倒序扫描全部 %B，取首个命中），
              #   不再用 `git log -1`（HEAD 无指纹时 PREV_FP 恒空 → 同族判据静默失效）。
              #   ★ F-134 分段一致性：范围同计轮段（`CNT_BASE..HEAD`）——换方案后「上一轮指纹」不得跨归零点取，
              #     否则同族判据拿换方案前的旧缺陷集与新段比对（假同族/假放行）。
              #   ★ F-312：再加**本单任务号归属过滤**（归属号＝上述同一 `OWN_TASK`）——只认本单自产指纹，
              #     他单指纹（经 merge 带入）不参与比对；无本单指纹 ⇒ 空 ⇒ 不同族。
              #     ★ 覆盖边界：他单 subject **完全无任务号** 或 **含 "TASK-" 但为畸形号**时，下方 `else ok=1`
              #       保守计入本单 ⇒ 该形态假阳仍可复发（据实标注，见上方①区覆盖边界；夹具 (c) 锁定）。
              if [ -n "${OWN_TASK:-}" ]; then
                PREV_FP="$(git log --format='%x1e%H%x1f%s%x1f%B' "${CNT_BASE}..HEAD" 2>/dev/null \
                  | awk -v RS='\036' -F'\037' -v own="$OWN_TASK" '
                      NF>=2 {
                        subj=$2; ok=0
                        # 归属：与 rp_count_fp 近似同源（双向前缀匹配；**无号/畸形号 subject 保守计入**）。
                        #   ★ 据实：非「逐字同源」——rp_count_fp 首支为 `subj !~ /TASK-/`，本 `else ok=1` 兜底
                        #     额外覆盖「含 TASK- 但正则不匹配的畸形号」⇒ 两处取值分叉（有意：本点怕假阳）。
                        if (index(subj, own) > 0) ok=1
                        else if (match(subj, /TASK-[A-Z0-9]+(-[A-Z0-9]+)*/)) {
                          st=substr(subj, RSTART, RLENGTH)
                          if (index(st, own)==1 || index(own, st)==1) ok=1
                        } else ok=1
                        if (!ok) next
                        n=split($3,L,"\n")
                        for(i=1;i<=n;i++) if (L[i] ~ /^QG-Fingerprint:/) { print L[i]; exit }
                      }' \
                  | sed 's/^QG-Fingerprint:[[:space:]]*//' | tr -d ' ')"
              fi
            fi
            # 同族缺陷判据（**P0-1 修复 · #TASK-QG-CIRCUITBREAKER-20260910-01 封驳 · 兵部据 CI 现场日志自纠**）：
            #   原 A5b/A10 版判据 = 上轮指纹集合 ⊆ 本轮指纹集合（集合包含）。
            #   ★ 该判据**方向反了**：质量门每轮必然挑出新 P 编号（现场实证：
            #     上轮=[P1-1,P2-3] ⊆ 本轮=[P0-1,P1-1~P1-4,P2-1~P2-3] → 同族=yes → **首轮即 TRIPPED**），
            #     "上轮缺陷仍在"是修复过程中的**常态**（旧缺陷未被同批处理完、又新增更多），
            #     把它当"原地打转"= 把常态自愈**永久关闭**（与 A1「只加上限、不删既有自愈能力」相悖）。
            #   现收紧为**未消缺陷占比判据**：仅当「上轮 ⊆ 本轮 **且** 本轮 ⊆ 上轮」（缺陷集合**未增长**，
            #     即两轮面对完全同一批缺陷、无任何实质进展）才判同族；缺陷集增长即有实质进展 → 放行自愈。
            #   （真正防"空转"的主力是 ① 指纹轮次上限；② 本维只兜"同一批缺陷反复出现、0 进展"的退化场景。）
            SAME_FAMILY="no"
            if [ -n "$PREV_FP" ] && [ "$PREV_FP" != "-" ] && [ -n "$FP" ]; then
              _prev="$(printf '%s' "$PREV_FP" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep -vE '^$' | sort -u)"
              _cur="$(printf '%s' "$FP" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep -vE '^$' | sort -u)"
              # 双向子集判定（POSIX 兼容——CNB 默认 `sh`(dash)，禁用 `<( )`/`[[ ]]` 等 bashism，否则 stage Syntax error 崩掉）
              _miss=""
              for _p in $_prev; do
                printf '%s\n' "$_cur" | grep -qxF "$_p" || _miss="$_miss $_p"
              done
              _extra=""
              for _q in $_cur; do
                printf '%s\n' "$_prev" | grep -qxF "$_q" || _extra="$_extra $_q"
              done
              if [ -n "$_prev" ] && [ -z "$_miss" ] && [ -z "$_extra" ]; then SAME_FAMILY="yes"; fi
              echo "同族判定：上轮=[$(printf '%s' "$_prev" | tr '\n' ',')] 本轮=[$(printf '%s' "$_cur" | tr '\n' ',')] 未消缺陷=[$(printf '%s' "$_miss" | tr '\n' ',')] 新增缺陷=[$(printf '%s' "$_extra" | tr '\n' ',')]"
              if [ -n "$_extra" ]; then echo "   → 本轮新增缺陷（有实质进展）→ 不判同族（防「首轮即误熔断」）"; fi
            fi

            # ③ 连续 error 轮次（best-effort：PR 不可信事件令牌可能无 repo-cnb-history:r，取不到记 0）
            #     粗粒度：统计本分支最近一页构建中 status=error 的条目数（平台 `--status` 过滤未生效，故自行计数）
            #   ★ P2-2 据实标注（#TASK-QG-CIRCUITBREAKER-20260910-01 封驳）：本判据在 PR 不可信事件下
            #     **实测恒失效**——`cnb build get-build-logs` 缺 `repo-cnb-history:r` 返 403（rc 仍为 0），
            #     且 `--status error` 过滤不生效 → `ERRORS` 恒 0。故本维**不参与实际熔断**（仅留痕），
            #     真正的熔断出口是 ①（指纹轮次）与 ②（同族缺陷）；待平台权限/过滤修复后再启用。
            ERRORS=0
            if command -v cnb >/dev/null 2>&1 && [ -n "$BRANCH" ]; then
              E="$(cnb build get-build-logs --repo "$REPO" --sourceRef "$BRANCH" --event pull_request --status error --page-size 100 -v 2>/dev/null \
                | tr -d '\r' | grep -oE '"status"[[:space:]]*:[[:space:]]*"error"' | wc -l | tr -d ' ')"
              printf '%s' "$E" | grep -qE '^[0-9]+$' && ERRORS="$E"
            fi

            ROUNDS_NOTE="轮次=$ROUNDS"
            if [ "$BASE_OK" != "yes" ]; then
              # P2-1 修复：基线段不可解析 ⇒ 轮次信号**不可用**，显式区分「无数据」与「0 轮」（旧实现静默记 0 且判 CLOSED、无告警）
              ROUNDS_NOTE="轮次=无数据（基线 ref 不可解析：origin/${BASE} 与 merge-base 均不可用）"
              echo "⚠️ 判据不可用：基线 ref 不可解析 → 自愈轮次与同族判据均无数据（**不等于 0 轮**，不据此放行）"
            fi
            echo "轮次统计：$ROUNDS_NOTE（阈值 $THRESH_ROUNDS · 口径=**分段**指纹尾行数（自愈轮次=$ROUNDS）· 累计指纹=$FP_LINES → 分段轮次=$ROUNDS；归零留痕=$SEAL_OK 基线=$CNT_BASE；[部] fix: commit 数=$HEAL_COMMITS 仅告警）· 本分支 error 构建=$ERRORS（阈值 $THRESH_ERRORS）"
            echo "缺陷指纹：本轮=[$FP] 上一轮=[$PREV_FP] 同族=$SAME_FAMILY"

            TRIP="no"; REASON=""
            if [ "$ROUNDS" -ge "$THRESH_ROUNDS" ]; then TRIP="yes"; REASON="自愈轮次 $ROUNDS ≥ 阈值 $THRESH_ROUNDS"; fi
            if [ "$TRIP" = "no" ] && [ "$SAME_FAMILY" = "yes" ]; then TRIP="yes"; REASON="连续 2 轮同族缺陷未消（缺陷集未增长：上轮 $PREV_FP ≡ 本轮 $FP）"; fi
            # 判据③（error 构建数）**不参与熔断**——三处口径单源化（#TASK-QG-CIRCUITBREAKER-20260910-01 封驳 · 门下 P1-1）：
            #   在 `pull_request`（不可信事件）令牌下 `cnb build get-build-logs` 缺 repo-cnb-history:r 返 403
            #   且 rc 仍为 0 → `ERRORS` 实测恒 0。旧实现「注释写仅留痕、代码却 TRIP、心跳又列为并列阈值」三处互斥，
            #   本次收敛为单源：**本维只打印留痕、一律不进 TRIP 条件**（真实出口=① 指纹轮次 ② 同族缺陷）。
            if [ "$ERRORS" -ge "$THRESH_ERRORS" ]; then
              echo "ℹ️ 留痕：本分支 error 构建 $ERRORS ≥ 阈值 $THRESH_ERRORS —— 该维**不参与熔断**（PR 事件下取数恒失效），仅记录。"
            fi

            {
              echo "熔断判定=$([ "$TRIP" = "yes" ] && echo TRIPPED || echo CLOSED)"
              echo "理由=${REASON:-未达阈值，放行自愈}"
              echo "自愈轮次=$ROUNDS（口径=分段指纹尾行数 · 累计 $FP_LINES · 归零留痕=$SEAL_OK 基线=$CNT_BASE；[部] fix: commit 数=$HEAL_COMMITS 仅作告警）  error轮次=$ERRORS  阈值=$THRESH_ROUNDS"
              echo "轮次判据可用=$BASE_OK"
              echo "缺陷指纹（本轮）=$FP"
              echo "缺陷指纹（上一轮）=$PREV_FP"
              echo "同族缺陷判定=$SAME_FAMILY（集合互含：上轮 ⊆ 本轮 且 本轮 ⊆ 上轮，缺陷集未增长）"
              echo "分支=$BRANCH  PR=#$PR"
            } > /workspace/qg-熔断-判定.txt

            if [ "$TRIP" != "yes" ]; then
              rm -f /workspace/qg-熔断.txt
              echo "✅ 判定=CLOSED（未达阈值）→ 工部尚书自愈照常执行"
              exit 0
            fi

            {
              echo "❌ 熔断：自愈环非收敛，已停止自动自愈（不再 push 修复 commit）"
              echo "理由：$REASON"
              echo "分支=$BRANCH  PR=#$PR  自愈轮次=$ROUNDS"
              echo "缺陷指纹=$FP"
              echo "---- qg-刑部.txt（首 20 行）----"
              head -20 /workspace/qg-刑部.txt 2>/dev/null || echo "(文件不存在)"
              echo "---- qg-门下.txt（首 20 行）----"
              head -20 /workspace/qg-门下.txt 2>/dev/null || echo "(文件不存在)"
              echo "升级出口：拉起中书令裁决换方案（§8 护栏②：同一任务封驳/自愈达阈值即换方案，禁死磕）"
            } > /workspace/qg-熔断.txt
            echo "🚨 判定=TRIPPED（$REASON）→ 已写 /workspace/qg-熔断.txt；跳过工部尚书自愈，改走升级出口"
            echo "---- /workspace/qg-熔断.txt 全文 ----"
            cat /workspace/qg-熔断.txt
            echo "-------------------------------------"

            BRIEF="【熔断升级 · 换方案请求】$REASON
            - 仓库：$REPO  分支：$BRANCH  PR：#$PR  台账：#${LEDGER:-未传}
            - 自愈轮次：$ROUNDS / 阈值 $THRESH_ROUNDS ；error 构建：$ERRORS
            - 缺陷指纹（本轮）：$FP ；上一轮：$PREV_FP
            - 历轮结论：/workspace/qg-刑部.txt + /workspace/qg-门下.txt（本构建 failStages 已转储至构建日志）
            - 请裁决：换方案（不再追加自动修复轮）；判据见 AGENTS.md §8 护栏② / §6.4C。
            - ★ 换方案落地硬要求（F-134 · 消费端判据的写入侧契约）：裁决若判定「换方案」，
              则**换方案落地 commit 必须携带 QG-Reset: <理由/单号> 行**（大小写敏感、独占一行；判据按任意行匹配，写入建议置于提交信息尾行，D14 约定）——
              该行是分段计轮的归零标记；**缺即视为换方案未落地**（判据侧仍按累计口径计轮 → F-134 症状不消）。
              写入方仅限换方案轮（中书令/承接方裁决落地）；**自愈 commit 禁携带**（否则熔断器结构性自失效）。
            - 熔断详情：/workspace/qg-熔断.txt"

            # ---- F2 触发源真伪自检（#TASK-QG-CIRCUITBREAKER-20260910-01 · 伪载荷已复发 3 次）----
            #   为什么：探针/自测曾以伪造 env（分支 feat/x、PR #999、台账未传）经升级出口把**伪载荷**投递
            #   真实台账（07:51 / 08:03 / 本日），裁决侧被迫每次三源交叉验真、且真实台账被污染。
            #   故在**发升级载荷之前**先自检触发源真伪：① 分支存在性（git ls-remote）② PR 存在性
            #   （cnb pulls get-pull）③ 阈值是否生产默认。任一不符 → **只落日志、不发评论/不派单**。
            SRC_OK="yes"; SRC_FAIL=""
            if [ -z "$BRANCH" ]; then
              SRC_OK="no"; SRC_FAIL="$SRC_FAIL 分支名未解析"
            else
              # 仅在「命令成功且返回空」时才判不存在（命令失败=不可判定，交 PR head.ref 交叉核验，
              #   防把网络/凭证异常误判为"分支不存在"而静默掐断真实升级）
              # 20s 低速超时用 git 内建参数（不依赖镜像是否带 `timeout` 命令，保可移植）
              _LS="$(git -c http.lowSpeedLimit=1 -c http.lowSpeedTime=20 ls-remote --heads origin "refs/heads/$BRANCH" 2>/dev/null)"; _LSRC=$?
              if [ "$_LSRC" -eq 0 ] && [ -z "$_LS" ]; then
                SRC_OK="no"; SRC_FAIL="$SRC_FAIL 分支不存在($BRANCH)"
              elif [ "$_LSRC" -ne 0 ]; then
                echo "ℹ️ 触发源自检：git ls-remote 不可用（rc=$_LSRC）→ 分支存在性以 PR head.ref 交叉核验"
              fi
            fi
            # ---- AC-4 兜底拦截（#TASK-ORCH-GOV-20260910-01）：**非 PR 事件** ----
            #   为什么：熔断升级只对「真实 PR 事件 + 可解析分支」有意义。探针/外部实例曾以伪造 env
            #   （分支 feat/x、PR #999、台账未传）经升级出口把**伪载荷**投递真实台账（已复发多次）。
            #   故在此**显式**加一道兜底：非 PR 事件（无 CNB_PULL_REQUEST_IID）→ 一律拦截
            #   （只落审计标记、不发评论/不派单），交心跳第③维兜底，防伪载荷污染真实台账。
            if [ -z "${CNB_PULL_REQUEST_IID:-}" ]; then
              SRC_OK="no"; SRC_FAIL="$SRC_FAIL 非 PR 事件（CNB_PULL_REQUEST_IID 缺失）"
            fi
            if [ -z "$PR" ] || ! command -v cnb >/dev/null 2>&1; then
              SRC_OK="no"; SRC_FAIL="$SRC_FAIL PR号未解析或 cnb 不可用"
            else
              _PRJSON="$(cnb pulls get-pull --repo "$REPO" --number "$PR" -v 2>/dev/null)"
              if printf '%s' "$_PRJSON" | grep -qE '"status"[[:space:]]*:[[:space:]]*"?200'; then
                _PRREF="$(printf '%s' "$_PRJSON" | tr -d '\n' | grep -oE '"head":[[:space:]]*\{[^}]*' | grep -oE 'refs/heads/[^"]+' | head -1)"
                if [ -n "$BRANCH" ] && [ -n "$_PRREF" ] && [ "$_PRREF" != "refs/heads/$BRANCH" ]; then
                  SRC_OK="no"; SRC_FAIL="$SRC_FAIL PR#$PR 的 head 分支(${_PRREF#refs/heads/})≠声明分支($BRANCH)"
                fi
              elif printf '%s' "$_PRJSON" | grep -qiE '"status"[[:space:]]*:[[:space:]]*"?404|pull not found'; then
                # 仅在**显式判定不存在**（404 / pull not found）时拦截；权限/网络异常=不可判定，
                #   只告警不拦截（防把"读不到"误判为"不存在"而静默掐断真实升级）
                SRC_OK="no"; SRC_FAIL="$SRC_FAIL PR不存在(#$PR)"
              else
                echo "ℹ️ 触发源自检：PR #$PR 存在性不可判定（响应非 200 且非 404，疑权限/网络）→ 仅告警、不拦截"
              fi
            fi
            # ★ AC-4（#TASK-ORCH-GOV-20260910-01）：**仅以真正参与熔断的阈值 `THRESH_ROUNDS` 判拦截**。
            #   旧实现把 `THRESH_ERRORS` 也列为拦截条件，但该维已明确「仅留痕、不参与熔断」（见上方
            #   「留痕：本分支 error 构建」只 echo、从不进 TRIP）→ 运维为这一**已无熔断语义**的旋钮显式赋值
            #   （如 QG_MAX_ERROR_ROUNDS=2）即被本自检判为"非生产默认"而**拦截真实升级** → 该拦未拦的反而拦了，
            #   比不拦更危险（=熔断后静默停摆）。现收敛：拦截只看 THRESH_ROUNDS；THRESH_ERRORS 仅随行留痕。
            # ---- 对象有效性前置（#TASK-HB-GUARD-MECH-20260911-01 AC-3 · F-87）----
            #   为什么：「CI failed, please fix」**类载荷**（含本 stage 出口 a/b 的熔断升级载荷）曾对**已合并 PR**投递迟到载荷：
            #   PR#245 实录——其已被取代的旧 head `108bfff` 的构建迟到约 70min 才判 gate 红 → 发评拉起中书令，
            #   而对象 PR 19:46:21Z 已 merged（缺陷早由 `0a1cf35` 全绿收口）→ 调度方被迫核验空转一轮（承 F-55/F-62 家族）。
            #   故在**发载荷之前**加一道对象有效性前置（二进制两条，任一不符即拦截）：
            #     ① 对象 PR `state=open`；② 失败构建 sha == PR **实时** head（`head.sha`）。
            #   判据源：`cnb pulls get-pull --repo "$REPO" --number "$PR" -v`（本 stage 已取，复用 `$_PRJSON`，不额外请求）。
            #   失败构建 sha 取 `CNB_COMMIT`（平台内置 = 本流水线检出/受审 sha；缺失时回落 `git rev-parse HEAD`）。
            #   任一不符 → `SRC_OK=no` → 落入下方「升级出口未执行（只落日志、不发评论/不派单）」分支（与 F2 拦截同口径）。
            if [ "$SRC_OK" = "yes" ]; then
              _PRST="$(printf '%s' "$_PRJSON" | tr -d '\n' | grep -oE '"state"[[:space:]]*:[[:space:]]*"[a-z]+"' | head -1 | grep -oE '"[a-z]+"$' | tr -d '"')"
              _PRHEAD="$(printf '%s' "$_PRJSON" | tr -d '\n' | grep -oE '"head"[[:space:]]*:[[:space:]]*\{[^}]*' | grep -oE '"sha"[[:space:]]*:[[:space:]]*"[0-9a-f]{7,40}"' | head -1 | grep -oE '[0-9a-f]{7,40}')"
              _BUILDSHA="${CNB_COMMIT:-$(git rev-parse HEAD 2>/dev/null)}"
              if [ -n "$_PRST" ] && [ "$_PRST" != "open" ]; then
                SRC_OK="no"; SRC_FAIL="$SRC_FAIL 对象 PR#$PR 非 open（实测 state=$_PRST：已 merged/closed → 载荷到即失效）"
              fi
              if [ "$SRC_OK" = "yes" ] && [ -n "$_PRHEAD" ] && [ -n "$_BUILDSHA" ] && [ "$_PRHEAD" != "$_BUILDSHA" ]; then
                #   ★ POSIX 合规（#TASK-HB-GUARD-MECH-20260911-01 修复 · F-89）：**禁用 bash 子串展开
                #     `${var:0:8}`**——平台 stage `script` 由 `sh -e -c` 执行，本镜像 `/bin/sh -> dash`，
                #     dash 对 `${var:0:8}` **`-n` 语法检查通过、运行时却 `Bad substitution` 退出（rc=2）**
                #     → 整段熔断 stage 崩溃（本轮 CI 实录 `sh: 1: Bad substitution`）。
                #     改 POSIX 等价 `printf '%.8s'`（dash/bash 行为一致）。
                SRC_OK="no"; SRC_FAIL="$SRC_FAIL 失败构建 sha($(printf '%.8s' "$_BUILDSHA"))≠PR 实时 head($(printf '%.8s' "$_PRHEAD"))（快照已过期 → 载荷到即失效）"
              fi
              if [ "$SRC_OK" = "yes" ] && [ -z "$_PRST" ]; then
                echo "ℹ️ 对象有效性前置：PR state 不可判定（响应非 200/404）→ 仅告警、不拦截（与存在性自检同口径）"
              fi
            fi
            if [ "$THRESH_ROUNDS" != "3" ]; then
              # F-45④ 措辞据实：阈值被显式覆盖 ≠ 已确证是探针——它是「非生产默认运行」的**启发式**信号
              #   （覆盖环境/自测/探针均可能），据此**强制隔离**（default-deny）而非断言其身份；
              #   真实生产 failStages 不会覆盖阈值，故该启发式不误伤常态升级。
              SRC_OK="no"; SRC_FAIL="$SRC_FAIL 阈值被显式覆盖（非生产默认 $THRESH_ROUNDS/$THRESH_ERRORS → 按覆盖环境/自测隔离；拦截判据仅取 $THRESH_ROUNDS，error 维仅留痕）"
            fi
            echo "触发源真伪自检：结果=$SRC_OK${SRC_FAIL:+ 不符项=$SRC_FAIL}"

            # ---- F1 探针隔离（dry-run · #TASK-QG-CIRCUITBREAKER-20260910-01 · 伪载荷已复发 3 次）----
            #   为什么：探针必须能验证「熔断判定 + 升级出口」而**不产生外部副作用**。旧实现探针只能真发
            #   评论/真派单（或伪造 env 混入真实链路），是伪载荷污染真实台账的根因。故设 `QG_DRY_RUN=1`
            #   开关：升级出口（a 派单 / b 评论）**全部不执行**，只把将发出的载荷落日志，供探针/自测核验。
            DRY="${QG_DRY_RUN:-0}"
            case "$DRY" in 1|true|yes|on|TRUE|YES|ON) DRY="1" ;; *) DRY="0" ;; esac

            # ★ F12 修复（#TASK-QG-CIRCUITBREAKER-20260910-01 终局收敛）：本早退分支**同样落审计标记并 cat 进构建日志**。
            #   旧实现只在下方「两出口执行后」块写 `/workspace/qg-熔断-升级-失败.txt`，而本分支（`SRC_OK != yes`
            #   触发源真伪自检未过 / `QG_DRY_RUN=1` 探针隔离）**先 exit 0**、早于该块 → 只落 `qg-熔断-升级-dryrun.log`
            #   （非版本库产物、CI 结束即随工作区销毁）→ 心跳/巡检**事后根本扫不到** → **熔断后静默停摆**
            #   （正是本任务要根治的 P0 被 F2 重新引入）。故本分支与下方块**同口径落标记 + 全文打印进构建日志**。
            #   文案区分两类（防把探针隔离误报为升级失败）：拦截=真未发载荷、需心跳兜底；dry-run=探针主动隔离、非故障。
            if [ "$SRC_OK" != "yes" ] || [ "$DRY" = "1" ]; then
              if [ "$SRC_OK" != "yes" ]; then UP_STATE="拦截（触发源真伪自检未过，未发载荷）"; else UP_STATE="DRY-RUN（探针隔离，未发载荷）"; fi
              {
                echo "===== 升级出口未执行（只落日志、不发评论/不派单）====="
                echo "原因：$( [ "$DRY" = "1" ] && printf 'dry-run(QG_DRY_RUN=1) ' ; [ "$SRC_OK" != "yes" ] && printf '触发源真伪自检未过%s' "$SRC_FAIL" )"
                echo "dry-run=$DRY  触发源自检=$SRC_OK${SRC_FAIL:+（$SRC_FAIL）}"
                echo "熔断判定=TRIPPED  理由=$REASON"
                echo "分支=$BRANCH  PR=#$PR  台账=#${LEDGER:-未解析}  自愈轮次=$ROUNDS"
                echo "---- 拟发升级载荷（BRIEF）----"
                printf '%s\n\n@i.o/x(中书令)\n' "$BRIEF"
                echo "---- 拟发目标 ----"
                echo "a) api_trigger：cnb build start-build --event api_trigger --npc-name CodeBuddy --npc-workMode --env NPC_ROLE=中书令"
                echo "b) 回落评论：$([ -n "$LEDGER" ] && echo "台账 #$LEDGER" || echo "PR #${PR:-未解析}") + @i.o/x(中书令)"
              } > /workspace/qg-熔断-升级-dryrun.log 2>&1
              echo "🧪 升级出口已隔离（不发评论/不派单）；拟发载荷落 /workspace/qg-熔断-升级-dryrun.log："
              cat /workspace/qg-熔断-升级-dryrun.log
              # F12：审计标记**写出**（与下方块同路径同结构），并全文打印进构建审计日志（可事后检索）
              {
                echo "熔断升级状态=$UP_STATE"
                echo "理由=$REASON"
                echo "仓库=$REPO 分支=$BRANCH PR=#$PR 台账=#${LEDGER:-未解析}"
                echo "a) api_trigger：未执行（$UP_STATE）"
                echo "b) 回落评论：未执行（$UP_STATE）"
                echo "dry-run=$DRY  触发源自检=$SRC_OK${SRC_FAIL:+（$SRC_FAIL）}"
                echo "兜底：crontab 心跳第③维据审计日志（本 stage 已打印全文）与 PR/Issue 现状判熔断未收敛 → 拉起中书令裁决（§8 第7B条巡检各维）"
              } > /workspace/qg-熔断-升级-失败.txt
              if [ "$SRC_OK" != "yes" ]; then
                echo "🚨 熔断升级被拦截（触发源真伪自检未过）：载荷未发 → 以下标记已落盘并随本 stage 输出进构建审计日志 🚨"
              else
                echo "🧪 探针隔离（dry-run）：非升级失败、无需心跳兜底 → 以下为审计留痕"
              fi
              cat /workspace/qg-熔断-升级-失败.txt
              echo "熔断闭环（$UP_STATE）：qg-熔断.txt 已留痕；工部尚书自愈已被 if 守卫跳过。"
              exit 0
            fi

            # 升级出口 a) api_trigger 拉起中书令（不吃评论配额；PR 事件令牌缺 repo-cnb-trigger:rw 时 403）
            #   P0-1 修复（门下实证）：`cnb build start-build` 在 403 权限不足时**退出码仍为 0**
            #   （错误只在响应体 `status: 403 / errcode 10023 / Missing required scopes`），
            #   旧写法 `if cmd; then UP_OK=yes` 必误报成功 → 不再回落 b → 熔断静默停摆。
            #   判成功必须**校验响应体**：status 2xx 且**不含** `errcode`，二者缺一即视为失败。
            #   ★ 匹配须兼容 CLI 实际输出两种形态：**带引号 JSON**（`"status": 200`）与**裸键**（`status: 200`，
            #     实测 CLI 缺省输出为 yaml-ish 裸键）；只匹配带引号会把**真实成功误判为失败**（隔离探针实证）。
            UP_OK="no"
            if command -v cnb >/dev/null 2>&1; then
              cnb build start-build --repo "$REPO" --branch "${CNB_DEFAULT_BRANCH:-main}" --event api_trigger \
                   --npc-name CodeBuddy --npc-workMode --sync false \
                   --env NPC_ROLE=中书令 --env "SUMMON_BRIEF=$BRIEF" \
                   --title "【熔断升级】中书令·PR#$PR 自愈环非收敛裁决" >/workspace/qg-熔断-升级.log 2>&1
              _rc=$?
              # ★ P1-3 修复（#TASK-QG-CIRCUITBREAKER-20260910-01 封驳）：A10 的双形态匹配假定平台 2xx 响应体
              #   **必含** `status` 字段——该假定**无据**（成功输出不保证回显 status）；形态再变即真实成功被误判
              #   为失败（出口 a 形同关闭，与 A10 自称修复的"真实成功误判"同源复发）。
              #   改**否定式为主、肯定式为辅**：无 `errcode`/`Missing required scopes`/403/`error:` 信号
              #   且输出非空、rc=0 → 成功（不强制匹配 status 形态，抗输出格式漂移）。
              if [ "$_rc" -eq 0 ] && [ -s /workspace/qg-熔断-升级.log ] \
                   && ! grep -qiE 'errcode|Missing required scopes|(^|[^0-9])403([^0-9]|$)|error[[:space:]]*:' /workspace/qg-熔断-升级.log 2>/dev/null; then
                UP_OK="yes"
                echo "✅ 升级出口 a) api_trigger 拉起中书令成功（rc=$_rc · 无错误信号；响应体形态不作判据以抗格式漂移 · 见 /workspace/qg-熔断-升级.log）"
              else
                echo "⚠️ 升级出口 a) api_trigger 未成功（rc=$_rc · 命中错误信号或输出为空；缺 repo-cnb-trigger:rw 时 rc 仍为 0、错误只在响应体）→ 回落 b) 评论"
                grep -m1 -iE 'errcode|Missing required scopes|403|error[[:space:]]*:' /workspace/qg-熔断-升级.log 2>/dev/null || true
              fi
            fi

            # 升级出口 b) —— **b-1 真拉起（api_trigger，同出口 a 形态）＋ b-2 评论留痕**（不可信事件仍有 repo-issue:rw / repo-notes:rw）
            #   修复（#TASK-QG-CIRCUITBREAKER-20260910-01 修复 · 刑部 P1-2 / 门下 P1-2 实证）：
            #   旧实现把出口 b **绑定 PR 撞线产物** `qg-留痕目标.txt` 的 `ledger=`，而该字段**仅在 TARGET=ledger
            #   （PR 评论 ≥90）时才写入**；未撞线（<90 常态）时守卫只写 `TARGET=pr total=N` → LEDGER 恒空 →
            #   `[ -n "$LEDGER" ]` 为假 → 出口 b **永不执行**；叠加出口 a 在 PR 不可信事件必 403（实测 errcode 10023）
            #   → **两出口全灭、熔断后仅剩工作区文件**（A7 声称根治的"静默停摆"在常态下依然存在）。
            #   目标自适应：有台账号 → 发台账（守 ≥90 续接）；无台账号 → **回落发 PR 评论**
            #   （未撞线时 PR 评论本身可用，撞线时上游守卫会给出 ledger= 走台账，不会贴到已撞线的 PR）。
            #   ★ 语义缺口收口（#TASK-FUSE-EXITB-20261006-01 AC-2 · 承 #598 §四 / #607 F-D）：
            #     **旧出口 b 只有评论、没有任何真拉起动作**——`printf '%s\n\n@i.o/x(中书令)\n' "$BRIEF"` 只是**评论正文**，
            #     是否有人被拉起**完全取决于平台评论事件**；评审可见面失明时（PR 撞线 ≥90 ⇒ `@npc` 事件静默停发 /
            #     事件静默 / 无人在场）该评论**不拉起任何角色** ⇒ 熔断静默停摆（PR#601 实录：载荷落 PR 评论、靠真人转达）。
            #     故出口 b 现为 **b-1 真拉起（`api_trigger`，不吃评论配额、不依赖评论事件）＋ b-2 评论留痕**，
            #     且 **b-2 评论成功一律不置 `UP_OK=yes`**——「投递成功」≠「已拉起」，二者必须分开判定。
            if [ "$UP_OK" != "yes" ] && command -v cnb >/dev/null 2>&1; then
              # ---- b-1) 真拉起（动作面，先于留痕）：api_trigger，与出口 a 同形态 ----
              #   为何出口 b 自含一次拉起（而非复用 a 的结果）：AC-2 要的是**出口 b 自身有动作面**——
              #   旧出口 b 只发评论，「是否有人被拉起」外包给平台评论事件；现把它收为自己的一次真拉起，
              #   使「评审可见面失明（评论 @ 静默）」不再影响拉起。本调用位于 `UP_OK != yes` 之内
              #   ⇒ **出口 a 已成功则整个出口 b 不执行（无重复调用）**；仅在 a 失败后构成对同一载荷的
              #   第二次拉起尝试（代价＝一次 API 调用，收益＝出口 b 不再依赖评论事件）。
              UP_RC=""; UP_SN=""
              cnb build start-build --repo "$REPO" --branch "${CNB_DEFAULT_BRANCH:-main}" --event api_trigger \
                   --npc-name CodeBuddy --npc-workMode --sync false \
                   --env NPC_ROLE=中书令 --env "SUMMON_BRIEF=$BRIEF" \
                   --title "【熔断升级·出口b】中书令·PR#$PR 自愈环非收敛裁决" >/workspace/qg-熔断-升级-b.log 2>&1
              UP_RC=$?
              # 构建标识（sn）：CLI 两种输出形态（带引号 JSON / 裸键 yaml-ish）通用取值；
              #   取不到记 `未回显`——**不据此判成败**（成败仍以 rc + 错误信号否定式判定，抗输出格式漂移）
              UP_SN="$(tr -d '\r' < /workspace/qg-熔断-升级-b.log 2>/dev/null | grep -oE '(^|[^A-Za-z0-9_])"?sn"?[[:space:]]*:[[:space:]]*"?[A-Za-z0-9_-]+' | head -1 | grep -oE '[A-Za-z0-9_-]+$')"
              if [ "$UP_RC" -eq 0 ] && [ -s /workspace/qg-熔断-升级-b.log ] \
                   && ! grep -qiE 'errcode|Missing required scopes|(^|[^0-9])403([^0-9]|$)|error[[:space:]]*:' /workspace/qg-熔断-升级-b.log 2>/dev/null; then
                UP_OK="yes"
                echo "✅ 升级出口 b-1) api_trigger **真拉起**中书令成功（rc=$UP_RC · sn=${UP_SN:-未回显} · 同出口 a 形态 · 见 /workspace/qg-熔断-升级-b.log）"
              else
                echo "⚠️ 升级出口 b-1) api_trigger 未成功（rc=$UP_RC · sn=${UP_SN:-未回显}）→ **真拉起零成功**；评论留痕不替代拉起"
                grep -m1 -iE 'errcode|Missing required scopes|403|error[[:space:]]*:' /workspace/qg-熔断-升级-b.log 2>/dev/null || true
              fi
              # ---- b-2) 评论留痕（**不置 UP_OK**：投递成功 ≠ 已拉起；只在台账/PR 留可读记录） ----
              COMMENT_OK="no"; COMMENT_TGT=""
              TARGET_KIND=""; TARGET_NO=""
              if [ -n "$LEDGER" ]; then TARGET_KIND="ledger"; TARGET_NO="$LEDGER"; elif [ -n "$PR" ]; then TARGET_KIND="pr"; TARGET_NO="$PR"; fi
              if [ -z "$TARGET_KIND" ]; then
                echo "⚠️ 升级出口 b-2) 留痕不可达：台账与 PR 号均未解析（非 PR 事件且无 QG_LEDGER_IID）"
              else
                # 撞线自守（缺 `-v` 时 minified 输出无 x-cnb-total 头 → 记为 0，与守卫同源风险）
                LT=0
                if [ "$TARGET_KIND" = "ledger" ]; then
                  LT="$(cnb issues list-issue-comments --repo "$REPO" --number "$TARGET_NO" --page-size 1 -v 2>/dev/null \
                    | tr -d '\r' | grep -im1 'x-cnb-total' | grep -oE '[0-9]+' | head -1)"
                else
                  LT="$(cnb pulls list-pull-comments --repo "$REPO" --number "$TARGET_NO" --page-size 1 -v 2>/dev/null \
                    | tr -d '\r' | grep -im1 'x-cnb-total' | grep -oE '[0-9]+' | head -1)"
                fi
                printf '%s' "$LT" | grep -qE '^[0-9]+$' || LT=0
                if [ "$LT" -lt 90 ]; then
                  printf '%s\n\n@i.o/x(中书令)\n' "$BRIEF" > /workspace/qg-熔断-升级评论.md
                  if [ "$TARGET_KIND" = "ledger" ]; then
                    if cnb issues post-issue-comment --repo "$REPO" --number "$TARGET_NO" --body-file /workspace/qg-熔断-升级评论.md >/dev/null 2>&1; then
                      COMMENT_OK="yes"; COMMENT_TGT="台账 #$TARGET_NO"
                    fi
                  else
                    if cnb pulls post-pull-comment --repo "$REPO" --number "$TARGET_NO" --body-file /workspace/qg-熔断-升级评论.md >/dev/null 2>&1; then
                      COMMENT_OK="yes"; COMMENT_TGT="PR #$TARGET_NO"
                    fi
                  fi
                  if [ "$COMMENT_OK" = "yes" ]; then
                    echo "📝 升级出口 b-2) 已在 ${COMMENT_TGT}留痕评论（**仅留痕**：评论不拉起任何角色、不计成功判据；真拉起见 b-1）"
                  else
                    echo "⚠️ 升级出口 b-2) 留痕评论失败（$TARGET_KIND #$TARGET_NO）→ 熔断仅留 qg-熔断.txt（需巡检兜底）"
                  fi
                else
                  echo "⚠️ 升级出口 b-2) 目标 $TARGET_KIND #$TARGET_NO 评论数 $LT ≥90（已撞线、@ 事件静默）→ 不发评论；**拉起不依赖评论**（见 b-1）"
                fi
              fi
            fi
            # ★ P1-4 加固（#TASK-QG-CIRCUITBREAKER-20260910-01 封驳）：失败标记**无条件写出**。
            #   旧实现仅在 `UP_OK != yes` 时写 `/workspace/qg-熔断-升级-失败.txt`——该类 `qg-*` 运行时产物
            #   **不在版本库内**（不在白名单），CI 结束即随工作区销毁 → **心跳/巡检事后根本扫不到**
            #   （"兜底"实为空头承诺）。故改为：无论成败都落盘，并在**日志醒目打印全文**，
            #   由 failStages 转储（进构建日志、可事后检索）+ 心跳第③维日志侧兜底。
            {
              echo "熔断升级状态=$([ "$UP_OK" = "yes" ] && echo OK || echo FAILED)"
              echo "理由=$REASON"
              echo "仓库=$REPO 分支=$BRANCH PR=#$PR 台账=#${LEDGER:-未解析}"
              echo "a) api_trigger：$([ "$UP_OK" = "yes" ] && echo 成功 || echo 失败（缺 repo-cnb-trigger:rw / 形态漂移，见 /workspace/qg-熔断-升级.log）)"
              echo "b-1) api_trigger 真拉起：rc=${UP_RC:-未执行} sn=${UP_SN:-未回显} → $([ "$UP_OK" = "yes" ] && echo 成功 || echo 零成功)"
              echo "b-2) 回落评论（**仅留痕、不拉起**）：$([ "${COMMENT_OK:-no}" = "yes" ] && echo "已发 ${COMMENT_TGT:-}" || echo 未发（目标未解析 / 撞线 ≥90 / 发布失败）)"
              # ★ AC-3 巡检可扫载体（#TASK-FUSE-EXITB-20261006-01）：真拉起零成功时**必须**在审计面留**可机械检索**的线索行——
              #   本行随下方 cat 进构建日志（failStages 已转储全文，心跳在可信事件下可读构建日志），
              #   心跳第③维/熔断兜底凭 `熔断后无升级动作` 线索即可命中拉起中书令（不依赖评论事件是否静默、不需真人转达）。
              if [ "$UP_OK" != "yes" ]; then
                echo "巡检线索=熔断升级未落地（真拉起动作零成功）· 熔断后无升级动作 → 心跳第③维/熔断兜底命中即 api_trigger 拉起中书令裁决（不依赖评论事件、无需真人转达）"
              fi
              echo "兜底：crontab 心跳第③维据审计日志（本 stage 已打印全文）与 PR/Issue 现状判熔断未收敛 → 拉起中书令裁决（§8 第7B条巡检各维）"
            } > /workspace/qg-熔断-升级-失败.txt
            if [ "$UP_OK" != "yes" ]; then
              echo "🚨🚨 熔断升级失败：两出口均未成功 → 以下标记已落盘并随本 stage 输出进构建审计日志 🚨🚨"
            else
              echo "ℹ️ 熔断升级已成功（出口 a 或 b 至少一条落地）——以下为状态留痕（审计用）"
            fi
            cat /workspace/qg-熔断-升级-失败.txt
            echo "熔断闭环：qg-熔断.txt 已留痕；工部尚书自愈已被 if 守卫跳过。"
            exit 0
        - name: 工部尚书自愈
          # 熔断守卫：上一步判定熔断（写 /workspace/qg-熔断.txt）时**跳过本 stage**，不再自动 push 修复 commit
          # ★ F-308a（#433 并入）追加第二守卫：本 PR 已终局裁决冻结（写 /workspace/qg-裁决冻结.txt）时亦跳过，
          #   防「裁决后 CI 失败事件继续拉起承接方产出修复轮」（F-274/F-286/F-296 同族第 3 次实证）。
          if: |
            [ ! -f /workspace/qg-熔断.txt ] && [ ! -f /workspace/qg-裁决冻结.txt ]
          type: npc:go
          options:
            <<: *budget   # ← 机械级预算硬顶（#TASK-ORCH-BUDGET-20260911-01；口径见 AGENTS.md §6.6）
            model: *model
            role: 工部尚书
            systemPrompt: |
              你是「工部尚书」，掌开发与实现。先读 AGENTS.md 总纲的「〇渐进披露导航」→ 按路由精读必读章节（案例库回放根目录 CASEBOOK.md，按任务领域读对应分册），避免整份无差别重读稀释核心；当前仓库没有 AGENTS.md 时，直接读取公开地址 https://cnb.cool/i.o/x/-/git/raw/main/AGENTS.md 获取总纲，按角色职责执行。
              本次是【PR 质量门失败自愈】任务：被 failStages 自动唤起。**先区分失败类型再定位**：读 /workspace/qg-*.rc（体量门判据源：`FAIL` 即体量超预算）与 /workspace/qg-刑部.txt / qg-门下.txt——若有「❌拒绝/驳」或体量门 `FAIL` 结论即质量门拒绝（改缺陷/按 SIZE-BUDGET.md 治理），若 qg 文件缺失或无明确结论再读 CNB_BUILD_FAILED_MSG 定位技术故障。**本 stage 带熔断守卫（#TASK-QG-CIRCUITBREAKER-20260910-01）：仅当上一 stage 未写 /workspace/qg-熔断.txt 时才会进入**——即自愈环未达阈值；达阈值已改走升级出口（拉起中书令裁决），本 stage 不执行。**提交信息禁写「第 N 轮」等过程叙述**（见 userPrompt 第四步）。按 AGENTS.md 11.1「先查证再动手」执行，不复发已知旧错。
            userPrompt: |
              PR 质量门流水线（$ 兜底段 pull_request 多 stage 串行质量门）的 stages 某一步失败，failStages 已自动拉起你执行「失败自愈」——无人值守，不许让构建停在 error 上。
              【当前仓库】${CNB_REPO_SLUG}（分支 ${CNB_BRANCH}，PR #${CNB_PULL_REQUEST_IID}）。代码已检出在 /workspace（PR 源分支最新 commit）。
              【第〇步·熔断二次守卫（#TASK-QG-CIRCUITBREAKER-20260910-01）】：先执行 `ls /workspace/qg-熔断.txt`——
                若该文件存在，说明自愈环已熔断（本 stage 本应被 `if` 守卫跳过，此处为二次防呆）→ **立即停止**：
                不得修改任何文件、不得 commit、不得 push，只按【回奏】格式回报「已熔断、未自愈」到台账 Issue（号从 `/workspace/qg-留痕目标.txt` 的 `ledger=` 或 env `\$QG_LEDGER_IID` 取），然后结束。
              【第〇步之二·通道可达性二维分诊（★ 首个修复动作 · 熔断二次守卫通过后执行 · F-230 并案本单 / #293 F-① · 见 AC-1）】：
                动手修任何东西**之前**先分诊——本 stage 跑在 `pull_request`（平台**不可信事件**），令牌**结构性**只带
                `repo-notes:rw`（评论/附件可达），`repo-code:rw`（push 分支）与 `repo-pr:rw`（改 PR 正文）**通常不可达**。
                1. **实测写权**（★ 首个**修复**动作 · 熔断守卫通过后 · 禁凭自称、禁凭上一轮记录、禁凭假设）：
                   · **分支写权（`repo-code:rw`）**：`git push --dry-run origin HEAD:refs/heads/qg-probe`——**仅以 403 / 缺 `repo-code:rw` 判无写权**（非 fast-forward 类失败不计）。
                   · **PR 正文写权（`repo-pr:rw`）**：**禁用无参空跑探针、亦禁用真实 PR 号**——`cnb pulls patch-pull` 无参只报参数错误、空探无探针值；
                     补齐参数后是**写调用**（`--body ""` 语义即清空/改写 PR 正文），对真实 PR 号执行＝**破坏**。故一律用**错误码分流**：
                     `cnb pulls patch-pull --repo ${CNB_REPO_SLUG} --number 999999 --body ""` → `403 / errcode 10023 / Missing required scopes: repo-pr:rw` ⇒ **无**写权；
                     对照 `cnb pulls get-pull --repo ${CNB_REPO_SLUG} --number 999999` → `404 / errcode 2004000`（有权限、号不存在）。
                     **仅以 errcode 10023 判无写权，禁止对真实 PR 号发起任何 `patch-pull`**。
                   · `CNB_NPC_ENABLE_WORKMODE` 在 `pull_request` 下为空属正常、不代表无写权，故一律以上述实测为准。
                2. **二维匹配表（缺陷落点 × 本通道写权 ⇒ 手段）**：
                   · **分支内容**（代码/配置/文档）⇒ 需 `repo-code:rw` ⇒ `git push` 修复 commit；
                   · **PR 正文**（PR body 本身即缺陷落点）⇒ 需 `repo-pr:rw` ⇒ `cnb pulls patch-pull`；
                   · **回奏 / 终论 / 台账**（结论文字落点）⇒ 需 `repo-notes:rw` ⇒ 发评论 / 传附件。
                3. **二维不匹配即早退并指名责任方**：实测**无写权**、或缺陷落点所需写权本通道不具备 ⇒ **不在本通道硬修**
                   （结构上修不成，硬试＝空转烧轮次）→ **跳过修复动作**、**直走升级出口**：把「缺陷清单 + 落点×权限分诊结论 +
                   **指名责任方**」（分支内容落点 ⇒ 调度方/具 `repo-code:rw` 的通道；**PR 正文落点 ⇒ 调度方**；
                   回奏/台账落点 ⇒ 本通道可自办）按【回奏】发到台账 Issue——**若本轮已有可交付修复成果（含 push 失败态）则落第四步之二可恢复载体；
                   无成果则只发分诊回奏、不落空载体**。
                   分诊的判据命令与实测取值须逐条写入回奏（禁只写机制描述）。
              【第一步·判断失败类型】：
                0. **★ 先读失败码 `/workspace/qg-失败码.txt`（机制/内容分流 · 首个分流动作 · #TASK-QG-CHANNEL-FAULT-20261004-01）**：
                   该文件由 gate 产出、failStages 已转储（上文 `### /workspace/qg-失败码.txt`），单行值域：`PASS` / `MG-*` / `CN-*`。
                   - **`MG-*`（mechanism · 门「未跑出结论」）⇒ 机制故障，非内容缺陷**：`MG-XB-NOCONC`＝刑部 stage 未落盘结论、`MG-MX-NOCONC`＝门下 stage 未落盘结论。
                     含义＝`npc:go` stage 平台判 `success`（恒 exit 0）却**没写 qg 结论文件**（实录 sn `cnb-s4c-1k42o39kb`）。此时**无结论可改**：
                     **禁**按「qg 缺陷清单」改内容（那是空转烧轮次——本单 12 轮同族连红即此）；改按机制故障处置＝
                     ① 核该 stage 构建日志（`cnb build get-stage --repo … --sn <sn> --pipelineId <sn>-001 --stageId <stageId> -v`）确认 Agent 是否真未落盘；
                     ② 在本通道写权范围内**可修则修**（如结论落盘纪律/判断脚本），**不可修则据实上报**并写明「机制故障，非内容缺陷」、
                     指名责任方（`.cnb.yml` 门判据面 ⇒ 调度方/兵部）；③ 不得伪称「已修复内容缺陷」。
                   - **`CN-*`（content · 门「判否」）⇒ 内容缺陷**：`CN-XB-REJECT`/`CN-MX-REJECT`＝两门结论在但首行非闭集 token；
                     `CN-TL-FAIL`＝体量门 rc=FAIL；`CN-CF-FAIL`＝冲突门判否。此时才按下方 qg 结论逐条改内容。
                   - **文件缺失/空值/初值残留**（gate 已统一归 `MG-*` 族）：不得据此判「内容缺陷」，亦不得静默当作
                     「无缺陷」——按「取不到 ⇒ 不早退」口径据实登记并走既有通道。
                1. **再读质量门 qg 文件**（本次改造后质量门拒绝是主要失败来源）：
                   `cat /workspace/qg-体量.rc`（判据源 · 逐字契约 `PASS`/`FAIL`）/ `cat /workspace/qg-体量.txt`（人类可读留痕）/ `cat /workspace/qg-刑部.txt` / `cat /workspace/qg-门下.txt`——
                   - 若 qg-体量.rc = `FAIL`（留痕 qg-体量.txt 内可见 `❌` 超限行「文件/实测/预算」或终行「文档体量门未通过」），则本次失败是**文档体量超预算**：按 SIZE-BUDGET.md 治理——本次 PR diff 引入超限 → 收缩本次改动（压缩冗余/合并重复/同量退役，不删经验卡语义）；基线超限（非本次引入）→ **写明另立治理任务，不在本 PR 顺手压**；
                   - 若 qg-刑部/门下 含「❌拒绝」或「驳」+ 缺陷清单，则是**质量门拒绝**：按 qg 文件中列出的缺陷逐条修复（改到符合要求为止）。
                2. 若 qg 文件缺失或均为空（质量门文件没写出来），再读 `/workspace/CNB_BUILD_FAILED_MSG.txt`（构建错误信息）与 `/workspace/CNB_BUILD_FAILED_STAGE_NAME.txt`（失败 stage 名），并执行 `cnb build get-build-logs`（拉失败日志），判明失败类型：代码（error/FAILED/test failed/SyntaxError...）/ 配置（image not found/env not set/OOM...）/ 外部服务（ETIMEDOUT/ECONNREFUSED/502...）/ npc:go 运行异常。
              【第二步·修复】：按上面定位到的缺陷/根因，在 /workspace 修改代码/配置修复。若 qg 文件列了缺陷（质量门拒绝/体量超限），逐条修复并**补跑相关命令**本地复验——体量超限补跑 `bash scripts/size-check.sh`（全绿=修复完成）；其余补跑 npm test / lint / 构建 / 对应测试，避免假修复。
              【第三步·复验】：本地复验通过（相关命令绿）才算修复完成。
              【第四步·推修复】：提交修复 commit 并推回当前 PR 分支，push 会触发新 PR CI → 自动重走质量门（刑部→门下→gate = pass^k）。
                - **提交范围纪律（防运行时产物误入库 · 白名单外文件禁提交 · #TASK-QG-CIRCUITBREAKER-20260910-01）**：
                  **严禁 `git add -A` / `git add .` / `git commit -a`**——会把 `/workspace` 下本流水线的运行时产物
                  （`qg-*.txt` / `qg-*.log` / `CNB_BUILD_FAILED_MSG.txt` / `CNB_BUILD_FAILED_STAGE_NAME.txt`）一并入库，
                  构成**越范围改动**（实证 `qg-熔断-判定.txt` 曾被误提交，被质量门以 C4 范围锁打回）。
                  必须**逐个显式列出诏令白名单内的文件**提交，例如 `git add .cnb.yml CHANGELOG.md && git commit ...`；
                  提交前先 `git status --short` 自查，发现 `qg-*` / `CNB_BUILD_FAILED_*` 处于待提交态即从暂存区移除
                  （`git restore --staged <file>`），**绝不提交**。
                - **提交信息规范（#TASK-QG-CIRCUITBREAKER-20260910-01）**：格式 `[工部] fix: #TASK-<任务号> <缺陷修复说明>`。
                  **严禁**含「第 N 轮」「第 N 次」「质量门第 N 轮」类**过程自描述**（过程叙述会成下一轮质量门的新挑刺源、且是自愈空转燃料）；
                  同批多缺陷压为 1 条 commit（不要逐轮各提一次）。
                - **缺陷指纹尾行（★ 硬要求 · 缺即自愈失败 · 漏写＝熔断判据源欠计 · #TASK-SELFHEAL-MECH-20260912-01-R4）**：
                  **每个**自愈 commit **必须**在 message 末尾**携带**一行机器可读指纹（**不得省略、不得改写格式**），
                  取本轮修复所针对的 qg 缺陷编号集合（与 `/workspace/qg-刑部.txt`+`qg-门下.txt` 中的 P 编号一致），格式：
                  `QG-Fingerprint: P1-1,P1-2,P2-1`（无 P 编号则写 `QG-Fingerprint: -`）。
                  **为什么是硬要求（why 而非仅禁令）**：该尾行**就是**「自愈熔断判定」stage 的**唯一轮次判据源**——
                  该 stage 直读分支自有 git 历史（`git log --format=%B <base>..HEAD`），`pull_request`（不可信事件、
                  无 `repo-code:rw`）**只读即可判定**、不需要任何写权限、也不依赖任何分支级二次载体。
                  链上任何一环漏写尾行即**欠计**（实证：本任务区间 10 提交、仅 3 笔带尾行 ⇒ 轮次恒低于实际、
                  熔断被推迟；欠计本身又催生「标记 ref 二次载体 → 写侧迁心跳 → fetch-rc fail-open」整族缺陷，
                  根源链见台账 #299 §四）。故**堵欠计在源头**：
                  · commit 前自查：`git log -1 --format=%B | grep -q '^QG-Fingerprint:'` 为真方可提交；
                  · 漏写即**重做本步**（`git commit --amend` 补尾行后重推），**不得以「无尾行」形态交付**；
                  · 静态锁定：矩阵断言「本硬要求文本在位（每个 / 必须 / 硬要求 / QG-Fingerprint 同现）」
                    （`scripts/gate-regression.sh` C14 组）。**注意**：对「每个自愈 commit 实带尾行」的**动态实跑断言族**
                    已按 #299 第六次熔断裁决 §四.3① **撤出本 PR**（其在未合并态自判红），**扩面移入独立设计单 #318**。
              【第四步之二·产出可恢复载体（★ AC-2 硬要求 · 缺即本步失败 · F-213②）】：
                **为什么（why）**：本通道无 `repo-code:rw` 是**结构性**的（非偶发），故本 stage **必须假定 push 会失败**——
                把修复成果落到**不依赖写权**的载体上，否则沙箱销毁即**不可恢复**（实录：已修完、远端零 ref、回奏无 patch）。
                故**每个产出了修复成果的**自愈轮**必须**二选一落载体（**无成果轮**＝走第〇步之二第 3 点早退分支者，只发分诊回奏、不落空载体，两处口径同源）：
                ① **patch 附件（首选 · 仅需 `repo-notes:rw`）**：**按两态生成**（口径消除歧义）——
                   · **已 commit 态**（第四步已 commit）：**必须用 `git format-patch -1 --stdout > /workspace/selfheal.patch`**；
                     **单轮多 commit 时用 `git format-patch "$(git merge-base origin/main HEAD)" --stdout > /workspace/selfheal.patch`**（逐笔含 message + `QG-Fingerprint:` 尾行，`git am` 可逐笔落）。
                     若确需 diff 形态（备选）：`git diff "$(git merge-base origin/main HEAD)"..HEAD`——**只覆盖末笔的裸 `HEAD~1` 禁止使用**；
                     **且 diff 形态丢失 commit message 与尾行**，须在同一条回奏里把提交信息（含尾行）另行逐字附上，否则载体不完整。
                     **禁用裸 `git diff`**——该步位于「第四步·推修复（先 commit 再 push）」之后，工作区必已 clean，`git diff` **恒产 0 字节**（本单实录）。
                   · **未 commit 态**（走第〇步之二早退分支、尚无 commit）：`git diff` 可用（该态下工作区非 clean，与上句不矛盾）。
                   再 `cnb issues upload-file --repo ${CNB_REPO_SLUG} --number <台账号> --file /workspace/selfheal.patch`
                   （或 `cnb pulls upload-file` 发到 PR），把返回的 `asset_link` 写进本次回奏正文。
                   ★ **可达性口径（分域实测所得 · 缺即载体失效）**：
                     · **PR 级**附件（`cnb pulls upload-file`，**不带 `--number`**）：**免引用即可取回**（实测 status 200 → 直接 `curl` 取回 http=200，非 404）；
                     · **issue 评论级**附件（`cnb issues upload-file --number N`）：**必须先被一条已发布的评论引用**才可取回（实测 upload 后 404 → 同 URL 写进已发评论后 200）；
                     · 取回 URL **必须形如** `https://cnb.cool/<repo>/-/files/...`：仅缺 scheme（`/-/files/...`）→ curl 返回 **000**；
                       缺**仓库前缀**（`https://cnb.cool/-/files/...`）→ **http=200 但 content-type=text/html**（站点页面，非文件内容）＝**假成功面**；
                       故判「可取回」须以**内容体**为准（如 `curl -s <url> | head -c 200` 命中 patch 原文），**不得只看 http 状态码**。
                     · **`TARGET=ledger`（§6.4C-2 撞线）时优先用 PR 级附件、不在 PR 追加引用评论**（防撞破「PR 评论增量 ≤1」守卫）；未撞线亦优先 PR 级、省评论预算。
                     · **附件不得含密钥/凭据明文**：本通道**无 `repo-manage:rw`**、上传后**无法自行删除**（delete-repo-files → 403/10023），故「用完即清」在本通道不可行、据实标注。
                ② **可寻址 ref（仅有 `repo-code:rw` 时）**：push 修复分支 `refs/heads/<feat/...-selfheal>`，回奏写明**分支名 + sha**
                   （`git ls-remote origin refs/heads/<分支>` 可复核）。
                回奏须给**一次实跑或对拍证据**（构造 push 403 场景，证明产出**可从平台侧取回**：附件 `asset_link` 可取回，或 ref 可 `ls-remote` 命中）。
              【第五步·复核留痕（按条件改道 · PR 评论撞线守卫 #TASK-QG-CIRCUITBREAKER-20260910-01）】：
                - 先读 `/workspace/qg-留痕目标.txt`（「评论撞线守卫」stage 已写好），按其 `TARGET=` 判定：
                  · `TARGET=pr`（PR 评论 <90）→ 照旧在 PR #${CNB_PULL_REQUEST_IID} 发评论说明修复内容与复验结果；
                  · `TARGET=ledger`（PR 评论 ≥90，其上 @npc 事件已静默停发）→ **不在 PR 发过程留痕**，
                    改发**台账 Issue**：**台账号必须命令替换内联展开**——**不要**经中间变量（平台配置期会对 options.userPrompt 做 \$VAR 替换，**凡平台未注入的变量一律替换成空串、与变量名无关**，改名 \$LEDGER 同样落空；`\$( )` 不在替换规则内、可存活）：`cnb issues post-issue-comment --repo ${CNB_REPO_SLUG} --number "$(grep -oE 'ledger=[0-9]+' /workspace/qg-留痕目标.txt | cut -d= -f2)" --body-file <你的回奏文件>`；**备用**：文件取值失败时可读 env `\$QG_LEDGER_IID`（调度方显式下发才有值）；PR 最多只留**一行结论指针**；
                  · `TARGET=skip`（撞线且**正文/env 均无**台账号候选）→ 跳过留痕；
                    `TARGET=pr`（**未撞线** / 取数失败回落 `reason=total-unknown` / **有候选但无一可采信回落 `reason=no-usable-ledger-failsafe`**）→ 仍按 PR 留痕（口径与守卫一致）。
                - 若令牌权限受限无法直接 push（PR 事件通常无 repo-code:rw），须**明示「push 被拒、非交付」**（发到上述判定目标处）：说明本地已完成的修复与建议的推送路径，留给调度方/巡检兜底（AGENTS.md §8 第7A条）。
              完成后按【回奏】格式回报到**台账 Issue**（号从 `/workspace/qg-留痕目标.txt` 的 `ledger=` 或 env `\$QG_LEDGER_IID` 取；均无则回落到本仓质量门在办台账）（附：失败类型、qg 缺陷清单、修复改动文件、复验命令与输出、推的 commit/PR 或 push 受限说明）。


# ================= 定时巡检自愈环（HEARTBEAT · crontab 主动心跳，根治无人值守断链） =================
# 背景：现行自愈机制（Anti-Stall / push403 兜底 / failStages）都是【反应式】——靠"某个事件先把调度方拉起"
#   才去轮询补位；若链条在某棒静默断掉且无事件触发，就停摆到用户回来。本节补一个【不依赖外部事件的主动巡检心跳】。
# 研究结论（兵部已查证，详见 casebook/platform.md + AGENTS.md §8 第7B条）：
#   · crontab 是【可信事件】（不在 docs trigger-rule.md "不可信事件"列表，该列表仅含 PR/Issue/评论/NPC 事件），
#     故 crontab 拉起流水线的 CNB_TOKEN 天然带全写权限（repo-code:rw / repo-pr:rw / repo-issue:rw），
#     **无需"替我上班"勾选**（该勾选仅存在于评论 @NPC 事件；定时事件与 push/api_trigger 同级可信）。
#   · 执行身份 = 最近一次"添加/修改本 crontab 配置并推送"的用户（须 Developer+ 才有写权限上限，docs crontab.md）。
#   · cron 表达式须挂【具体分支名下】不能挂 $（cnb-pipeline validator 语义规则 #4）；最小间隔 5 分钟，时区 Asia/Shanghai。
#   · npc:go 内置任务支持所有事件（含 crontab，见 builtin-tasks.md）；此处显式 role=中书令 + 内联 systemPrompt/userPrompt，
#     不依赖 settings 按 NPC_ROLE 解析。
# 巡检节奏：日间 `*/30 7-23`、夜间 `0 0-6` 低频值守；防抖用 lock（日/夜**共用同一 key** + `wait: true` 排队 + `expires` 防孤儿锁，**取值以本段 `lock` 活配置为唯一源、此处不手写现值**），防并发与跨段并行、不空耗额度。
# 巡检定位：只做【轻量巡检（既有七维 + 第⑧维「前置解除必重派」+ 第⑨维「预算维」+ 第⑩维「构建量维」+ 第⑪维「跨根断链检测」）+ 用 api_trigger 把需深入处理者派给对应角色】，不在本 crontab 上下文里拖泥带水做全套；
# 评论预算口径（2026-09-09 精确化 · 用户 llvm 指出）：crontab 令牌**权限**不吃评论配额红线（可信事件可无限发），
#   但**发出的每条评论计入所在 Issue comment_count**——48 次/天空报会迅速逼近 90 红线、静默停发该 Issue 的 @npc 事件，
#   误杀唯一对话入口。故巡检回报执行【零评论策略】（见下 userPrompt 回报段）：无可推进项零评论、动作留痕只发动作对象、
#   仅在涉及对话入口本身的状态变更（滚动续接等）才在入口发帖并先自查 total≥90。
# 护栏：巡检绝不误关需求总纲 Issue（总纲保持 open，仅关"验收全满足+交付已留痕"的单任务台账）。
main:
  # 巡检节奏（2026-09-09 夜间值守补强 · 用户 llvm 指出"夜间若在干项目出问题停罢如何处置"）：
  #   时区基准 = Asia/Shanghai（crontab 平台基准时区，勿与机器 UTC 混淆——涉时间表述一律显式标注基准时区）。
  #   日间 07:00-23:30（Asia/Shanghai）每 30 分钟高频巡检 = 服务常态兜底；
  #   夜间 00:00-06:00（Asia/Shanghai）每小时低频值守 = 不睡死——夜间若仍有在途任务（open PR 质量门挂住/派单断链/
  #   封驳卡死）则最多 1 小时即被唤醒兜底；无在途任务则轻量探测后零评论静默退出（省 CPU/AI credits，休息也是机制的
  #   一部分）。夜间用户需求仍可随时评论 @ 中书令 走 comment 事件拉起，不依赖心跳（心跳只是"意外断链兜底"，非服务常态，
  #   见 AGENTS.md §8 第7B条）。
  "crontab: */30 7-23 * * *":
    - name: 定时巡检自愈环-中书令心跳
      # 可观测性（AC-2 · #TASK-ORCH-CHANNEL-DEDUP-20261002-01）：平台对 crontab 构建**硬编码标题 `Crontab job`**
      #   （实测：`cnb build get-build-logs --event crontab` 逐条 `title: Crontab job`，三条任务不可区分 —— 用户 llvm #211
      #   所指「好几个任务都是同一个」）。流水线层无 `title` 键可覆盖该值，故按 AC-2 括注的 `--title`/label 路径落
      #   **互不相同的 `label.job`**（机器可读：`pipelines[].labels` 含 `job=<名>`；流水线名另见 `get-build-status
      #   pipelinesStatus[].name`）。标题口径的平台侧限制据实登记、不主张已改标题。
      label:
        job: heartbeat-day-日间心跳
      # 防抖（日/夜共用同一 key + wait 语义据实 + expires 防并行 · #TASK-LOCK-MUTEX-20260910-01）：
      #   ① 日/夜**共用同一 key**（`heartbeat-巡检`）——平台互斥**只在同名 key 内成立**（`grammar.md#pipeline-lock`：
      #      `key` =「自定义锁名」）。若拆成 day/night 两个 key，则时段边界（日末班 23:30→夜首班 00:00 = 30min；
      #      夜末班 06:00→日首班 07:00 = 60min）< 本仓单轮实测时长（51.0min / 64.6min，**产出者实测、未独立复核**）
      #      时会**立即取到无人持有的另一 key → 两轮并行巡检**（重复 merge / 关单 / 派单、在途冲突下双重合并）。
      #   ② `wait: true`（排队）——平台 `wait: false`（默认）= 锁被占用即流水线**执行失败**、
      #      非「跳过」（原文"未占到锁执行失败"实出 `docs.cnb.cool/zh/build/env.html#lock-key-shi-li`，本容器 curl 200 直读：
      #      该页 `id="lock-key-shi-li"` 命中 1、`lock-key-示例` 命中 0 —— fragment 须命中**渲染页 id**（承 F-82 锚点可核）；
      #      对照 `grammar.html` `id="pipeline-lock"` 命中 1；`grammar.md` 全文 grep `未占到锁` = 0）。
      #      ★★ **`cancel-in-wait` 已移除（根因修复 · #TASK-ORCH-BUDGET-20260911-01 AC-5）**——原因如下：
      #        `cancel-in-wait: true` 语义（F-83 实测 + 本轮 AC-5 复证）= **后到者取消先到等待轮**
      #        （被取消轮流水线执行失败、error=`is cancel by other pipeline`）。而本仓心跳是 `*/30` 固定频率、
      #        单轮实测耗时 25~128 轮 / 常超 30 分钟（sn `cnb-mug-1k27r3tuj`、`cnb-sko-1k281vl62`；**具体秒数以构建记录为唯一源，此处不手写现值**）
      #        → **每 30 分钟必来一轮新的 ciw 轮，把正在排队的旧轮取消**；旧轮被取消时**连 `Prepare` 都没跑完**
      #        （`Prepare` error、stage 全 skipped）⇒ 排队轮永远等不到锁、心跳大面积 `status=error`
      #        （AC-5 三条实录 `cnb-ct8-1k2808ncc` / `cnb-2k8-1k27uhq4l` / `cnb-om5-1k27sqs93` 均为
      #        `Prepare` error + `is cancel by other pipeline` + `巡检心跳` skipped）→ **监督环失明**。
      #        本轮隔离复证（`api_trigger` 探针，holder 占锁 180s）：带 ciw 的等待轮 W1 → `Prepare` error /
      #        `is cancel by other pipeline`（真因复现）；其后再来带 ciw 的 W2 → **W1 已被取消、W2 仍在排队**
      #        （后到者取消先到者）。**去 ciw 后**（holder 占锁 150s）：W1/W2 **依次取到锁、均 success**（排队保序、不再互杀）。
      #        ⇒ 互斥语义不变（同 key 仍至多 1 轮持有），但**排队轮不再被新轮取消**——监督环不能自己把自己杀掉。
      #   ③ **`expires`（取值以本段 `lock` 活配置为唯一源，须 ≥ 平台流水线上限 20h，docs.cnb.cool/zh/build/timeout.md）**：`expires` 是**锁的自动过期
      #      时间、与持锁者是否仍在运行无关**——一旦过期锁即被自动释放，排队中的下一轮（`wait: true`）会取到已过期的锁
      #      → 与**仍在运行**的上一轮并行（平台默认仅 3600s，而本仓心跳单轮实测可超 3600s，**产出者实测、未独立复核**）
      #      → 取值须 ≥ 平台流水线上限，使锁在持锁者存活期间**不会被动释放**（本仓实际取值见本段 `lock` 活配置）。
      #   边界（如实标注）：**`expires` 本身不提供互斥保证**——它**只防「持有者已死」的孤儿锁**；「**同一 key 内**至多
      #      1 轮」由 `wait: true` 排队 + 锁不提前过期**共同**成立，**不得写成 `expires` 单独保证**。代价：持有者异常死亡后
      #      孤儿锁最多阻塞自愈环至 `expires` 上限时长（本仓取值见本段 `lock` 活配置；平台上限 20h）（F-81）。
      #   跨段排队语义（F-83 · **已平台实测收口**，2026-09-11 #TASK-QGREGEX-FIX-20260911-01）：日/夜共用 key 后跨段为
      #      **排队**（非失败/并行），但等待有上界——超界即**流水线执行失败**（error=`timeout while waiting for lock`），
      #      **非**「跳过」。`lock.timeout` 官方默认 **3600s**（`grammar.html#pipeline-lock` 参数表：`timeout` 默认
      #      `3600（1小时）`）。实测（探针 `cnb-h0l-1k26i49rg`）：显式 `timeout: 20` 的等待轮在 **20.019s** 后以
      #      `timeout while waiting for lock` 失败 ⇒ `timeout` 即「等锁最长时间」，逐秒计时、到点即失败退出。
      #      ⇒ 本仓含义：持锁轮若超 3600s，等待轮将**失败退出**（不是静默跳过）；下一轮 crontab 照常再触发兜底。
      lock:
        key: heartbeat-巡检
        wait: true
        # cancel-in-wait: true   # ← AC-5 根因修复：已移除（后到者会取消先到等待轮 → 心跳大面积 error、监督环失明；见日间心跳段注）
        # timeout（AC-5 补 · 根因修复闭环 · 日/夜两处逐字一致）：平台默认 3600s ⇒ 持锁轮超 3600s 时**排队轮失败退出**
        #   （`timeout while waiting for lock`，平台实测 sn `cnb-h0l-1k26i49rg` 显式 timeout:20 在 20.019s 失败），
        #   而本仓心跳单轮实测**最长可达数小时**（sn `cnb-mug-1k27r3tuj`；**具体秒数以构建记录为唯一源，此处不手写现值**）⇒ 仅去 ciw 只解「被取消」路径、
        #   解不了「等锁超时」路径（AC-5 根因残留路径）。**本值取值以本段 `lock` 活配置为唯一源**——须 ≥ 实测最长单轮，
        #   并留足余量（实测最长单轮的倍数量级）以覆盖多轮排队叠加，使长轮持锁时后到轮能等到锁而非失败退出。
        #   **复核口径**：改心跳实测最长单轮须同步复核本段 `lock.timeout` 活配置（须 ≥ 最长单轮实测）。`wait: true` 语义不变。
        timeout: 21600
        expires: 72000
      # 2核4G：runner.cpus=2 → 内存=2×2GiB=4G（平台规则：内存=CPU核数×2GiB，docs grammar.md#pipeline-cpus）
      # 巡检心跳为轻量巡检任务（既有七维+第⑧维+**第⑨维（预算维）**+**第⑩维（构建量维）**＝**十一维**（含第⑪维「跨根断链检测」），见下 userPrompt 只扫可自动推进项、重活 api_trigger 派单下游），无需 8核16G 默认规格
      runner: *runner   # ← 引用 .runner 锚点（机型见锚点）
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: 巡检心跳
          type: npc:go
          options:
            <<: *budget-light   # ← 轻量档：**监督环不占业务预算**（独立低配额，低于常规档）
            model: *model
            role: 中书令
            systemPrompt: |
              你是「中书令」（总NPC·决策中枢）。本任务由 crontab 定时事件主动唤起，跑【定时巡检自愈环】——
              定位是轻量巡检特使，不是常规接需求全链路调度。先读 AGENTS.md 总纲的「〇渐进披露导航」→ 按路由
              精读本角色必读章节（当前仓库没有 AGENTS.md 时，直接读取公开地址
              https://cnb.cool/i.o/x/-/git/raw/main/AGENTS.md 获取总纲）；巡检手顺细则见
              .codebuddy/skills/orchestration-ledger「六、定时巡检心跳」一节。完成巡检后按【回奏】格式上报。
            userPrompt: |
              你是被【crontab 定时巡检心跳】主动唤起的「中书令」。本任务不依赖任何用户事件，是无人值守断链的
              主动自愈环——目标是"扫出并处理当前卡住无人管的状态"，不空转、不误伤。
              【当前仓库】${CNB_REPO_SLUG}（分支 ${CNB_BRANCH}，crontab 事件，CNB_IS_CRONEVENT=${CNB_IS_CRONEVENT}）。
              【你的令牌】本 crontab 是可信事件，天然带全写权限（repo-code:rw/repo-pr:rw/repo-issue:rw），无需替我上班。
              【执行巡检（既有七维 + **第⑧维「前置解除必重派」** + **第⑨维「预算维」** + **第⑩维「构建量维」** + **第⑪维「跨根断链检测」**，轻量，别把上下文耗光）】用 cnb-api/脚本逐维扫，每维都以"有没有可自动推进项"为出口：
              【派单前通道硬前置（三项实测 · AC-5 · #TASK-ORCH-CHANNEL-DEDUP-20261002-01）】
              发**任何**调兵令/接力前先实测三项，**任一不成立即不得发 api_trigger**：
                ① **同根实测**：目标仓与 `i.o` 是否同根组织（读目标仓 `CNB_ROOT_SLUG`/组织归属实测，非凭记忆）；
                ② **settings 可解析实测**：目标仓 `.cnb/settings.yml` 存在且 `npc.roles` 含该角色名（读文件实测；目标仓不允许落 NPC 文件时此项必不成立）；
                ③ **写权实测**：`git push --dry-run` 或确认持 `repo-cnb-trigger:rw`（**仅 403 / 缺该 scope 判无写权**，非 fast-forward 类失败不计）。
                ⇒ 三项全真 → 走 **api_trigger（仅态A 可称主通道）**；跨根但有真人首棒 work_mode → 走**评论嵌套 @ 接力（态B，须 `--work-mode`）**；
                   跨根且无写权 → **态C · 通道不成立**：如实告知只做对话级服务、**禁发 api_trigger**（会 403 或空载荷假成功）。三态判据见 `AGENTS.md` §6/§14.4。
                ★ **同根 + 目标仓无 `settings`** → 改走 `api_trigger_npc` 内联提示词（`role/systemPrompt/userPrompt` 全内联、**禁注入完整总纲**，守 §6.6-C）。
              【收敛入口（#TASK-HB-BUDGET-HARDEN-20260912-01 AC-1 · 轻量档）】单轮**最多深挖 3 项**（含 merge/派单/裁决），其余维**只登记不展开**；**禁整份 `cat`/通读总纲**（只读〇导航+本角色必读切片，深水区用 `bash scripts/kb-query.sh` Top-K 检索）；**轮次自警**：工具调用累计约 ≥80 次或已深挖满 3 项即**立即收敛出手**（防撞 `maxTurns 100` 致 `error`=监督环失明）；**逼近第⑨维① / 第⑩维阈值即自退**（不追加深挖）。
              1. 扫 open 且"可合并"的 PR（刑部✅+门下「准」证据齐，且改动范围无冲突 ∧ **未被终局裁决冻结**）→ 按 AGENTS.md §8 第 7 条 Anti-Stall
                 直接调用 CNB OpenAPI 自动 merge，不等触发；
                 **F-307 · merge 前「已裁决/冻结」守卫（fail-closed · 本项由 #433 并入）**：先取该 PR **所属台账**（PR 正文 `QG-Ledger: <N>` 行 / 正文台账链接，回落 `QG_LEDGER_IID`）
                 之 `state` 与其「换方案/转出裁决留痕」二判：
                   (a) 台账 `state=closed ∧ state_reason=not_planned`（§8 护栏② 转出/终止留痕）**且** body 内含换方案承接台账（形如「转出 #<M>」「余项另立台账 #<M> 重实现」）；
                   (b) PR 评论内含终局裁决题头（形如「裁决 · 换方案」「换方案（载体级）」且同块含「不得以现形态入 main」/「转出 #<M>」）。
                 命中 (a) 或 (b) ⇒ **不 merge**，改 `api_trigger` 拉起中书令复核（不吃评论配额）；**判据取不到（台账号/裁决文本均不可得）⇒ 写显式告警行、只登记不 merge**（fail-closed：不得静默判「未冻结」）。
                 实证（#433 登记）：换方案裁决后该 PR 由 `conflict` 转 `mergeable` ⇒ 本守卫正是「修好一个状态」后**不得反手打开闸门**的闸门。
                 判据源＝上方 `#<<FROZEN_GUARD_SH … FROZEN_GUARD_SH>>` 哨兵块（供 `scripts/gate-regression.sh` C-FROZEN 组原样抽取复跑）。
                 ```bash
                 #<<FROZEN_GUARD_SH
                 # 冻结判据（F-307 · 纯文本输入 ⇒ 可在 PR 不可信事件下只读判定）
                 #   入参：FG_LEDGER_STATE（台账 state）/ FG_LEDGER_REASON（state_reason）/ FG_LEDGER_BODY（台账 body）
                 #         FG_PR_BODY（PR 评论区全文拼接；无则空）
                 #   出参（stdout 一行）：FROZEN=yes|no|?  REASON=<...>
                 FG_HIT=""
                 case "${FG_LEDGER_STATE:-}" in
                   closed)
                     if [ "${FG_LEDGER_REASON:-}" = "not_planned" ]; then
                       if printf '%s' "${FG_LEDGER_BODY:-}" | LC_ALL=C grep -qE '转出[[:space:]]*#[0-9]+|另立台账[[:space:]]*#[0-9]+|余项[^。]*#[0-9]+'; then
                         FG_HIT="ledger-closed-not-planned-with-successor"
                       fi
                     fi
                     ;;
                 esac
                 if [ -z "$FG_HIT" ]; then
                   if printf '%s' "${FG_PR_BODY:-}" | LC_ALL=C grep -qE '裁决[^：:]{0,20}换方案|换方案[（(]载体级[）)]'; then
                     if printf '%s' "${FG_PR_BODY:-}" | LC_ALL=C grep -qE '不得以现形态入 main|转出[[:space:]]*#[0-9]+'; then
                       FG_HIT="pr-final-verdict-freeze"
                     fi
                   fi
                 fi
                 if [ -n "$FG_HIT" ]; then
                   printf 'FROZEN=yes  REASON=%s\n' "$FG_HIT"
                 elif [ -z "${FG_LEDGER_STATE:-}" ] && [ -z "${FG_PR_BODY:-}" ]; then
                   printf 'FROZEN=?  REASON=input-unavailable（台账态与裁决文本均取不到 ⇒ 告警、不 merge）\n'
                 else
                   printf 'FROZEN=no  REASON=no-freeze-evidence\n'
                 fi
                 #FROZEN_GUARD_SH>>
                 ```
                 **合并期冲突处置（#TASK-ORCH-SERIALOCK-20260915-01 AC-7）**：自动 merge 前须核 `mergeable_state` ——
                 命中 **`mergeable_state=conflict`** 时**不自动 merge**，改为用 api_trigger 拉起该 PR 承接方**按下方边界二选一改写**（源分支含 merge 提交 → `git merge origin/main`；源分支线性 → 可 `git rebase origin/main`）；
                 追加型同名文件（`CHANGELOG.md`）冲突取**双方条目并集、只追加不删史**（`AGENTS.md` §12 第7条）——
                 **不得以「先占」为由丢他人条目**；改写后重走质量门再 merge（守 §8 第 7 条 Anti-Stall）。
                 **rebase 边界（据实 · PR#334 实测）**：**归因对象＝本轮被改写分支（PR 源分支）本身，非目标分支**——**源分支含 merge 提交**时**改用 `git merge origin/main`、禁用 rebase**（rebase 会静默剪除已并入提交）；**目标分支是否含 merge 提交与此无关**（本仓 `main` 恒含 merge 提交，按目标分支判即条件恒真、与上句互斥）。
                 改写后**两条并列自证、不可互替**：(a) **历史自证** `git merge-base --is-ancestor <旧 head> HEAD`——**仅适用于 merge 路径**，为假即止步上报（rebase 路径必重写提交、旧 head 绝不可能是新 head 祖先，该命令恒假故不适用）；(b) **条目自证**（全路径适用）`git diff --numstat origin/main...HEAD -- CHANGELOG.md` **第二列 = 0**；**禁裸 `grep '^-'`**（diff 头行 `--- a/CHANGELOG.md` 被计入 ⇒ 恒 ≥1、无判别力）。
                 **同维补扫「已合并 PR 的 head 分支未删」（僵尸分支 · #TASK-ORCH-GOV-20260910-01 AC-3）**：
                 列远端分支（`git ls-remote --heads origin`），对每个**非 main 分支**逐条跑下方硬前置（**判据仅 (a)(b) 两条、二者同时满足才删**）：
                   (a) 该分支**不是任一 open PR 的 head_ref**——**唯一判据源**＝`cnb pulls list-pulls --repo ${CNB_REPO_SLUG} --state open --page-size 100` 的 `head.ref` 集合（**须取全量分页**：CLI 默认 page-size=10，open PR >10 时列表截断 → 在途分支会被误判为「非 open PR head_ref」，与 (b) 同时命中即**误删在途分支（不可逆）**）；
                       `git ls-remote origin 'refs/pull/*/head'` **不可单独作判据**（该 ref **不区分 open/closed**，凡曾开过 PR 的分支都命中 → 按它判将**恒判「在途」、清理永不执行**）；
                       如仍用它做交叉核验，**命中后必须**再 `cnb pulls get-pull --repo ${CNB_REPO_SLUG} --number <N>` 校验 `state=open` 才算 (a) 命中；命中 open PR 即**在途分支**、禁删；
                   (b) 该分支**确属「已合并未删」**——**两路判据取「或」（任一为真即 (b) 命中）**，二者**均须先 `git fetch origin <分支名>` 取回分支 tip**：
                       **b1（真 merge 族）**：`git merge-base --is-ancestor <分支tip> origin/main` 为真；
                       **b2（squash/rebase 族）**：`cnb pulls get-pull --repo ${CNB_REPO_SLUG} --number <N>` 得 `state=closed ∧ is_merged=true` **且** 分支 tip **等于**该 PR `head.sha`（**须同时满足**，防删「合并后又有新 push」的分支而丢 commit）。
                       ⚠️ **单用 b1 不成立**：squash 合入的分支 tip 非 main 祖先、`is_merged=true` → 单用 b1 该族**永不清、僵尸照旧堆积**；
                       ⚠️ **单用 b2 亦不足**（真 merge 族若 tip≠head.sha 会漏）；**两路都不命中 → 只登记不删**（保守，宁留勿误删）。
                 (a)∧(b) 同时满足 → `cnb git delete-branch --repo ${CNB_REPO_SLUG} --branch <分支名>` 清理；
                 **任一不满足 → 只登记不删**（防误删在途 PR 源分支——已实证同类事故：合并+删源分支与在途 push 竞态致 commit 静默丢失、无告警，见 #125 待办 F-47）。
              2. 扫 open 的【单任务台账 Issue】（验收清单全满足 + 交付报告已留痕）→ 按 AGENTS.md §6.4C 第 6 点 Auto-Close
                 自动关闭（state_reason=completed）；**绝不 close 需求总纲 Issue / 当前仓库唯一 open 对话入口**，
                 严守 AGENTS.md 6.4 约束一/约束二防呆锁；
