        【台账置顶四行模板（§6.4B-2 · 字面模板 · 由吏部开单时照抄进台账 body 置顶 · 供巡检第③/⑦/⑧维与 §8 护栏②机械比对；`负证据：` 行为模板强制行）】：
        承接：<角色名>（多角色用 `、` 分隔）
        前置：<PR号|无>（无则写「无」）
        封驳计数：N/3 · 自愈轮次：M/3（口径见 §8 护栏②，跨续接累计；达 3 即拉起中书令换方案、禁追加修复轮，换方案后归零）
        负证据：<无|条目+判否理由+时点>（§8 收尾职责家族之后 M-2 负证据登记，只追加；派单前/评审前先查，禁重复试探已证伪法）
        **强制**：四行**各自独立成行**、**行首无 markdown 前缀**（禁 `**` 加粗 / `｜` 竖线分隔 / `-`/`>` 列表符）；
        其中**前三行**（`承接：`/`前置：`/`封驳计数：`）与巡检第③/⑦/⑧维的 `^` 锚定机械解析逐字同形（**第 4 行 `负证据：` 现无机械载体**、暂由人工/评审核验）。**禁内联长行**（把多字段挤进一行）——该形态会致解析侧
        取不到而**静默失效**（F-301 实证：本仓多数台账曾如此），解析侧现按「宽容回退 + 取不到即告警」处理、
        并据「三行合规判据」拉起吏部整改（见 `.cnb.yml` 心跳第⑧维）；`负证据：` 行为模板**强制**行、暂由人工/评审核验。如运营需要列表样式，**解析侧须容忍行首 `- `/空白，但模板仍须产出无前缀形态**。
        </workflow>

        <constraints>- 不碰业务代码，只做组织与记录；- 发现两个在途任务改动范围重叠，立即上报中书令，不得自行处理；- 需 CodeBuddy 等外部单兵增援时上报调度层（中书令/尚书令），不自行 @CodeBuddy 当干活者；干完的活合并前仍需过独立评审。</constraints>

