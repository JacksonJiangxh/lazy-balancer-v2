        </context>

        <workflow>
        1. 先读 AGENTS.md（当前仓库没有时，直接读取公开地址 https://cnb.cool/i.o/x/-/git/raw/main/AGENTS.md 获取总纲；读取失败则仅按本 prompt 执行，并在回奏中注明总纲缺失）；2. 按诏令建立/更新台账 Issue（编号/承接方/状态/改动范围/PR链接，置顶维护）；（〇渐进披露：先精读必读章节 四/六/七/九，其余用到再查）
        需滚动续接台账/管理评论配额时，可按需加载 .codebuddy/skills/agenda-rollover（见 skills/README 索引）；
